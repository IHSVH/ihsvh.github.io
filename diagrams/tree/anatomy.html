<svg class="hero" id="hero" viewBox="-160 -200 320 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tree of Life on Flower of Life geometry"></svg>
<p class="cap" id="cap"></p>
<div class="views" id="views" aria-label="Views"></div>
<div class="card" id="card"></div>
<div class="colophon">
  Names, path letters, and colors follow Paul Foster Case, <i>The Tree of Life</i> (B.O.T.A.) — documented. The Flower-of-Life construction is a geometric reading of the standard figure, not a claim about its origin — inference.
<span class="seal">IHSVH</span>
</div>
</main>
<script src="tree.js?v=9"></script>
<script>
(function(){
const T=window.TREE;let api;
api=T.mount({
  draw:{sphereText:'glyph',pathText:'number'},
  views:[
   {id:'kadmon',label:'Descent',layers:['descent'],cap:'The lightning flash: the order of emanation, one to ten, from the crown to the kingdom, through the four worlds.'},
   {id:'count',label:'10 & 22',cap:'Ten spheres, twenty-two paths: thirty-two. The four worlds are the four circles, centered on Kether, Daath, Tiphareth, and Yesod; the side spheres sit on their seams. The dashed ring is Daath — a position, not a sphere.'},
   {id:'pillars',label:'Pillars',layers:['pillars'],cap:'Three pillars. Form on the left, Force on the right, Mildness between. Every sphere belongs to one; the paths that run along a pillar take its color.'},
   {id:'triads',label:'Triads',layers:['triads'],cap:'Three triangles: the supernal, the ethical, the astral. Malkuth hangs below them, alone.'},
   {id:'flower',label:'Flower',layers:['grid'],cap:'Every sphere is a circle-center of the hexagonal grid. One circle at Tiphareth, radius 2√3, passes through Kether and Malkuth.'},
  ],
  sphere(k){api.markSphere(k);const s=T.byK[k];
    if(k==='daath'){api.card.innerHTML=T.daathCard(api);return;}
    const links=T.P.filter(p=>p.a===k||p.b===k).map(p=>`${p.n} ${p.name}`).join(', ');
    api.card.innerHTML=api.head(s.lat,s.heb,s.n)+api.dl([['Meaning',s.mean],['Color',s.colt],['Pillar',T.PN[s.pillar]],['Triad',s.triad],['World',s.world],['Paths',links]]);},
  path(n){api.markPath(n);const p=T.P.find(x=>x.n===n);
    api.card.innerHTML=api.head(p.name,p.l,p.n)+api.dl([['Joins',`${T.byK[p.a].lat} — ${T.byK[p.b].lat}`],['Letter',`${p.kind} · ${p.n-10} of 22`],['Runs',p.along?'along the pillar of '+T.PN[p.along]:'between pillars']]);},
});
})();
</script>
</body>
