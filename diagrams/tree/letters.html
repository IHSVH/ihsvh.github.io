<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The Tree — Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,400;0,500;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tree.css?v=9">
</head>
<body>
<main class="page">
<h1>THE TREE</h1>
<p class="sub">Letters</p>
<nav><a href="anatomy.html">Anatomy</a><a href="names.html">Names</a><a href="letters.html" aria-current="page">Letters</a></nav>
<svg class="hero" id="hero" viewBox="-160 -200 320 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tree of Life on Flower of Life geometry"></svg>
<p class="cap" id="cap"></p>
<div class="views" id="views" aria-label="Views"></div>
<div class="card" id="card"></div>
<div class="wrap"><table id="t"><thead><tr><th>№</th><th>Letter</th><th>Meaning</th><th>Joins</th><th>Attribution</th><th>Key</th></tr></thead><tbody></tbody></table></div>
<div class="colophon">
  Letter attributions, path colors, and Tarot keys follow Paul Foster Case, <i>The Tree of Life</i> and <i>The Tarot</i> (B.O.T.A.); the three classes of letters follow Sefer Yetzirah — documented.
<span class="seal">IHSVH</span>
</div>
</main>
<script src="tree.js?v=9"></script>
<script>
(function(){
const T=window.TREE;let api;
const KIND={Mother:'Mother — element',Double:'Double — planet',Simple:'Simple — sign'};
api=T.mount({
  draw:{sphereText:'number',pathText:'letter',pathColor:true},
  views:[
   {id:'letters',label:'22',cap:'Twenty-two letters on twenty-two paths, numbered eleven to thirty-two after the ten spheres. Each path takes the color of its attribution on the twelve-color wheel.'},
   {id:'mothers',label:'3 Mothers',cap:'Three mothers, three elements: Aleph air, Mem water, Shin fire. Two are horizontals; Shin rises to Malkuth.'},
   {id:'doubles',label:'7 Doubles',cap:'Seven doubles, seven planets. Each letter has a hard and a soft sound; each planet a pair of opposites.'},
   {id:'simples',label:'12 Simples',cap:'Twelve simples, twelve signs. Six run from the sides to the center; six run along or between the sides.'},
  ],
  sphere(k){api.markSphere(k);const s=T.byK[k];
    if(k==='daath'){api.card.innerHTML=T.daathCard(api);return;}
    const links=T.P.filter(p=>p.a===k||p.b===k).map(p=>`<span class="hebrew">${p.l}</span> ${p.name}`).join(', ');
    api.card.innerHTML=api.head(s.lat,s.heb,s.n)+api.dl([['Paths',links],['See','Names']]);},
  path(n){api.markPath(n);const p=T.P.find(x=>x.n===n);
    api.card.innerHTML=api.head(p.name,p.l,p.n)+api.dl([['Meaning',p.mean],['Joins',`${T.byK[p.a].lat} — ${T.byK[p.b].lat}`],['Class',KIND[p.kind]],['Attribution',p.attr],['Color',p.colt],['Tarot key',p.key]]);},
});
const tb=document.querySelector('#t tbody');
T.P.forEach(p=>{const tr=document.createElement('tr');tr.dataset.k=p.n;
  tr.innerHTML=`<td>${p.n}</td><td>${p.name} <span class="hebrew">${p.l}</span></td><td>${p.mean}</td><td>${T.byK[p.a].lat} — ${T.byK[p.b].lat}</td><td>${p.attr}</td><td>${p.key}</td>`;
  tr.addEventListener('click',()=>{api.hero.scrollIntoView({behavior:'smooth',block:'start'});api.markPath(p.n);document.querySelectorAll('.hit')[p.n-11].dispatchEvent(new Event('click'));});tb.appendChild(tr);});
})();
</script>
</body>
</html>
