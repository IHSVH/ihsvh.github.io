 stone which the builders rejected Is become the head of the corner.","This is Jehovah’s doing; It is marvellous in our eyes.","This is the day which Jehovah hath made; We will rejoice and be glad in it.","Save now, we beseech thee, O Jehovah: O Jehovah, we beseech thee, send now prosperity.","Blessed be he that cometh in the name of Jehovah: We have blessed you out of the house of Jehovah.","Jehovah is God, and he hath given us light: Bind the sacrifice with cords, even unto the horns of the altar.","Thou art my God, and I will give thanks unto thee: Thou art my God, I will exalt thee.","Oh give thanks unto Jehovah; for he is good; For his lovingkindness endureth for ever."],"119":["Blessed are they that are perfect in the way, Who walk in the law of Jehovah.","Blessed are they that keep his testimonies, That seek him with the whole heart.","Yea, they do no unrighteousness; They walk in his ways.","Thou hast commanded us thy precepts, That we should observe them diligently.","Oh that my ways were established To observe thy statutes!","Then shall I not be put to shame, When I have respect unto all thy commandments.","I will give thanks unto thee with uprightness of heart, When I learn thy righteous judgments.","I will observe thy statutes: Oh forsake me not utterly. ב BETH.","Wherewith shall a young man cleanse his way? By taking heed thereto according to thy word.","With my whole heart have I sought thee: Oh let me not wander from thy commandments.","Thy word have I laid up in my heart, That I might not sin against thee.","Blessed art thou, O Jehovah: Teach me thy statutes.","With my lips have I declared All the ordinances of thy mouth.","I have rejoiced in the way of thy testimonies, As much as in all riches.","I will meditate on thy precepts, And have respect unto thy ways.","I will delight myself in thy statutes: I will not forget thy word. ג GIMEL.","Deal bountifully with thy servant, that I may live; So will I observe thy word.","Open thou mine eyes, that I may behold Wondrous things out of thy law.","I am a sojourner in the earth: Hide not thy commandments from me.","My soul breaketh for the longing That it hath unto thine ordinances at all times.","Thou hast rebuked the proud that are cursed, That do wander from thy commandments.","Take away from me reproach and contempt; For I have kept thy testimonies.","Princes also sat and talked against me; But thy servant did meditate on thy statutes.","Thy testimonies also are my delight And my counsellors. ד DALETH.","My soul cleaveth unto the dust: Quicken thou me according to thy word.","I declared my ways, and thou answeredst me: Teach me thy statutes.","Make me to understand the way of thy precepts: So shall I meditate on thy wondrous works.","My soul melteth for heaviness: Strengthen thou me according unto thy word.","Remove from me the way of falsehood; And grant me thy law graciously.","I have chosen the way of faithfulness: Thine ordinances have I set before me.","I cleave unto thy testimonies: O Jehovah, put me not to shame.","I will run the way of thy commandments, When thou shalt enlarge my heart. ה HE.","Teach me, O Jehovah, the way of thy statutes; And I shall keep it unto the end.","Give me understanding, and I shall keep thy law; Yea, I shall observe it with my whole heart.","Make me to go in the path of thy commandments; For therein do I delight.","Incline my heart unto thy testimonies, And not to covetousness.","Turn away mine eyes from beholding vanity, And quicken me in thy ways.","Confirm unto thy servant thy word, Which is in order unto the fear of thee.","Turn away my reproach whereof I am afraid; For thine ordinances are good.","Behold, I have longed after thy precepts: Quicken me in thy righteousness. ו VAV.","Let thy lovingkindnesses also come unto me, O Jehovah, Even thy salvation, according to thy word.","So shall I have an answer for him that reproacheth me; For I trust in thy word.","And take not the word of truth utterly out of my mouth; For I have hoped in thine ordinances.","So shall I observe thy law continually For ever and ever.","And I shall walk at liberty; For I have sought thy precepts.","I will also speak of thy testimonies before kings, And shall not be put to shame.","And I will delight myself in thy commandments, Which I have loved.","I will lift up my hands also unto thy commandments, which I have loved; And I will meditate on thy statutes. ז ZAYIN.","Remember the word unto thy servant, Because thou hast made me to hope.","This is my comfort in my affliction; For thy word hath quickened me.","The proud have had me greatly in derision: Yet have I not swerved from thy law.","I have remembered thine ordinances of old, O Jehovah, And have comforted myself.","Hot indignation hath taken hold upon me, Because of the wicked that forsake thy law.","Thy statutes have been my songs In the house of my pilgrimage.","I have remembered thy name, O Jehovah, in the night, And have observed thy law.","This I have had, Because I have kept thy precepts. ח HHETH.","Jehovah is my portion: I have said that I would observe thy words.","I entreated thy favor with my whole heart: Be merciful unto me according to thy word.","I thought on my ways, And turned my feet unto thy testimonies.","I made haste, and delayed not, To observe thy commandments.","The cords of the wicked have wrapped me round; But I have not forgotten thy law.","At midnight I will rise to give thanks unto thee Because of thy righteous ordinances.","I am a companion of all them that fear thee, And of them that observe thy precepts.","The earth, O Jehovah, is full of thy lovingkindness: Teach me thy statutes. ט TETH.","Thou hast dealt well with thy servant, O Jehovah, according unto thy word.","Teach me good judgment and knowledge; For I have believed in thy commandments.","Before I was afflicted I went astray; But now I observe thy word.","Thou art good, and doest good; Teach me thy statutes.","The proud have forged a lie against me: With my whole heart will I keep thy precepts.","Their heart is as fat as grease; But I delight in thy law.","It is good for me that I have been afflicted; That I may learn thy statutes.","The law of thy mouth is better unto me Than thousands of gold and silver. י YODH.","Thy hands have made me and fashioned me: Give me understanding, that I may learn thy commandments.","They that fear thee shall see me and be glad, Because I have hoped in thy word.","I know, O Jehovah, that thy judgments are righteous, And that in faithfulness thou hast afflicted me.","Let, I pray thee, thy lovingkindness be for my comfort, According to thy word unto thy servant.","Let thy tender mercies come unto me, that I may live; For thy law is my delight.","Let the proud be put to shame; for they have overthrown me wrongfully: But I will meditate on thy precepts.","Let those that fear thee turn unto me; And they shall know thy testimonies.","Let my heart be perfect in thy statutes, That I be not put to shame. כ KAPH.","My soul fainteth for thy salvation; But I hope in thy word.","Mine eyes fail for thy word, While I say, When wilt thou comfort me?","For I am become like a wine-skin in the smoke; Yet do I not forget thy statutes.","How many are the days of thy servant? When wilt thou execute judgment on them that persecute me?","The proud have digged pits for me, Who are not according to thy law.","All thy commandments are faithful: They persecute me wrongfully; help thou me.","They had almost consumed me upon earth; But I forsook not thy precepts.","Quicken me after thy lovingkindness; So shall I observe the testimony of thy mouth. ל LAMEDH.","For ever, O Jehovah, Thy word is settled in heaven.","Thy faithfulness is unto all generations: Thou hast established the earth, and it abideth.","They abide this day according to thine ordinances; For all things are thy servants.","Unless thy law had been my delight, I should then have perished in mine affliction.","I will never forget thy precepts; For with them thou hast quickened me.","I am thine, save me; For I have sought thy precepts.","The wicked have waited for me, to destroy me; But I will consider thy testimonies.","I have seen an end of all perfection; But thy commandment is exceeding broad. מ MEM.","Oh how love I thy law! It is my meditation all the day.","Thy commandments make me wiser than mine enemies; For they are ever with me.","I have more understanding than all my teachers; For thy testimonies are my meditation.","I understand more than the aged, Because I have kept thy precepts.","I have refrained my feet from every evil way, That I might observe thy word.","I have not turned aside from thine ordinances; For thou hast taught me.","How sweet are thy words unto my taste! Yea, sweeter than honey to my mouth!","Through thy precepts I get understanding: Therefore I hate every false way. נ NUN.","Thy word is a lamp unto my feet, And light unto my path.","I have sworn, and have confirmed it, That I will observe thy righteous ordinances.","I am afflicted very much: Quicken me, O Jehovah, according unto thy word.","Accept, I beseech thee, the freewill-offerings of my mouth, O Jehovah, And teach me thine ordinances.","My soul is continually in my hand; Yet do I not forget thy law.","The wicked have laid a snare for me; Yet have I not gone astray from thy precepts.","Thy testimonies have I taken as a heritage for ever; For they are the rejoicing of my heart.","I have inclined my heart to perform thy statutes For ever, even unto the end. ס SAMEKH.","I hate them that are of a double mind; But thy law do I love.","Thou art my hiding-place and my shield: I hope in thy word.","Depart from me, ye evil-doers, That I may keep the commandments of my God.","Uphold me according unto thy word, that I may live; And let me not be ashamed of my hope.","Hold thou me up, and I shall be safe, And shall have respect unto thy statutes continually.","Thou hast set at nought all them that err from thy statutes; For their deceit is falsehood.","Thou puttest away all the wicked of the earth like dross: Therefore I love thy testimonies.","My flesh trembleth for fear of thee; And I am afraid of thy judgments. ע AYIN.","I have done justice and righteousness: Leave me not to mine oppressors.","Be surety for thy servant for good: Let not the proud oppress me.","Mine eyes fail for thy salvation, And for thy righteous word.","Deal with thy servant according unto thy lovingkindness, And teach me thy statutes.","I am thy servant; give me understanding, That I may know thy testimonies.","It is time for Jehovah to work; For they have made void thy law.","Therefore I love thy commandments Above gold, yea, above fine gold.","Therefore I esteem all thy precepts concerning all things to be right; And I hate every false way. פ PE.","Thy testimonies are wonderful; Therefore doth my soul keep them.","The opening of thy words giveth light; It giveth understanding unto the simple.","I opened wide my mouth, and panted; For I longed for thy commandments.","Turn thee unto me, and have mercy upon me, As thou usest to do unto those that love thy name.","Establish my footsteps in thy word; And let not any iniquity have dominion over me.","Redeem me from the oppression of man: So will I observe thy precepts.","Make thy face to shine upon thy servant; And teach me thy statutes.","Streams of water run down mine eyes, Because they observe not thy law. צ TSADHE.","Righteous art thou, O Jehovah, And upright are thy judgments.","Thou hast commanded thy testimonies in righteousness And very faithfulness.","My zeal hath consumed me, Because mine adversaries have forgotten thy words.","Thy word is very pure; Therefore thy servant loveth it.","I am small and despised; Yet do I not forget thy precepts.","Thy righteousness is an everlasting righteousness, And thy law is truth.","Trouble and anguish have taken hold on me; Yet thy commandments are my delight.","Thy testimonies are righteous for ever: Give me understanding, and I shall live. ק QOPH.","I have called with my whole heart; answer me, O Jehovah: I will keep thy statutes.","I have called unto thee; save me, And I shall observe thy testimonies.","I anticipated the dawning of the morning, and cried: I hoped in thy words.","Mine eyes anticipated the night-watches, That I might meditate on thy word.","Hear my voice according unto thy lovingkindness: Quicken me, O Jehovah, according to thine ordinances.","They draw nigh that follow after wickedness; They are far from thy law.","Thou art nigh, O Jehovah; And all thy commandments are truth.","Of old have I known from thy testimonies, That thou hast founded them for ever. ר RESH.","Consider mine affliction, and deliver me; For I do not forget thy law.","Plead thou my cause, and redeem me: Quicken me according to thy word.","Salvation is far from the wicked; For they seek not thy statutes.","Great are thy tender mercies, O Jehovah: Quicken me according to thine ordinances.","Many are my persecutors and mine adversaries; Yet have I not swerved from thy testimonies.","I beheld the treacherous, and was grieved, Because they observe not thy word.","Consider how I love thy precepts: Quicken me, O Jehovah, according to thy lovingkindness.","The sum of thy word is truth; And every one of thy righteous ordinances endureth for ever. ש SHIN.","Princes have persecuted me without a cause; But my heart standeth in awe of thy words.","I rejoice at thy word, As one that findeth great spoil.","I hate and abhor falsehood; But thy law do I love.","Seven times a day do I praise thee, Because of thy righteous ordinances.","Great peace have they that love thy law; And they have no occasion of stumbling.","I have hoped for thy salvation, O Jehovah, And have done thy commandments.","My soul hath observed thy testimonies; And I love them exceedingly.","I have observed thy precepts and thy testimonies; For all my ways are before thee. ת TAV.","Let my cry come near before thee, O Jehovah: Give me understanding according to thy word.","Let my supplication come before thee: Deliver me according to thy word.","Let my lips utter praise; For thou teachest me thy statutes.","Let my tongue sing of thy word; For all thy commandments are righteousness.","Let thy hand be ready to help me; For I have chosen thy precepts.","I have longed for thy salvation, O Jehovah; And thy law is my delight.","Let my soul live, and it shall praise thee; And let thine ordinances help me.","I have gone astray like a lost sheep; seek thy servant; For I do not forget thy commandments."],"127":["A Song of Ascents; of Solomon. Except Jehovah build the house, They labor in vain that build it: Except Jehovah keep the city, The watchman waketh but in vain.","It is vain for you to rise up early, To take rest late, To eat the bread of toil; For so he giveth unto his beloved sleep.","Lo, children are a heritage of Jehovah; And the fruit of the womb is his reward.","As arrows in the hand of a mighty man, So are the children of youth.","Happy is the man that hath his quiver full of them: They shall not be put to shame, When they speak with their enemies in the gate."],"130":["A Song of Ascents. Out of the depths have I cried unto thee, O Jehovah.","Lord, hear my voice: Let thine ears be attentive To the voice of my supplications.","If thou, Jehovah, shouldest mark iniquities, O Lord, who could stand?","But there is forgiveness with thee, That thou mayest be feared.","I wait for Jehovah, my soul doth wait, And in his word do I hope.","My soul waiteth for the Lord More than watchmen wait for the morning; Yea, more than watchmen for the morning.","O Israel, hope in Jehovah; For with Jehovah there is lovingkindness, And with him is plenteous redemption.","And he will redeem Israel From all his iniquities."]},"Isaiah":{"5":["Let me sing for my wellbeloved a song of my beloved touching his vineyard. My wellbeloved had a vineyard in a very fruitful hill:","and he digged it, and gathered out the stones thereof, and planted it with the choicest vine, and built a tower in the midst of it, and also hewed out a winepress therein: and he looked that it should bring forth grapes, and it brought forth wild grapes.","And now, O inhabitants of Jerusalem and men of Judah, judge, I pray you, betwixt me and my vineyard.","What could have been done more to my vineyard, that I have not done in it? wherefore, when I looked that it should bring forth grapes, brought it forth wild grapes?","And now I will tell you what I will do to my vineyard: I will take away the hedge thereof, and it shall be eaten up; I will break down the wall thereof, and it shall be trodden down:","and I will lay it waste; it shall not be pruned nor hoed; but there shall come up briers and thorns: I will also command the clouds that they rain no rain upon it.","For the vineyard of Jehovah of hosts is the house of Israel, and the men of Judah his pleasant plant: and he looked for justice, but, behold, oppression; for righteousness, but, behold, a cry.","Woe unto them that join house to house, that lay field to field, till there be no room, and ye be made to dwell alone in the midst of the land!","In mine ears saith Jehovah of hosts, Of a truth many houses shall be desolate, even great and fair, without inhabitant.","For ten acres of vineyard shall yield one bath, and a homer of seed shall yield but an ephah.","Woe unto them that rise up early in the morning, that they may follow strong drink; that tarry late into the night, till wine inflame them!","And the harp and the lute, the tabret and the pipe, and wine, are in their feasts; but they regard not the work of Jehovah, neither have they considered the operation of his hands.","Therefore my people are gone into captivity for lack of knowledge; and their honorable men are famished, and their multitude are parched with thirst.","Therefore Sheol hath enlarged its desire, and opened its mouth without measure; and their glory, and their multitude, and their pomp, and he that rejoiceth among them, descend into it.","And the mean man is bowed down, and the great man is humbled, and the eyes of the lofty are humbled:","but Jehovah of hosts is exalted in justice, and God the Holy One is sanctified in righteousness.","Then shall the lambs feed as in their pasture, and the waste places of the fat ones shall wanderers eat.","Woe unto them that draw iniquity with cords of falsehood, and sin as it were with a cart rope;","that say, Let him make speed, let him hasten his work, that we may see it; and let the counsel of the Holy One of Israel draw nigh and come, that we may know it!","Woe unto them that call evil good, and good evil; that put darkness for light, and light for darkness; that put bitter for sweet, and sweet for bitter!","Woe unto them that are wise in their own eyes, and prudent in their own sight!","Woe unto them that are mighty to drink wine, and men of strength to mingle strong drink;","that justify the wicked for a bribe, and take away the righteousness of the righteous from him!","Therefore as the tongue of fire devoureth the stubble, and as the dry grass sinketh down in the flame, so their root shall be as rottenness, and their blossom shall go up as dust; because they have rejected the law of Jehovah of hosts, and despised the word of the Holy One of Israel.","Therefore is the anger of Jehovah kindled against his people, and he hath stretched forth his hand against them, and hath smitten them; and the mountains tremble, and their dead bodies are as refuse in the midst of the streets. For all this his anger is not turned away, but his hand is stretched out still.","And he will lift up an ensign to the nations from far, and will hiss for them from the end of the earth; and, behold, they shall come with speed swiftly.","None shall be weary nor stumble among them; none shall slumber nor sleep; neither shall the girdle of their loins be loosed, nor the latchet of their shoes be broken:","whose arrows are sharp, and all their bows bent; their horses’ hoofs shall be accounted as flint, and their wheels as a whirlwind:","their roaring shall be like a lioness, they shall roar like young lions; yea, they shall roar, and lay hold of the prey, and carry it away safe, and there shall be none to deliver.","And they shall roar against them in that day like the roaring of the sea: and if one look unto the land, behold, darkness and distress; and the light is darkened in the clouds thereof."],"6":["In the year that king Uzziah died I saw the Lord sitting upon a throne, high and lifted up; and his train filled the temple.","Above him stood the seraphim: each one had six wings; with twain he covered his face, and with twain he covered his feet, and with twain he did fly.","And one cried unto another, and said, Holy, holy, holy, is Jehovah of hosts: the whole earth is full of his glory.","And the foundations of the thresholds shook at the voice of him that cried, and the house was filled with smoke.","Then said I, Woe is me! for I am undone; because I am a man of unclean lips, and I dwell in the midst of a people of unclean lips: for mine eyes have seen the King, Jehovah of hosts.","Then flew one of the seraphim unto me, having a live coal in his hand, which he had taken with the tongs from off the altar:","and he touched my mouth with it, and said, Lo, this hath touched thy lips; and thine iniquity is taken away, and thy sin forgiven.","And I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then I said, Here am I; send me.","And he said, Go, and tell this people, Hear ye indeed, but understand not; and see ye indeed, but perceive not.","Make the heart of this people fat, and make their ears heavy, and shut their eyes; lest they see with their eyes, and hear with their ears, and understand with their heart, and turn again, and be healed.","Then said I, Lord, how long? And he answered, Until cities be waste without inhabitant, and houses without man, and the land become utterly waste,","and Jehovah have removed men far away, and the forsaken places be many in the midst of the land.","And if there be yet a tenth in it, it also shall in turn be eaten up: as a terebinth, and as an oak, whose stock remaineth, when they are felled; so the holy seed is the stock thereof."],"53":["Who hath believed our message? and to whom hath the arm of Jehovah been revealed?","For he grew up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we see him, there is no beauty that we should desire him.","He was despised, and rejected of men; a man of sorrows, and acquainted with grief: and as one from whom men hide their face he was despised; and we esteemed him not.","Surely he hath borne our griefs, and carried our sorrows; yet we did esteem him stricken, smitten of God, and afflicted.","But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him; and with his stripes we are healed.","All we like sheep have gone astray; we have turned every one to his own way; and Jehovah hath laid on him the iniquity of us all.","He was oppressed, yet when he was afflicted he opened not his mouth; as a lamb that is led to the slaughter, and as a sheep that before its shearers is dumb, so he opened not his mouth.","By oppression and judgment he was taken away; and as for his generation, who among them considered that he was cut off out of the land of the living for the transgression of my people to whom the stroke was due?","And they made his grave with the wicked, and with a rich man in his death; although he had done no violence, neither was any deceit in his mouth.","Yet it pleased Jehovah to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of Jehovah shall prosper in his hand.","He shall see of the travail of his soul, and shall be satisfied: by the knowledge of himself shall my righteous servant justify many; and he shall bear their iniquities.","Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he poured out his soul unto death, and was numbered with the transgressors: yet he bare the sin of many, and made intercession for the transgressors."]},"Jeremiah":{"2":["And the word of Jehovah came to me, saying,","Go, and cry in the ears of Jerusalem, saying, Thus saith Jehovah, I remember for thee the kindness of thy youth, the love of thine espousals; how thou wentest after me in the wilderness, in a land that was not sown.","Israel was holiness unto Jehovah, the first-fruits of his increase: all that devour him shall be held guilty; evil shall come upon them, saith Jehovah.","Hear ye the word of Jehovah, O house of Jacob, and all the families of the house of Israel:","Thus saith Jehovah, What unrighteousness have your fathers found in me, that they are gone far from me, and have walked after vanity, and are become vain?","Neither said they, Where is Jehovah that brought us up out of the land of Egypt, that led us through the wilderness, through a land of deserts and of pits, through a land of drought and of the shadow of death, through a land that none passed through, and where no man dwelt?","And I brought you into a plentiful land, to eat the fruit thereof and the goodness thereof; but when ye entered, ye defiled my land, and made my heritage an abomination.","The priests said not, Where is Jehovah? and they that handle the law knew me not: the rulers also transgressed against me, and the prophets prophesied by Baal, and walked after things that do not profit.","Wherefore I will yet contend with you, saith Jehovah, and with your children’s children will I contend.","For pass over to the isles of Kittim, and see; and send unto Kedar, and consider diligently; and see if there hath been such a thing.","Hath a nation changed its gods, which yet are no gods? but my people have changed their glory for that which doth not profit.","Be astonished, O ye heavens, at this, and be horribly afraid, be ye very desolate, saith Jehovah.","For my people have committed two evils: they have forsaken me, the fountain of living waters, and hewed them out cisterns, broken cisterns, that can hold no water.","Is Israel a servant? is he a home-born slave? why is he become a prey?","The young lions have roared upon him, and yelled; and they have made his land waste: his cities are burned up, without inhabitant.","The children also of Memphis and Tahpanhes have broken the crown of thy head.","Hast thou not procured this unto thyself, in that thou hast forsaken Jehovah thy God, when he led thee by the way?","And now what hast thou to do in the way to Egypt, to drink the waters of the Shihor? or what hast thou to do in the way to Assyria, to drink the waters of the River?","Thine own wickedness shall correct thee, and thy backslidings shall reprove thee: know therefore and see that it is an evil thing and a bitter, that thou hast forsaken Jehovah thy God, and that my fear is not in thee, saith the Lord, Jehovah of hosts.","For of old time I have broken thy yoke, and burst thy bonds; and thou saidst, I will not serve; for upon every high hill and under every green tree thou didst bow thyself, playing the harlot.","Yet I had planted thee a noble vine, wholly a right seed: how then art thou turned into the degenerate branches of a foreign vine unto me?","For though thou wash thee with lye, and take thee much soap, yet thine iniquity is marked before me, saith the Lord Jehovah.","How canst thou say, I am not defiled, I have not gone after the Baalim? see thy way in the valley, know what thou hast done: thou art a swift dromedary traversing her ways;","a wild ass used to the wilderness, that snuffeth up the wind in her desire; in her occasion who can turn her away? all they that seek her will not weary themselves; in her month they shall find her.","Withhold thy foot from being unshod, and thy throat from thirst. But thou saidst, It is in vain; no, for I have loved strangers, and after them will I go.","As the thief is ashamed when he is found, so is the house of Israel ashamed; they, their kings, their princes, and their priests, and their prophets;","who say to a stock, Thou art my father; and to a stone, Thou hast brought me forth: for they have turned their back unto me, and not their face; but in the time of their trouble they will say, Arise, and save us.","But where are thy gods that thou hast made thee? let them arise, if they can save thee in the time of thy trouble: for according to the number of thy cities are thy gods, O Judah.","Wherefore will ye contend with me? ye all have transgressed against me, saith Jehovah.","In vain have I smitten your children; they received no correction: your own sword hath devoured your prophets, like a destroying lion.","O generation, see ye the word of Jehovah. Have I been a wilderness unto Israel? or a land of thick darkness? wherefore say my people, We are broken loose; we will come no more unto thee?","Can a virgin forget her ornaments, or a bride her attire? yet my people have forgotten me days without number.","How trimmest thou thy way to seek love! therefore even the wicked women hast thou taught thy ways.","Also in thy skirts is found the blood of the souls of the innocent poor: thou didst not find them breaking in; but it is because of all these things.","Yet thou saidst, I am innocent; surely his anger is turned away from me. Behold, I will enter into judgment with thee, because thou sayest, I have not sinned.","Why gaddest thou about so much to change thy way? thou shalt be ashamed of Egypt also, as thou wast ashamed of Assyria.","From thence also shalt thou go forth, with thy hands upon thy head: for Jehovah hath rejected those in whom thou trustest, and thou shalt not prosper with them."]},"Ezekiel":{"15":["And the word of Jehovah came unto me, saying,","Son of man, what is the vine-tree more than any tree, the vine-branch which is among the trees of the forest?","Shall wood be taken thereof to make any work? or will men take a pin of it to hang any vessel thereon?","Behold, it is cast into the fire for fuel; the fire hath devoured both the ends of it, and the midst of it is burned: is it profitable for any work?","Behold, when it was whole, it was meet for no work: how much less, when the fire hath devoured it, and it is burned, shall it yet be meet for any work!","Therefore thus saith the Lord Jehovah: As the vine-tree among the trees of the forest, which I have given to the fire for fuel, so will I give the inhabitants of Jerusalem.","And I will set my face against them; they shall go forth from the fire, but the fire shall devour them; and ye shall know that I am Jehovah, when I set my face against them.","And I will make the land desolate, because they have committed a trespass, saith the Lord Jehovah."],"36":["And thou, son of man, prophesy unto the mountains of Israel, and say, Ye mountains of Israel, hear the word of Jehovah.","Thus saith the Lord Jehovah: Because the enemy hath said against you, Aha! and, The ancient high places are ours in possession;","therefore prophesy, and say, Thus saith the Lord Jehovah: Because, even because they have made you desolate, and swallowed you up on every side, that ye might be a possession unto the residue of the nations, and ye are taken up in the lips of talkers, and the evil report of the people;","therefore, ye mountains of Israel, hear the word of the Lord Jehovah: Thus saith the Lord Jehovah to the mountains and to the hills, to the watercourses and to the valleys, to the desolate wastes and to the cities that are forsaken, which are become a prey and derision to the residue of the nations that are round about;","therefore thus saith the Lord Jehovah: Surely in the fire of my jealousy have I spoken against the residue of the nations, and against all Edom, that have appointed my land unto themselves for a possession with the joy of all their heart, with despite of soul, to cast it out for a prey.","Therefore prophesy concerning the land of Israel, and say unto the mountains and to the hills, to the watercourses and to the valleys, Thus saith the Lord Jehovah: Behold, I have spoken in my jealousy and in my wrath, because ye have borne the shame of the nations:","therefore thus saith the Lord Jehovah: I have sworn, saying, Surely the nations that are round about you, they shall bear their shame.","But ye, O mountains of Israel, ye shall shoot forth your branches, and yield your fruit to my people Israel; for they are at hand to come.","For, behold, I am for you, and I will turn unto you, and ye shall be tilled and sown;","and I will multiply men upon you, all the house of Israel, even all of it; and the cities shall be inhabited, and the waste places shall be builded;","and I will multiply upon you man and beast; and they shall increase and be fruitful; and I will cause you to be inhabited after your former estate, and will do better unto you than at your beginnings: and ye shall know that I am Jehovah.","Yea, I will cause men to walk upon you, even my people Israel; and they shall possess thee, and thou shalt be their inheritance, and thou shalt no more henceforth bereave them of children.","Thus saith the Lord Jehovah: Because they say unto you, Thou land art a devourer of men, and hast been a bereaver of thy nation;","therefore thou shalt devour men no more, neither bereave thy nation any more, saith the Lord Jehovah;","neither will I let thee hear any more the shame of the nations, neither shalt thou bear the reproach of the peoples any more, neither shalt thou cause thy nation to stumble any more, saith the Lord Jehovah.","Moreover the word of Jehovah came unto me, saying,","Son of man, when the house of Israel dwelt in their own land, they defiled it by their way and by their doings: their way before me was as the uncleanness of a woman in her impurity.","Wherefore I poured out my wrath upon them for the blood which they had poured out upon the land, and because they had defiled it with their idols;","and I scattered them among the nations, and they were dispersed through the countries: according to their way and according to their doings I judged them.","And when they came unto the nations, whither they went, they profaned my holy name; in that men said of them, These are the people of Jehovah, and are gone forth out of his land.","But I had regard for my holy name, which the house of Israel had profaned among the nations, whither they went.","Therefore say unto the house of Israel, Thus saith the Lord Jehovah: I do not this for your sake, O house of Israel, but for my holy name, which ye have profaned among the nations, whither ye went.","And I will sanctify my great name, which hath been profaned among the nations, which ye have profaned in the midst of them; and the nations shall know that I am Jehovah, saith the Lord Jehovah, when I shall be sanctified in you before their eyes.","For I will take you from among the nations, and gather you out of all the countries, and will bring you into your own land.","And I will sprinkle clean water upon you, and ye shall be clean: from all your filthiness, and from all your idols, will I cleanse you.","A new heart also will I give you, and a new spirit will I put within you; and I will take away the stony heart out of your flesh, and I will give you a heart of flesh.","And I will put my Spirit within you, and cause you to walk in my statutes, and ye shall keep mine ordinances, and do them.","And ye shall dwell in the land that I gave to your fathers; and ye shall be my people, and I will be your God.","And I will save you from all your uncleannesses: and I will call for the grain, and will multiply it, and lay no famine upon you.","And I will multiply the fruit of the tree, and the increase of the field, that ye may receive no more the reproach of famine among the nations.","Then shall ye remember your evil ways, and your doings that were not good; and ye shall loathe yourselves in your own sight for your iniquities and for your abominations.","Nor for your sake do I this, saith the Lord Jehovah, be it known unto you: be ashamed and confounded for your ways, O house of Israel.","Thus saith the Lord Jehovah: In the day that I cleanse you from all your iniquities, I will cause the cities to be inhabited, and the waste places shall be builded.","And the land that was desolate shall be tilled, whereas it was a desolation in the sight of all that passed by.","And they shall say, This land that was desolate is become like the garden of Eden; and the waste and desolate and ruined cities are fortified and inhabited.","Then the nations that are left round about you shall know that I, Jehovah, have builded the ruined places, and planted that which was desolate: I, Jehovah, have spoken it, and I will do it.","Thus saith the Lord Jehovah: For this, moreover, will I be inquired of by the house of Israel, to do it for them: I will increase them with men like a flock.","As the flock for sacrifice, as the flock of Jerusalem in her appointed feasts, so shall the waste cities be filled with flocks of men; and they shall know that I am Jehovah."]},"Zechariah":{"9":["The burden of the word of Jehovah upon the land of Hadrach, and Damascus shall be its resting-place (for the eye of man and of all the tribes of Israel is toward Jehovah);","and Hamath, also, which bordereth thereon; Tyre and Sidon, because they are very wise.","And Tyre did build herself a stronghold, and heaped up silver as the dust, and fine gold as the mire of the streets.","Behold, the Lord will dispossess her, and he will smite her power in the sea; and she shall be devoured with fire.","Ashkelon shall see it, and fear; Gaza also, and shall be sore pained; and Ekron, for her expectation shall be put to shame; and the king shall perish from Gaza, and Ashkelon shall not be inhabited.","And a bastard shall dwell in Ashdod, and I will cut off the pride of the Philistines.","And I will take away his blood out of his mouth, and his abominations from between his teeth; and he also shall be a remnant for our God; and he shall be as a chieftain in Judah, and Ekron as a Jebusite.","And I will encamp about my house against the army, that none pass through or return; and no oppressor shall pass through them any more: for now have I seen with mine eyes.","Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy king cometh unto thee; he is just, and having salvation; lowly, and riding upon an ass, even upon a colt the foal of an ass.","And I will cut off the chariot from Ephraim, and the horse from Jerusalem; and the battle bow shall be cut off; and he shall speak peace unto the nations: and his dominion shall be from sea to sea, and from the River to the ends of the earth.","As for thee also, because of the blood of thy covenant I have set free thy prisoners from the pit wherein is no water.","Turn you to the stronghold, ye prisoners of hope: even to-day do I declare that I will render double unto thee.","For I have bent Judah for me, I have filled the bow with Ephraim; and I will stir up thy sons, O Zion, against thy sons, O Greece, and will make thee as the sword of a mighty man.","And Jehovah shall be seen over them; and his arrow shall go forth as the lightning; and the Lord Jehovah will blow the trumpet, and will go with whirlwinds of the south.","Jehovah of hosts will defend them; and they shall devour, and shall tread down the sling-stones; and they shall drink, and make a noise as through wine; and they shall be filled like bowls, like the corners of the altar.","And Jehovah their God will save them in that day as the flock of his people; for they shall be as the stones of a crown, lifted on high over his land.","For how great is his goodness, and how great is his beauty! grain shall make the young men flourish, and new wine the virgins."]},"Matthew":{"5":["And seeing the multitudes, he went up into the mountain: and when he had sat down, his disciples came unto him:","and he opened his mouth and taught them, saying,","Blessed are the poor in spirit: for theirs is the kingdom of heaven.","Blessed are they that mourn: for they shall be comforted.","Blessed are the meek: for they shall inherit the earth.","Blessed are they that hunger and thirst after righteousness: for they shall be filled.","Blessed are the merciful: for they shall obtain mercy.","Blessed are the pure in heart: for they shall see God.","Blessed are the peacemakers: for they shall be called sons of God.","Blessed are they that have been persecuted for righteousness’ sake: for theirs is the kingdom of heaven.","Blessed are ye when men shall reproach you, and persecute you, and say all manner of evil against you falsely, for my sake.","Rejoice, and be exceeding glad: for great is your reward in heaven: for so persecuted they the prophets that were before you.","Ye are the salt of the earth: but if the salt have lost its savor, wherewith shall it be salted? it is thenceforth good for nothing, but to be cast out and trodden under foot of men.","Ye are the light of the world. A city set on a hill cannot be hid.","Neither do men light a lamp, and put it under the bushel, but on the stand; and it shineth unto all that are in the house.","Even so let your light shine before men; that they may see your good works, and glorify your Father who is in heaven.","Think not that I came to destroy the law or the prophets: I came not to destroy, but to fulfil.","For verily I say unto you, Till heaven and earth pass away, one jot or one tittle shall in no wise pass away from the law, till all things be accomplished.","Whosoever therefore shall break one of these least commandments, and shall teach men so, shall be called least in the kingdom of heaven: but whosoever shall do and teach them, he shall be called great in the kingdom of heaven.","For I say unto you, that except your righteousness shall exceed the righteousness of the scribes and Pharisees, ye shall in no wise enter into the kingdom of heaven.","Ye have heard that it was said to them of old time, Thou shalt not kill; and whosoever shall kill shall be in danger of the judgment:","but I say unto you, that every one who is angry with his brother shall be in danger of the judgment; and whosoever shall say to his brother, Raca, shall be in danger of the council; and whosoever shall say, Thou fool, shall be in danger of the hell of fire.","If therefore thou art offering thy gift at the altar, and there rememberest that thy brother hath aught against thee,","leave there thy gift before the altar, and go thy way, first be reconciled to thy brother, and then come and offer thy gift.","Agree with thine adversary quickly, while thou art with him in the way; lest haply the adversary deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison.","Verily I say unto thee, Thou shalt by no means come out thence, till thou have paid the last farthing.","Ye have heard that it was said, Thou shalt not commit adultery:","but I say unto you, that every one that looketh on a woman to lust after her hath committed adultery with her already in his heart.","And if thy right eye causeth thee to stumble, pluck it out, and cast it from thee: for it is profitable for thee that one of thy members should perish, and not thy whole body be cast into hell.","And if thy right hand causeth thee to stumble, cut it off, and cast it from thee: for it is profitable for thee that one of thy members should perish, and not thy whole body go into hell.","It was said also, Whosoever shall put away his wife, let him give her a writing of divorcement:","but I say unto you, that every one that putteth away his wife, saving for the cause of fornication, maketh her an adulteress: and whosoever shall marry her when she is put away committeth adultery.","Again, ye have heard that it was said to them of old time, Thou shalt not forswear thyself, but shalt perform unto the Lord thine oaths:","but I say unto you, Swear not at all; neither by the heaven, for it is the throne of God;","nor by the earth, for it is the footstool of his feet; nor by Jerusalem, for it is the city of the great King.","Neither shalt thou swear by thy head, for thou canst not make one hair white or black.","But let your speech be, Yea, yea; Nay, nay: and whatsoever is more than these is of the evil one.","Ye have heard that it was said, An eye for an eye, and a tooth for a tooth:","but I say unto you, Resist not him that is evil: but whosoever smiteth thee on thy right cheek, turn to him the other also.","And if any man would go to law with thee, and take away thy coat, let him have thy cloak also.","And whosoever shall compel thee to go one mile, go with him two.","Give to him that asketh thee, and from him that would borrow of thee turn not thou away.","Ye have heard that it was said, Thou shalt love thy neighbor, and hate thine enemy:","but I say unto you, Love your enemies, and pray for them that persecute you;","that ye may be sons of your Father who is in heaven: for he maketh his sun to rise on the evil and the good, and sendeth rain on the just and the unjust.","For if ye love them that love you, what reward have ye? do not even the publicans the same?","And if ye salute your brethren only, what do ye more than others? do not even the Gentiles the same?","Ye therefore shall be perfect, as your heavenly Father is perfect."],"10":["And he called unto him his twelve disciples, and gave them authority over unclean spirits, to cast them out, and to heal all manner of disease and all manner of sickness.","Now the names of the twelve apostles are these: The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphæus, and Thaddæus;","Simon the Cananæan, and Judas Iscariot, who also betrayed him.","These twelve Jesus sent forth, and charged them, saying, Go not into any way of the Gentiles, and enter not into any city of the Samaritans:","but go rather to the lost sheep of the house of Israel.","And as ye go, preach, saying, The kingdom of heaven is at hand.","Heal the sick, raise the dead, cleanse the lepers, cast out demons: freely ye received, freely give.","Get you no gold, nor silver, nor brass in your purses;","no wallet for your journey, neither two coats, nor shoes, nor staff: for the laborer is worthy of his food.","And into whatsoever city or village ye shall enter, search out who in it is worthy; and there abide till ye go forth.","And as ye enter into the house, salute it.","And if the house be worthy, let your peace come upon it: but if it be not worthy, let your peace return to you.","And whosoever shall not receive you, nor hear your words, as ye go forth out of that house or that city, shake off the dust of your feet.","Verily I say unto you, It shall be more tolerable for the land of Sodom and Gomorrah in the day of judgment, than for that city.","Behold, I send you forth as sheep in the midst of wolves: be ye therefore wise as serpents, and harmless as doves.","But beware of men: for they will deliver you up to councils, and in their synagogues they will scourge you;","yea and before governors and kings shall ye be brought for my sake, for a testimony to them and to the Gentiles.","But when they deliver you up, be not anxious how or what ye shall speak: for it shall be given you in that hour what ye shall speak.","For it is not ye that speak, but the Spirit of your Father that speaketh in you.","And brother shall deliver up brother to death, and the father his child: and children shall rise up against parents, and cause them to be put to death.","And ye shall be hated of all men for my name’s sake: but he that endureth to the end, the same shall be saved.","But when they persecute you in this city, flee into the next: for verily I say unto you, Ye shall not have gone through the cities of Israel, till the Son of man be come.","A disciple is not above his teacher, nor a servant above his lord.","It is enough for the disciple that he be as his teacher, and the servant as his lord. If they have called the master of the house Beelzebub, how much more them of his household!","Fear them not therefore: for there is nothing covered, that shall not be revealed; and hid, that shall not be known.","What I tell you in the darkness, speak ye in the light; and what ye hear in the ear, proclaim upon the house-tops.","And be not afraid of them that kill the body, but are not able to kill the soul: but rather fear him who is able to destroy both soul and body in hell.","Are not two sparrows sold for a penny? and not one of them shall fall on the ground without your Father:","but the very hairs of your head are all numbered.","Fear not therefore: ye are of more value than many sparrows.","Every one therefore who shall confess me before men, him will I also confess before my Father who is in heaven.","But whosoever shall deny me before men, him will I also deny before my Father who is in heaven.","Think not that I came to send peace on the earth: I came not to send peace, but a sword.","For I came to set a man at variance against his father, and the daughter against her mother, and the daughter in law against her mother in law:","and a man’s foes shall be they of his own household.","He that loveth father or mother more than me is not worthy of me; and he that loveth son or daughter more than me is not worthy of me.","And he that doth not take his cross and follow after me, is not worthy of me.","He that findeth his life shall lose it; and he that loseth his life for my sake shall find it.","He that receiveth you receiveth me, and he that receiveth me receiveth him that sent me.","He that receiveth a prophet in the name of a prophet shall receive a prophet’s reward: and he that receiveth a righteous man in the name of a righteous man shall receive a righteous man’s reward.","And whosoever shall give to drink unto one of these little ones a cup of cold water only, in the name of a disciple, verily I say unto you he shall in no wise lose his reward."]},"Mark":{"4":["And again he began to teach by the sea side. And there is gathered unto him a very great multitude, so that he entered into a boat, and sat in the sea; and all the multitude were by the sea on the land.","And he taught them many things in parables, and said unto them in his teaching,","Hearken: Behold, the sower went forth to sow:","and it came to pass, as he sowed, some seed fell by the way side, and the birds came and devoured it.","And other fell on the rocky ground, where it had not much earth; and straightway it sprang up, because it had no deepness of earth:","and when the sun was risen, it was scorched; and because it had no root, it withered away.","And other fell among the thorns, and the thorns grew up, and choked it, and it yielded no fruit.","And others fell into the good ground, and yielded fruit, growing up and increasing; and brought forth, thirtyfold, and sixtyfold, and a hundredfold.","And he said, Who hath ears to hear, let him hear.","And when he was alone, they that were about him with the twelve asked of him the parables.","And he said unto them, Unto you is given the mystery of the kingdom of God: but unto them that are without, all things are done in parables:","that seeing they may see, and not perceive; and hearing they may hear, and not understand; lest haply they should turn again, and it should be forgiven them.","And he saith unto them, Know ye not this parable? and how shall ye know all the parables?","The sower soweth the word.","And these are they by the way side, where the word is sown; and when they have heard, straightway cometh Satan, and taketh away the word which hath been sown in them.","And these in like manner are they that are sown upon the rocky places, who, when they have heard the word, straightway receive it with joy;","and they have no root in themselves, but endure for a while; then, when tribulation or persecution ariseth because of the word, straightway they stumble.","And others are they that are sown among the thorns; these are they that have heard the word,","and the cares of the world, and the deceitfulness of riches, and the lusts of other things entering in, choke the word, and it becometh unfruitful.","And those are they that were sown upon the good ground; such as hear the word, and accept it, and bear fruit, thirtyfold, and sixtyfold, and a hundredfold.","And he said unto them, Is the lamp brought to be put under the bushel, or under the bed, and not to be put on the stand?","For there is nothing hid, save that it should be manifested; neither was anything made secret, but that it should come to light.","If any man hath ears to hear, let him hear.","And he said unto them, Take heed what ye hear: with what measure ye mete it shall be measured unto you; and more shall be given unto you.","For he that hath, to him shall be given: and he that hath not, from him shall be taken away even that which he hath.","And he said, So is the kingdom of God, as if a man should cast seed upon the earth;","and should sleep and rise night and day, and the seed should spring up and grow, he knoweth not how.","The earth beareth fruit of herself; first the blade, then the ear, then the full grain in the ear.","But when the fruit is ripe, straightway he putteth forth the sickle, because the harvest is come.","And he said, How shall we liken the kingdom of God? or in what parable shall we set it forth?","It is like a grain of mustard seed, which, when it is sown upon the earth, though it be less than all the seeds that are upon the earth,","yet when it is sown, groweth up, and becometh greater than all the herbs, and putteth out great branches; so that the birds of the heaven can lodge under the shadow thereof.","And with many such parables spake he the word unto them, as they were able to hear it;","and without a parable spake he not unto them: but privately to his own disciples he expounded all things.","And on that day, when even was come, he saith unto them, Let us go over unto the other side.","And leaving the multitude, they take him with them, even as he was, in the boat. And other boats were with him.","And there ariseth a great storm of wind, and the waves beat into the boat, insomuch that the boat was now filling.","And he himself was in the stern, asleep on the cushion: and they awake him, and say unto him, Teacher, carest thou not that we perish?","And he awoke, and rebuked the wind, and said unto the sea, Peace, be still. And the wind ceased, and there was a great calm.","And he said unto them, Why are ye fearful? have ye not yet faith?","And they feared exceedingly, and said one to another, Who then is this, that even the wind and the sea obey him?"]},"Luke":{"2":["Now it came to pass in those days, there went out a decree from Cæsar Augustus, that all the world should be enrolled.","This was the first enrolment made when Quirinius was governor of Syria.","And all went to enrol themselves, every one to his own city.","And Joseph also went up from Galilee, out of the city of Nazareth, into Judæa, to the city of David, which is called Bethlehem, because he was of the house and family of David;","to enrol himself with Mary, who was betrothed to him, being great with child.","And it came to pass, while they were there, the days were fulfilled that she should be delivered.","And she brought forth her firstborn son; and she wrapped him in swaddling clothes, and laid him in a manger, because there was no room for them in the inn.","And there were shepherds in the same country abiding in the field, and keeping watch by night over their flock.","And an angel of the Lord stood by them, and the glory of the Lord shone round about them: and they were sore afraid.","And the angel said unto them, Be not afraid; for behold, I bring you good tidings of great joy which shall be to all the people:","for there is born to you this day in the city of David a Saviour, who is Christ the Lord.","And this is the sign unto you: Ye shall find a babe wrapped in swaddling clothes, and lying in a manger.","And suddenly there was with the angel a multitude of the heavenly host praising God, and saying,","Glory to God in the highest, And on earth peace among men in whom he is well pleased.","And it came to pass, when the angels went away from them into heaven, the shepherds said one to another, Let us now go even unto Bethlehem, and see this thing that is come to pass, which the Lord hath made known unto us.","And they came with haste, and found both Mary and Joseph, and the babe lying in the manger.","And when they saw it, they made known concerning the saying which was spoken to them about this child.","And all that heard it wondered at the things which were spoken unto them by the shepherds.","But Mary kept all these sayings, pondering them in her heart.","And the shepherds returned, glorifying and praising God for all the things that they had heard and seen, even as it was spoken unto them.","And when eight days were fulfilled for circumcising him, his name was called JESUS, which was so called by the angel before he was conceived in the womb.","And when the days of their purification according to the law of Moses were fulfilled, they brought him up to Jerusalem, to present him to the Lord","(as it is written in the law of the Lord, Every male that openeth the womb shall be called holy to the Lord),","and to offer a sacrifice according to that which is said in the law of the Lord, A pair of turtledoves, or two young pigeons.","And behold, there was a man in Jerusalem, whose name was Simeon; and this man was righteous and devout, looking for the consolation of Israel: and the Holy Spirit was upon him.","And it had been revealed unto him by the Holy Spirit, that he should not see death, before he had seen the Lord’s Christ.","And he came in the Spirit into the temple: and when the parents brought in the child Jesus, that they might do concerning him after the custom of the law,","then he received him into his arms, and blessed God, and said,","Now lettest thou thy servant depart, Lord, According to thy word, in peace;","For mine eyes have seen thy salvation,","Which thou hast prepared before the face of all peoples;","A light for revelation to the Gentiles, And the glory of thy people Israel.","And his father and his mother were marvelling at the things which were spoken concerning him;","and Simeon blessed them, and said unto Mary his mother, Behold, this child is set for the falling and the rising of many in Israel; and for a sign which is spoken against;","yea and a sword shall pierce through thine own soul; that thoughts out of many hearts may be revealed.","And there was one Anna, a prophetess, the daughter of Phanuel, of the tribe of Asher (she was of a great age, having lived with a husband seven years from her virginity,","and she had been a widow even unto fourscore and four years), who departed not from the temple, worshipping with fastings and supplications night and day.","And coming up at that very hour she gave thanks unto God, and spake of him to all them that were looking for the redemption of Jerusalem.","And when they had accomplished all things that were according to the law of the Lord, they returned into Galilee, to their own city Nazareth.","And the child grew, and waxed strong, filled with wisdom: and the grace of God was upon him.","And his parents went every year to Jerusalem at the feast of the passover.","And when he was twelve years old, they went up after the custom of the feast;","and when they had fulfilled the days, as they were returning, the boy Jesus tarried behind in Jerusalem; and his parents knew it not;","but supposing him to be in the company, they went a day’s journey; and they sought for him among their kinsfolk and acquaintance:","and when they found him not, they returned to Jerusalem, seeking for him.","And it came to pass, after three days they found him in the temple, sitting in the midst of the teachers, both hearing them, and asking them questions:","and all that heard him were amazed at his understanding and his answers.","And when they saw him, they were astonished; and his mother said unto him, Son, why hast thou thus dealt with us? behold, thy father and I sought thee sorrowing.","And he said unto them, How is it that ye sought me? knew ye not that I must be in my Father’s house?","And they understood not the saying which he spake unto them.","And he went down with them, and came to Nazareth; and he was subject unto them: and his mother kept all these sayings in her heart.","And Jesus advanced in wisdom and stature, and in favor with God and men."],"14":["And it came to pass, when he went into the house of one of the rulers of the Pharisees on a sabbath to eat bread, that they were watching him.","And behold, there was before him a certain man that had the dropsy.","And Jesus answering spake unto the lawyers and Pharisees, saying, Is it lawful to heal on the sabbath, or not?","But they held their peace. And he took him, and healed him, and let him go.","And he said unto them, Which of you shall have an ass or an ox fallen into a well, and will not straightway draw him up on a sabbath day?","And they could not answer again unto these things.","And he spake a parable unto those that were bidden, when he marked how they chose out the chief seats; saying unto them,","When thou art bidden of any man to a marriage feast, sit not down in the chief seat; lest haply a more honorable man than thou be bidden of him,","and he that bade thee and him shall come and say to thee, Give this man place; and then thou shalt begin with shame to take the lowest place.","But when thou art bidden, go and sit down in the lowest place; that when he that hath bidden thee cometh, he may say to thee, Friend, go up higher: then shalt thou have glory in the presence of all that sit at meat with thee.","For every one that exalteth himself shall be humbled; and he that humbleth himself shall be exalted.","And he said to him also that had bidden him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, nor thy kinsmen, nor rich neighbors; lest haply they also bid thee again, and a recompense be made thee.","But when thou makest a feast, bid the poor, the maimed, the lame, the blind:","and thou shalt be blessed; because they have not wherewith to recompense thee: for thou shalt be recompensed in the resurrection of the just.","And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God.","But he said unto him, A certain man made a great supper; and he bade many:","and he sent forth his servant at supper time to say to them that were bidden, Come; for all things are now ready.","And they all with one consent began to make excuse. The first said unto him, I have bought a field, and I must needs go out and see it; I pray thee have me excused.","And another said, I have bought five yoke of oxen, and I go to prove them; I pray thee have me excused.","And another said, I have married a wife, and therefore I cannot come.","And the servant came, and told his lord these things. Then the master of the house being angry said to his servant, Go out quickly into the streets and lanes of the city, and bring in hither the poor and maimed and blind and lame.","And the servant said, Lord, what thou didst command is done, and yet there is room.","And the lord said unto the servant, Go out into the highways and hedges, and constrain them to come in, that my house may be filled.","For I say unto you, that none of those men that were bidden shall taste of my supper.","Now there went with him great multitudes: and he turned, and said unto them,","If any man cometh unto me, and hateth not his own father, and mother, and wife, and children, and brethren, and sisters, yea, and his own life also, he cannot be my disciple.","Whosoever doth not bear his own cross, and come after me, cannot be my disciple.","For which of you, desiring to build a tower, doth not first sit down and count the cost, whether he have wherewith to complete it?","Lest haply, when he hath laid a foundation, and is not able to finish, all that behold begin to mock him,","saying, This man began to build, and was not able to finish.","Or what king, as he goeth to encounter another king in war, will not sit down first and take counsel whether he is able with ten thousand to meet him that cometh against him with twenty thousand?","Or else, while the other is yet a great way off, he sendeth an ambassage, and asketh conditions of peace.","So therefore whosoever he be of you that renounceth not all that he hath, he cannot be my disciple.","Salt therefore is good: but if even the salt have lost its savor, wherewith shall it be seasoned?","It is fit neither for the land nor for the dunghill: men cast it out. He that hath ears to hear, let him hear."]},"John":{"1":["In the beginning was the Word, and the Word was with God, and the Word was God.","The same was in the beginning with God.","All things were made through him; and without him was not anything made that hath been made.","In him was life; and the life was the light of men.","And the light shineth in the darkness; and the darkness apprehended it not.","There came a man, sent from God, whose name was John.","The same came for witness, that he might bear witness of the light, that all might believe through him.","He was not the light, but came that he might bear witness of the light.","There was the true light, even the light which lighteth every man, coming into the world.","He was in the world, and the world was made through him, and the world knew him not.","He came unto his own, and they that were his own received him not.","But as many as received him, to them gave he the right to become children of God, even to them that believe on his name:","who were born, not of blood, nor of the will of the flesh, nor of the will of man, but of God.","And the Word became flesh, and dwelt among us (and we beheld his glory, glory as of the only begotten from the Father), full of grace and truth.","John beareth witness of him, and crieth, saying, This was he of whom I said, He that cometh after me is become before me: for he was before me.","For of his fulness we all received, and grace for grace.","For the law was given through Moses; grace and truth came through Jesus Christ.","No man hath seen God at any time; the only begotten Son, who is in the bosom of the Father, he hath declared him.","And this is the witness of John, when the Jews sent unto him from Jerusalem priests and Levites to ask him, Who art thou?","And he confessed, and denied not; and he confessed, I am not the Christ.","And they asked him, What then? Art thou Elijah? And he saith, I am not. Art thou the prophet? And he answered, No.","They said therefore unto him, Who art thou? that we may give an answer to them that sent us. What sayest thou of thyself?","He said, I am the voice of one crying in the wilderness, Make straight the way of the Lord, as said Isaiah the prophet.","And they had been sent from the Pharisees.","And they asked him, and said unto him, Why then baptizest thou, if thou art not the Christ, neither Elijah, neither the prophet?","John answered them, saying, I baptize in water: in the midst of you standeth one whom ye know not,","even he that cometh after me, the latchet of whose shoe I am not worthy to unloose.","These things were done in Bethany beyond the Jordan, where John was baptizing.","On the morrow he seeth Jesus coming unto him, and saith, Behold, the Lamb of God, that taketh away the sin of the world!","This is he of whom I said, After me cometh a man who is become before me: for he was before me.","And I knew him not; but that he should be made manifest to Israel, for this cause came I baptizing in water.","And John bare witness, saying, I have beheld the Spirit descending as a dove out of heaven; and it abode upon him.","And I knew him not: but he that sent me to baptize in water, he said unto me, Upon whomsoever thou shalt see the Spirit descending, and abiding upon him, the same is he that baptizeth in the Holy Spirit.","And I have seen, and have borne witness that this is the Son of God.","Again on the morrow John was standing, and two of his disciples;","and he looked upon Jesus as he walked, and saith, Behold, the Lamb of God!","And the two disciples heard him speak, and they followed Jesus.","And Jesus turned, and beheld them following, and saith unto them, What seek ye? And they said unto him, Rabbi (which is to say, being interpreted, Teacher), where abidest thou?","He saith unto them, Come, and ye shall see. They came therefore and saw where he abode; and they abode with him that day: it was about the tenth hour.","One of the two that heard John speak, and followed him, was Andrew, Simon Peter’s brother.","He findeth first his own brother Simon, and saith unto him, We have found the Messiah (which is, being interpreted, Christ).","He brought him unto Jesus. Jesus looked upon him, and said, Thou art Simon the son of John: thou shalt be called Cephas (which is by interpretation, Peter).","On the morrow he was minded to go forth into Galilee, and he findeth Philip: and Jesus saith unto him, Follow me.","Now Philip was from Bethsaida, of the city of Andrew and Peter.","Philip findeth Nathanael, and saith unto him, We have found him, of whom Moses in the law, and the prophets, wrote, Jesus of Nazareth, the son of Joseph.","And Nathanael said unto him, Can any good thing come out of Nazareth? Philip saith unto him, Come and see.","Jesus saw Nathanael coming to him, and saith of him, Behold, an Israelite indeed, in whom is no guile!","Nathanael saith unto him, Whence knowest thou me? Jesus answered and said unto him, Before Philip called thee, when thou wast under the fig tree, I saw thee.","Nathanael answered him, Rabbi, thou art the Son of God; thou art King of Israel.","Jesus answered and said unto him, Because I said unto thee, I saw thee underneath the fig tree, believest thou? thou shalt see greater things than these.","And he saith unto him, Verily, verily, I say unto you, Ye shall see the heaven opened, and the angels of God ascending and descending upon the Son of man."],"2":["And the third day there was a marriage in Cana of Galilee; and the mother of Jesus was there:","and Jesus also was bidden, and his disciples, to the marriage.","And when the wine failed, the mother of Jesus saith unto him, They have no wine.","And Jesus saith unto her, Woman, what have I to do with thee? mine hour is not yet come.","His mother saith unto the servants, Whatsoever he saith unto you, do it.","Now there were six waterpots of stone set there after the Jews’ manner of purifying, containing two or three firkins apiece.","Jesus saith unto them, Fill the waterpots with water. And they filled them up to the brim.","And he saith unto them, Draw out now, and bear unto the ruler of the feast. And they bare it.","And when the ruler of the feast tasted the water now become wine, and knew not whence it was (but the servants that had drawn the water knew), the ruler of the feast calleth the bridegroom,","and saith unto him, Every man setteth on first the good wine; and when men have drunk freely, then that which is worse: thou hast kept the good wine until now.","This beginning of his signs did Jesus in Cana of Galilee, and manifested his glory; and his disciples believed on him.","After this he went down to Capernaum, he, and his mother, and his brethren, and his disciples; and there they abode not many days.","And the passover of the Jews was at hand, and Jesus went up to Jerusalem.","And he found in the temple those that sold oxen and sheep and doves, and the changers of money sitting:","and he made a scourge of cords, and cast all out of the temple, both the sheep and the oxen; and he poured out the changers’ money, and overthrew their tables;","and to them that sold the doves he said, Take these things hence; make not my Father’s house a house of merchandise.","His disciples remembered that it was written, Zeal for thy house shall eat me up.","The Jews therefore answered and said unto him, What sign showest thou unto us, seeing that thou doest these things?","Jesus answered and said unto them, Destroy this temple, and in three days I will raise it up.","The Jews therefore said, Forty and six years was this temple in building, and wilt thou raise it up in three days?","But he spake of the temple of his body.","When therefore he was raised from the dead, his disciples remembered that he spake this; and they believed the scripture, and the word which Jesus had said.","Now when he was in Jerusalem at the passover, during the feast, many believed on his name, beholding his signs which he did.","But Jesus did not trust himself unto them, for that he knew all men,","and because he needed not that any one should bear witness concerning man; for he himself knew what was in man."],"3":["Now there was a man of the Pharisees, named Nicodemus, a ruler of the Jews:","the same came unto him by night, and said to him, Rabbi, we know that thou art a teacher come from God; for no one can do these signs that thou doest, except God be with him.","Jesus answered and said unto him, Verily, verily, I say unto thee, Except one be born anew, he cannot see the kingdom of God.","Nicodemus saith unto him, How can a man be born when he is old? can he enter a second time into his mother’s womb, and be born?","Jesus answered, Verily, verily, I say unto thee, Except one be born of water and the Spirit, he cannot enter into the kingdom of God.","That which is born of the flesh is flesh; and that which is born of the Spirit is spirit.","Marvel not that I said unto thee, Ye must be born anew.","The wind bloweth where it will, and thou hearest the voice thereof, but knowest not whence it cometh, and whither it goeth: so is every one that is born of the Spirit.","Nicodemus answered and said unto him, How can these things be?","Jesus answered and said unto him, Art thou the teacher of Israel, and understandest not these things?","Verily, verily, I say unto thee, We speak that which we know, and bear witness of that which we have seen; and ye receive not our witness.","If I told you earthly things and ye believe not, how shall ye believe if I tell you heavenly things?","And no one hath ascended into heaven, but he that descended out of heaven, even the Son of man, who is in heaven.","And as Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up;","that whosoever believeth may in him have eternal life.","For God so loved the world, that he gave his only begotten Son, that whosoever believeth on him should not perish, but have eternal life.","For God sent not the Son into the world to judge the world; but that the world should be saved through him.","He that believeth on him is not judged: he that believeth not hath been judged already, because he hath not believed on the name of the only begotten Son of God.","And this is the judgment, that the light is come into the world, and men loved the darkness rather than the light; for their works were evil.","For every one that doeth evil hateth the light, and cometh not to the light, lest his works should be reproved.","But he that doeth the truth cometh to the light, that his works may be made manifest, that they have been wrought in God.","After these things came Jesus and his disciples into the land of Judæa; and there he tarried with them, and baptized.","And John also was baptizing in Ænon near to Salim, because there was much water there: and they came, and were baptized.","For John was not yet cast into prison.","There arose therefore a questioning on the part of John’s disciples with a Jew about purifying.","And they came unto John, and said to him, Rabbi, he that was with thee beyond the Jordan, to whom thou hast borne witness, behold, the same baptizeth, and all men come to him.","John answered and said, A man can receive nothing, except it have been given him from heaven.","Ye yourselves bear me witness, that I said, I am not the Christ, but, that I am sent before him.","He that hath the bride is the bridegroom: but the friend of the bridegroom, that standeth and heareth him, rejoiceth greatly because of the bridegroom’s voice: this my joy therefore is made full.","He must increase, but I must decrease.","He that cometh from above is above all: he that is of the earth is of the earth, and of the earth he speaketh: he that cometh from heaven is above all.","What he hath seen and heard, of that he beareth witness; and no man receiveth his witness.","He that hath received his witness hath set his seal to this, that God is true.","For he whom God hath sent speaketh the words of God: for he giveth not the Spirit by measure.","The Father loveth the Son, and hath given all things into his hand.","He that believeth on the Son hath eternal life; but he that obeyeth not the Son shall not see life, but the wrath of God abideth on him."],"4":["When therefore the Lord knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John","(although Jesus himself baptized not, but his disciples),","he left Judæa, and departed again into Galilee.","And he must needs pass through Samaria.","So he cometh to a city of Samaria, called Sychar, near to the parcel of ground that Jacob gave to his son Joseph:","and Jacob’s well was there. Jesus therefore, being wearied with his journey, sat thus by the well. It was about the sixth hour.","There cometh a woman of Samaria to draw water: Jesus saith unto her, Give me to drink.","For his disciples were gone away into the city to buy food.","The Samaritan woman therefore saith unto him, How is it that thou, being a Jew, askest drink of me, who am a Samaritan woman? (For Jews have no dealings with Samaritans.)","Jesus answered and said unto her, If thou knewest the gift of God, and who it is that saith to thee, Give me to drink; thou wouldest have asked of him, and he would have given thee living water.","The woman saith unto him, Sir, thou hast nothing to draw with, and the well is deep: whence then hast thou that living water?","Art thou greater than our father Jacob, who gave us the well, and drank thereof himself, and his sons, and his cattle?","Jesus answered and said unto her, Every one that drinketh of this water shall thirst again:","but whosoever drinketh of the water that I shall give him shall never thirst; but the water that I shall give him shall become in him a well of water springing up unto eternal life.","The woman saith unto him, Sir, give me this water, that I thirst not, neither come all the way hither to draw.","Jesus saith unto her, Go, call thy husband, and come hither.","The woman answered and said unto him, I have no husband. Jesus saith unto her, Thou saidst well, I have no husband:","for thou hast had five husbands; and he whom thou now hast is not thy husband: this hast thou said truly.","The woman saith unto him, Sir, I perceive that thou art a prophet.","Our fathers worshipped in this mountain; and ye say, that in Jerusalem is the place where men ought to worship.","Jesus saith unto her, Woman, believe me, the hour cometh, when neither in this mountain, nor in Jerusalem, shall ye worship the Father.","Ye worship that which ye know not: we worship that which we know; for salvation is from the Jews.","But the hour cometh, and now is, when the true worshippers shall worship the Father in spirit and truth: for such doth the Father seek to be his worshippe
