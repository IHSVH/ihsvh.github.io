rs.","God is a Spirit: and they that worship him must worship in spirit and truth.","The woman saith unto him, I know that Messiah cometh (he that is called Christ): when he is come, he will declare unto us all things.","Jesus saith unto her, I that speak unto thee am he.","And upon this came his disciples; and they marvelled that he was speaking with a woman; yet no man said, What seekest thou? or, Why speakest thou with her?","So the woman left her waterpot, and went away into the city, and saith to the people,","Come, see a man, who told me all things that ever I did: can this be the Christ?","They went out of the city, and were coming to him.","In the mean while the disciples prayed him, saying, Rabbi, eat.","But he said unto them, I have meat to eat that ye know not.","The disciples therefore said one to another, Hath any man brought him aught to eat?","Jesus saith unto them, My meat is to do the will of him that sent me, and to accomplish his work.","Say not ye, There are yet four months, and then cometh the harvest? behold, I say unto you, Lift up your eyes, and look on the fields, that they are white already unto harvest.","He that reapeth receiveth wages, and gathereth fruit unto life eternal; that he that soweth and he that reapeth may rejoice together.","For herein is the saying true, One soweth, and another reapeth.","I sent you to reap that whereon ye have not labored: others have labored, and ye are entered into their labor.","And from that city many of the Samaritans believed on him because of the word of the woman, who testified, He told me all things that ever I did.","So when the Samaritans came unto him, they besought him to abide with them: and he abode there two days.","And many more believed because of his word;","and they said to the woman, Now we believe, not because of thy speaking: for we have heard for ourselves, and know that this is indeed the Saviour of the world.","And after the two days he went forth from thence into Galilee.","For Jesus himself testified, that a prophet hath no honor in his own country.","So when he came into Galilee, the Galilæans received him, having seen all the things that he did in Jerusalem at the feast: for they also went unto the feast.","He came therefore again unto Cana of Galilee, where he made the water wine. And there was a certain nobleman, whose son was sick at Capernaum.","When he heard that Jesus was come out of Judæa into Galilee, he went unto him, and besought him that he would come down, and heal his son; for he was at the point of death.","Jesus therefore said unto him, Except ye see signs and wonders, ye will in no wise believe.","The nobleman saith unto him, Sir, come down ere my child die.","Jesus saith unto him, Go thy way; thy son liveth. The man believed the word that Jesus spake unto him, and he went his way.","And as he was now going down, his servants met him, saying, that his son lived.","So he inquired of them the hour when he began to amend. They said therefore unto him, Yesterday at the seventh hour the fever left him.","So the father knew that it was at that hour in which Jesus said unto him, Thy son liveth: and himself believed, and his whole house.","This is again the second sign that Jesus did, having come out of Judæa into Galilee."],"5":["After these things there was a feast of the Jews; and Jesus went up to Jerusalem.","Now there is in Jerusalem by the sheep gate a pool, which is called in Hebrew Bethesda, having five porches.","In these lay a multitude of them that were sick, blind, halt, withered.","","And a certain man was there, who had been thirty and eight years in his infirmity.","When Jesus saw him lying, and knew that he had been now a long time in that case, he saith unto him, Wouldest thou be made whole?","The sick man answered him, Sir, I have no man, when the water is troubled, to put me into the pool: but while I am coming, another steppeth down before me.","Jesus saith unto him, Arise, take up thy bed, and walk.","And straightway the man was made whole, and took up his bed and walked. Now it was the sabbath on that day.","So the Jews said unto him that was cured, It is the sabbath, and it is not lawful for thee to take up thy bed.","But he answered them, He that made me whole, the same said unto me, Take up thy bed, and walk.","They asked him, Who is the man that said unto thee, Take up thy bed, and walk?","But he that was healed knew not who it was; for Jesus had conveyed himself away, a multitude being in the place.","Afterward Jesus findeth him in the temple, and said unto him, Behold, thou art made whole: sin no more, lest a worse thing befall thee.","The man went away, and told the Jews that it was Jesus who had made him whole.","And for this cause the Jews persecuted Jesus, because he did these things on the sabbath.","But Jesus answered them, My Father worketh even until now, and I work.","For this cause therefore the Jews sought the more to kill him, because he not only brake the sabbath, but also called God his own Father, making himself equal with God.","Jesus therefore answered and said unto them, Verily, verily, I say unto you, The Son can do nothing of himself, but what he seeth the Father doing: for what things soever he doeth, these the Son also doeth in like manner.","For the Father loveth the Son, and showeth him all things that himself doeth: and greater works than these will he show him, that ye may marvel.","For as the Father raiseth the dead and giveth them life, even so the Son also giveth life to whom he will.","For neither doth the Father judge any man, but he hath given all judgment unto the Son;","that all may honor the Son, even as they honor the Father. He that honoreth not the Son honoreth not the Father that sent him.","Verily, verily, I say unto you, He that heareth my word, and believeth him that sent me, hath eternal life, and cometh not into judgment, but hath passed out of death into life.","Verily, verily, I say unto you, The hour cometh, and now is, when the dead shall hear the voice of the Son of God; and they that hear shall live.","For as the Father hath life in himself, even so gave he to the Son also to have life in himself:","and he gave him authority to execute judgment, because he is a son of man.","Marvel not at this: for the hour cometh, in which all that are in the tombs shall hear his voice,","and shall come forth; they that have done good, unto the resurrection of life; and they that have done evil, unto the resurrection of judgment.","I can of myself do nothing: as I hear, I judge: and my judgment is righteous; because I seek not mine own will, but the will of him that sent me.","If I bear witness of myself, my witness is not true.","It is another that beareth witness of me; and I know that the witness which he witnesseth of me is true.","Ye have sent unto John, and he hath borne witness unto the truth.","But the witness which I receive is not from man: howbeit I say these things, that ye may be saved.","He was the lamp that burneth and shineth; and ye were willing to rejoice for a season in his light.","But the witness which I have is greater than that of John; for the works which the Father hath given me to accomplish, the very works that I do, bear witness of me, that the Father hath sent me.","And the Father that sent me, he hath borne witness of me. Ye have neither heard his voice at any time, nor seen his form.","And ye have not his word abiding in you: for whom he sent, him ye believe not.","Ye search the scriptures, because ye think that in them ye have eternal life; and these are they which bear witness of me;","and ye will not come to me, that ye may have life.","I receive not glory from men.","But I know you, that ye have not the love of God in yourselves.","I am come in my Father’s name, and ye receive me not: if another shall come in his own name, him ye will receive.","How can ye believe, who receive glory one of another, and the glory that cometh from the only God ye seek not?","Think not that I will accuse you to the Father: there is one that accuseth you, even Moses, on whom ye have set your hope.","For if ye believed Moses, ye would believe me; for he wrote of me.","But if ye believe not his writings, how shall ye believe my words?"],"6":["After these things Jesus went away to the other side of the sea of Galilee, which is the sea of Tiberias.","And a great multitude followed him, because they beheld the signs which he did on them that were sick.","And Jesus went up into the mountain, and there he sat with his disciples.","Now the passover, the feast of the Jews, was at hand.","Jesus therefore lifting up his eyes, and seeing that a great multitude cometh unto him, saith unto Philip, Whence are we to buy bread, that these may eat?","And this he said to prove him: for he himself knew what he would do.","Philip answered him, Two hundred shillings’ worth of bread is not sufficient for them, that every one may take a little.","One of his disciples, Andrew, Simon Peter’s brother, saith unto him,","There is a lad here, who hath five barley loaves, and two fishes: but what are these among so many?","Jesus said, Make the people sit down. Now there was much grass in the place. So the men sat down, in number about five thousand.","Jesus therefore took the loaves; and having given thanks, he distributed to them that were set down; likewise also of the fishes as much as they would.","And when they were filled, he saith unto his disciples, Gather up the broken pieces which remain over, that nothing be lost.","So they gathered them up, and filled twelve baskets with broken pieces from the five barley loaves, which remained over unto them that had eaten.","When therefore the people saw the sign which he did, they said, This is of a truth the prophet that cometh into the world.","Jesus therefore perceiving that they were about to come and take him by force, to make him king, withdrew again into the mountain himself alone.","And when evening came, his disciples went down unto the sea;","and they entered into a boat, and were going over the sea unto Capernaum. And it was now dark, and Jesus had not yet come to them.","And the sea was rising by reason of a great wind that blew.","When therefore they had rowed about five and twenty or thirty furlongs, they behold Jesus walking on the sea, and drawing nigh unto the boat: and they were afraid.","But he saith unto them, It is I; be not afraid.","They were willing therefore to receive him into the boat: and straightway the boat was at the land whither they were going.","On the morrow the multitude that stood on the other side of the sea saw that there was no other boat there, save one, and that Jesus entered not with his disciples into the boat, but that his disciples went away alone","(howbeit there came boats from Tiberias nigh unto the place where they ate the bread after the Lord had given thanks):","when the multitude therefore saw that Jesus was not there, neither his disciples, they themselves got into the boats, and came to Capernaum, seeking Jesus.","And when they found him on the other side of the sea, they said unto him, Rabbi, when camest thou hither?","Jesus answered them and said, Verily, verily, I say unto you, Ye seek me, not because ye saw signs, but because ye ate of the loaves, and were filled.","Work not for the food which perisheth, but for the food which abideth unto eternal life, which the Son of man shall give unto you: for him the Father, even God, hath sealed.","They said therefore unto him, What must we do, that we may work the works of God?","Jesus answered and said unto them, This is the work of God, that ye believe on him whom he hath sent.","They said therefore unto him, What then doest thou for a sign, that we may see, and believe thee? what workest thou?","Our fathers ate the manna in the wilderness; as it is written, He gave them bread out of heaven to eat.","Jesus therefore said unto them, Verily, verily, I say unto you, It was not Moses that gave you the bread out of heaven; but my Father giveth you the true bread out of heaven.","For the bread of God is that which cometh down out of heaven, and giveth life unto the world.","They said therefore unto him, Lord, evermore give us this bread.","Jesus said unto them, I am the bread of life: he that cometh to me shall not hunger, and he that believeth on me shall never thirst.","But I said unto you, that ye have seen me, and yet believe not.","All that which the Father giveth me shall come unto me; and him that cometh to me I will in no wise cast out.","For I am come down from heaven, not to do mine own will, but the will of him that sent me.","And this is the will of him that sent me, that of all that which he hath given me I should lose nothing, but should raise it up at the last day.","For this is the will of my Father, that every one that beholdeth the Son, and believeth on him, should have eternal life; and I will raise him up at the last day.","The Jews therefore murmured concerning him, because he said, I am the bread which came down out of heaven.","And they said, Is not this Jesus, the son of Joseph, whose father and mother we know? how doth he now say, I am come down out of heaven?","Jesus answered and said unto them, Murmur not among yourselves.","No man can come to me, except the Father that sent me draw him: and I will raise him up in the last day.","It is written in the prophets, And they shall all be taught of God. Every one that hath heard from the Father, and hath learned, cometh unto me.","Not that any man hath seen the Father, save he that is from God, he hath seen the Father.","Verily, verily, I say unto you, He that believeth hath eternal life.","I am the bread of life.","Your fathers ate the manna in the wilderness, and they died.","This is the bread which cometh down out of heaven, that a man may eat thereof, and not die.","I am the living bread which came down out of heaven: if any man eat of this bread, he shall live for ever: yea and the bread which I will give is my flesh, for the life of the world.","The Jews therefore strove one with another, saying, How can this man give us his flesh to eat?","Jesus therefore said unto them, Verily, verily, I say unto you, Except ye eat the flesh of the Son of man and drink his blood, ye have not life in yourselves.","He that eateth my flesh and drinketh my blood hath eternal life; and I will raise him up at the last day.","For my flesh is meat indeed, and my blood is drink indeed.","He that eateth my flesh and drinketh my blood abideth in me, and I in him.","As the living Father sent me, and I live because of the Father; so he that eateth me, he also shall live because of me.","This is the bread which came down out of heaven: not as the fathers ate, and died; he that eateth this bread shall live for ever.","These things said he in the synagogue, as he taught in Capernaum.","Many therefore of his disciples, when they heard this, said, This is a hard saying; who can hear it?","But Jesus knowing in himself that his disciples murmured at this, said unto them, Doth this cause you to stumble?","What then if ye should behold the Son of man ascending where he was before?","It is the spirit that giveth life; the flesh profiteth nothing: the words that I have spoken unto you are spirit, and are life.","But there are some of you that believe not. For Jesus knew from the beginning who they were that believed not, and who it was that should betray him.","And he said, For this cause have I said unto you, that no man can come unto me, except it be given unto him of the Father.","Upon this many of his disciples went back, and walked no more with him.","Jesus said therefore unto the twelve, Would ye also go away?","Simon Peter answered him, Lord, to whom shall we go? thou hast the words of eternal life.","And we have believed and know that thou art the Holy One of God.","Jesus answered them, Did not I choose you the twelve, and one of you is a devil?","Now he spake of Judas the son of Simon Iscariot, for he it was that should betray him, being one of the twelve."],"7":["And after these things Jesus walked in Galilee: for he would not walk in Judæa, because the Jews sought to kill him.","Now the feast of the Jews, the feast of tabernacles, was at hand.","His brethren therefore said unto him, Depart hence, and go into Judæa, that thy disciples also may behold thy works which thou doest.","For no man doeth anything in secret, and himself seeketh to be known openly. If thou doest these things, manifest thyself to the world.","For even his brethren did not believe on him.","Jesus therefore saith unto them, My time is not yet come; but your time is always ready.","The world cannot hate you; but me it hateth, because I testify of it, that its works are evil.","Go ye up unto the feast: I go not up unto this feast; because my time is not yet fulfilled.","And having said these things unto them, he abode still in Galilee.","But when his brethren were gone up unto the feast, then went he also up, not publicly, but as it were in secret.","The Jews therefore sought him at the feast, and said, Where is he?","And there was much murmuring among the multitudes concerning him: some said, He is a good man; others said, Not so, but he leadeth the multitude astray.","Yet no man spake openly of him for fear of the Jews.","But when it was now the midst of the feast Jesus went up into the temple, and taught.","The Jews therefore marvelled, saying, How knoweth this man letters, having never learned?","Jesus therefore answered them, and said, My teaching is not mine, but his that sent me.","If any man willeth to do his will, he shall know of the teaching, whether it is of God, or whether I speak from myself.","He that speaketh from himself seeketh his own glory: but he that seeketh the glory of him that sent him, the same is true, and no unrighteousness is in him.","Did not Moses give you the law, and yet none of you doeth the law? Why seek ye to kill me?","The multitude answered, Thou hast a demon: who seeketh to kill thee?","Jesus answered and said unto them, I did one work, and ye all marvel because thereof.","Moses hath given you circumcision (not that it is of Moses, but of the fathers); and on the sabbath ye circumcise a man.","If a man receiveth circumcision on the sabbath, that the law of Moses may not be broken; are ye wroth with me, because I made a man every whit whole on the sabbath?","Judge not according to appearance, but judge righteous judgment.","Some therefore of them of Jerusalem said, Is not this he whom they seek to kill?","And lo, he speaketh openly, and they say nothing unto him. Can it be that the rulers indeed know that this is the Christ?","Howbeit we know this man whence he is: but when the Christ cometh, no one knoweth whence he is.","Jesus therefore cried in the temple, teaching and saying, Ye both know me, and know whence I am; and I am not come of myself, but he that sent me is true, whom ye know not.","I know him; because I am from him, and he sent me.","They sought therefore to take him: and no man laid his hand on him, because his hour was not yet come.","But of the multitude many believed on him; and they said, When the Christ shall come, will he do more signs than those which this man hath done?","The Pharisees heard the multitude murmuring these things concerning him; and the chief priests and the Pharisees sent officers to take him.","Jesus therefore said, Yet a little while am I with you, and I go unto him that sent me.","Ye shall seek me, and shall not find me: and where I am, ye cannot come.","The Jews therefore said among themselves, Whither will this man go that we shall not find him? will he go unto the Dispersion among the Greeks, and teach the Greeks?","What is this word that he said, Ye shall seek me, and shall not find me; and where I am, ye cannot come?","Now on the last day, the great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me and drink.","He that believeth on me, as the scripture hath said, from within him shall flow rivers of living water.","But this spake he of the Spirit, which they that believed on him were to receive: for the Spirit was not yet given; because Jesus was not yet glorified.","Some of the multitude therefore, when they heard these words, said, This is of a truth the prophet.","Others said, This is the Christ. But some said, What, doth the Christ come out of Galilee?","Hath not the scripture said that the Christ cometh of the seed of David, and from Bethlehem, the village where David was?","So there arose a division in the multitude because of him.","And some of them would have taken him; but no man laid hands on him.","The officers therefore came to the chief priests and Pharisees; and they said unto them, Why did ye not bring him?","The officers answered, Never man so spake.","The Pharisees therefore answered them, Are ye also led astray?","Hath any of the rulers believed on him, or of the Pharisees?","But this multitude that knoweth not the law are accursed.","Nicodemus saith unto them (he that came to him before, being one of them),","Doth our law judge a man, except it first hear from himself and know what he doeth?","They answered and said unto him, Art thou also of Galilee? Search, and see that out of Galilee ariseth no prophet.","[And they went every man unto his own house:"],"8":["but Jesus went unto the mount of Olives.","And early in the morning he came again into the temple, and all the people came unto him; and he sat down, and taught them.","And the scribes and the Pharisees bring a woman taken in adultery; and having set her in the midst,","they say unto him, Teacher, this woman hath been taken in adultery, in the very act.","Now in the law Moses commanded us to stone such: what then sayest thou of her?","And this they said, trying him, that they might have whereof to accuse him. But Jesus stooped down, and with his finger wrote on the ground.","But when they continued asking him, he lifted up himself, and said unto them, He that is without sin among you, let him first cast a stone at her.","And again he stooped down, and with his finger wrote on the ground.","And they, when they heard it, went out one by one, beginning from the eldest, even unto the last: and Jesus was left alone, and the woman, where she was, in the midst.","And Jesus lifted up himself, and said unto her, Woman, where are they? did no man condemn thee?","And she said, No man, Lord. And Jesus said, Neither do I condemn thee: go thy way; from henceforth sin no more.]","Again therefore Jesus spake unto them, saying, I am the light of the world: he that followeth me shall not walk in the darkness, but shall have the light of life.","The Pharisees therefore said unto him, Thou bearest witness of thyself; thy witness is not true.","Jesus answered and said unto them, Even if I bear witness of myself, my witness is true; for I know whence I came, and whither I go; but ye know not whence I come, or whither I go.","Ye judge after the flesh; I judge no man.","Yea and if I judge, my judgment is true; for I am not alone, but I and the Father that sent me.","Yea and in your law it is written, that the witness of two men is true.","I am he that beareth witness of myself, and the Father that sent me beareth witness of me.","They said therefore unto him, Where is thy Father? Jesus answered, Ye know neither me, nor my Father: if ye knew me, ye would know my Father also.","These words spake he in the treasury, as he taught in the temple: and no man took him; because his hour was not yet come.","He said therefore again unto them, I go away, and ye shall seek me, and shall die in your sin: whither I go, ye cannot come.","The Jews therefore said, Will he kill himself, that he saith, Whither I go, ye cannot come?","And he said unto them, Ye are from beneath; I am from above: ye are of this world; I am not of this world.","I said therefore unto you, that ye shall die in your sins: for except ye believe that I am he, ye shall die in your sins.","They said therefore unto him, Who art thou? Jesus said unto them, Even that which I have also spoken unto you from the beginning.","I have many things to speak and to judge concerning you: howbeit he that sent me is true; and the things which I heard from him, these speak I unto the world.","They perceived not that he spake to them of the Father.","Jesus therefore said, When ye have lifted up the Son of man, then shall ye know that I am he, and that I do nothing of myself, but as the Father taught me, I speak these things.","And he that sent me is with me; he hath not left me alone; for I do always the things that are pleasing to him.","As he spake these things, many believed on him.","Jesus therefore said to those Jews that had believed him, If ye abide in my word, then are ye truly my disciples;","and ye shall know the truth, and the truth shall make you free.","They answered unto him, We are Abraham’s seed, and have never yet been in bondage to any man: how sayest thou, Ye shall be made free?","Jesus answered them, Verily, verily, I say unto you, Every one that committeth sin is the bondservant of sin.","And the bondservant abideth not in the house for ever: the son abideth for ever.","If therefore the Son shall make you free, ye shall be free indeed.","I know that ye are Abraham’s seed; yet ye seek to kill me, because my word hath not free course in you.","I speak the things which I have seen with my Father: and ye also do the things which ye heard from your father.","They answered and said unto him, Our father is Abraham. Jesus saith unto them, If ye were Abraham’s children, ye would do the works of Abraham.","But now ye seek to kill me, a man that hath told you the truth, which I heard from God: this did not Abraham.","Ye do the works of your father. They said unto him, We were not born of fornication; we have one Father, even God.","Jesus said unto them, If God were your Father, ye would love me: for I came forth and am come from God; for neither have I come of myself, but he sent me.","Why do ye not understand my speech? Even because ye cannot hear my word.","Ye are of your father the devil, and the lusts of your father it is your will to do. He was a murderer from the beginning, and standeth not in the truth, because there is no truth in him. When he speaketh a lie, he speaketh of his own: for he is a liar, and the father thereof.","But because I say the truth, ye believe me not.","Which of you convicteth me of sin? If I say truth, why do ye not believe me?","He that is of God heareth the words of God: for this cause ye hear them not, because ye are not of God.","The Jews answered and said unto him, Say we not well that thou art a Samaritan, and hast a demon?","Jesus answered, I have not a demon; but I honor my Father, and ye dishonor me.","But I seek not mine own glory: there is one that seeketh and judgeth.","Verily, verily, I say unto you, If a man keep my word, he shall never see death.","The Jews said unto him, Now we know that thou hast a demon. Abraham died, and the prophets; and thou sayest, If a man keep my word, he shall never taste of death.","Art thou greater than our father Abraham, who died? and the prophets died: whom makest thou thyself?","Jesus answered, If I glorify myself, my glory is nothing: it is my Father that glorifieth me; of whom ye say, that he is your God;","and ye have not known him: but I know him; and if I should say, I know him not, I shall be like unto you, a liar: but I know him, and keep his word.","Your father Abraham rejoiced to see my day; and he saw it, and was glad.","The Jews therefore said unto him, Thou art not yet fifty years old, and hast thou seen Abraham?","Jesus said unto them, Verily, verily, I say unto you, Before Abraham was born, I am.","They took up stones therefore to cast at him: but Jesus hid himself, and went out of the temple."],"9":["And as he passed by, he saw a man blind from his birth.","And his disciples asked him, saying, Rabbi, who sinned, this man, or his parents, that he should be born blind?","Jesus answered, Neither did this man sin, nor his parents: but that the works of God should be made manifest in him.","We must work the works of him that sent me, while it is day: the night cometh, when no man can work.","When I am in the world, I am the light of the world.","When he had thus spoken, he spat on the ground, and made clay of the spittle, and anointed his eyes with the clay,","and said unto him, Go, wash in the pool of Siloam (which is by interpretation, Sent). He went away therefore, and washed, and came seeing.","The neighbors therefore, and they that saw him aforetime, that he was a beggar, said, Is not this he that sat and begged?","Others said, It is he: others said, No, but he is like him. He said, I am he.","They said therefore unto him, How then were thine eyes opened?","He answered, The man that is called Jesus made clay, and anointed mine eyes, and said unto me, Go to Siloam, and wash: so I went away and washed, and I received sight.","And they said unto him, Where is he? He saith, I know not.","They bring to the Pharisees him that aforetime was blind.","Now it was the sabbath on the day when Jesus made the clay, and opened his eyes.","Again therefore the Pharisees also asked him how he received his sight. And he said unto them, He put clay upon mine eyes, and I washed, and I see.","Some therefore of the Pharisees said, This man is not from God, because he keepeth not the sabbath. But others said, How can a man that is a sinner do such signs? And there was a division among them.","They say therefore unto the blind man again, What sayest thou of him, in that he opened thine eyes? And he said, He is a prophet.","The Jews therefore did not believe concerning him, that he had been blind, and had received his sight, until they called the parents of him that had received his sight,","and asked them, saying, Is this your son, who ye say was born blind? how then doth he now see?","His parents answered and said, We know that this is our son, and that he was born blind:","but how he now seeth, we know not; or who opened his eyes, we know not: ask him; he is of age; he shall speak for himself.","These things said his parents, because they feared the Jews: for the Jews had agreed already, that if any man should confess him to be Christ, he should be put out of the synagogue.","Therefore said his parents, He is of age; ask him.","So they called a second time the man that was blind, and said unto him, Give glory to God: we know that this man is a sinner.","He therefore answered, Whether he is a sinner, I know not: one thing I know, that, whereas I was blind, now I see.","They said therefore unto him, What did he to thee? how opened he thine eyes?","He answered them, I told you even now, and ye did not hear; wherefore would ye hear it again? would ye also become his disciples?","And they reviled him, and said, Thou art his disciple; but we are disciples of Moses.","We know that God hath spoken unto Moses: but as for this man, we know not whence he is.","The man answered and said unto them, Why, herein is the marvel, that ye know not whence he is, and yet he opened mine eyes.","We know that God heareth not sinners: but if any man be a worshipper of God, and do his will, him he heareth.","Since the world began it was never heard that any one opened the eyes of a man born blind.","If this man were not from God, he could do nothing.","They answered and said unto him, Thou wast altogether born in sins, and dost thou teach us? And they cast him out.","Jesus heard that they had cast him out; and finding him, he said, Dost thou believe on the Son of God?","He answered and said, And who is he, Lord, that I may believe on him?","Jesus said unto him, Thou hast both seen him, and he it is that speaketh with thee.","And he said, Lord, I believe. And he worshipped him.","And Jesus said, For judgment came I into this world, that they that see not may see; and that they that see may become blind.","Those of the Pharisees who were with him heard these things, and said unto him, Are we also blind?","Jesus said unto them, If ye were blind, ye would have no sin: but now ye say, We see: your sin remaineth."],"10":["Verily, verily, I say unto you, He that entereth not by the door into the fold of the sheep, but climbeth up some other way, the same is a thief and a robber.","But he that entereth in by the door is the shepherd of the sheep.","To him the porter openeth; and the sheep hear his voice: and he calleth his own sheep by name, and leadeth them out.","When he hath put forth all his own, he goeth before them, and the sheep follow him: for they know his voice.","And a stranger will they not follow, but will flee from him: for they know not the voice of strangers.","This parable spake Jesus unto them: but they understood not what things they were which he spake unto them.","Jesus therefore said unto them again, Verily, verily, I say unto you, I am the door of the sheep.","All that came before me are thieves and robbers: but the sheep did not hear them.","I am the door; by me if any man enter in, he shall be saved, and shall go in and go out, and shall find pasture.","The thief cometh not, but that he may steal, and kill, and destroy: I came that they may have life, and may have it abundantly.","I am the good shepherd: the good shepherd layeth down his life for the sheep.","He that is a hireling, and not a shepherd, whose own the sheep are not, beholdeth the wolf coming, and leaveth the sheep, and fleeth, and the wolf snatcheth them, and scattereth them:","he fleeth because he is a hireling, and careth not for the sheep.","I am the good shepherd; and I know mine own, and mine own know me,","even as the Father knoweth me, and I know the Father; and I lay down my life for the sheep.","And other sheep I have, which are not of this fold: them also I must bring, and they shall hear my voice; and they shall become one flock, one shepherd.","Therefore doth the Father love me, because I lay down my life, that I may take it again.","No one taketh it away from me, but I lay it down of myself. I have power to lay it down, and I have power to take it again. This commandment received I from my Father.","There arose a division again among the Jews because of these words.","And many of them said, He hath a demon, and is mad; why hear ye him?","Others said, These are not the sayings of one possessed with a demon. Can a demon open the eyes of the blind?","And it was the feast of the dedication at Jerusalem:","it was winter; and Jesus was walking in the temple in Solomon’s porch.","The Jews therefore came round about him, and said unto him, How long dost thou hold us in suspense? If thou art the Christ, tell us plainly.","Jesus answered them, I told you, and ye believe not: the works that I do in my Father’s name, these bear witness of me.","But ye believe not, because ye are not of my sheep.","My sheep hear my voice, and I know them, and they follow me:","and I give unto them eternal life; and they shall never perish, and no one shall snatch them out of my hand.","My Father, who hath given them unto me, is greater than all; and no one is able to snatch them out of the Father’s hand.","I and the Father are one.","The Jews took up stones again to stone him.","Jesus answered them, Many good works have I showed you from the Father; for which of those works do ye stone me?","The Jews answered him, For a good work we stone thee not, but for blasphemy; and because that thou, being a man, makest thyself God.","Jesus answered them, Is it not written in your law, I said, Ye are gods?","If he called them gods, unto whom the word of God came (and the scripture cannot be broken),","say ye of him, whom the Father sanctified and sent into the world, Thou blasphemest; because I said, I am the Son of God?","If I do not the works of my Father, believe me not.","But if I do them, though ye believe not me, believe the works: that ye may know and understand that the Father is in me, and I in the Father.","They sought again to take him: and he went forth out of their hand.","And he went away again beyond the Jordan into the place where John was at the first baptizing; and there he abode.","And many came unto him; and they said, John indeed did no sign: but all things whatsoever John spake of this man were true.","And many believed on him there."],"11":["Now a certain man was sick, Lazarus of Bethany, of the village of Mary and her sister Martha.","And it was that Mary who anointed the Lord with ointment, and wiped his feet with her hair, whose brother Lazarus was sick.","The sisters therefore sent unto him, saying, Lord, behold, he whom thou lovest is sick.","But when Jesus heard it, he said, This sickness is not unto death, but for the glory of God, that the Son of God may be glorified thereby.","Now Jesus loved Martha, and her sister, and Lazarus.","When therefore he heard that he was sick, he abode at that time two days in the place where he was.","Then after this he saith to the disciples, Let us go into Judæa again.","The disciples say unto him, Rabbi, the Jews were but now seeking to stone thee; and goest thou thither again?","Jesus answered, Are there not twelve hours in the day? If a man walk in the day, he stumbleth not, because he seeth the light of this world.","But if a man walk in the night, he stumbleth, because the light is not in him.","These things spake he: and after this he saith unto them, Our friend Lazarus is fallen asleep; but I go, that I may awake him out of sleep.","The disciples therefore said unto him, Lord, if he is fallen asleep, he will recover.","Now Jesus had spoken of his death: but they thought that he spake of taking rest in sleep.","Then Jesus therefore said unto them plainly, Lazarus is dead.","And I am glad for your sakes that I was not there, to the intent ye may believe; nevertheless let us go unto him.","Thomas therefore, who is called Didymus, said unto his fellow-disciples, Let us also go, that we may die with him.","So when Jesus came, he found that he had been in the tomb four days already.","Now Bethany was nigh unto Jerusalem, about fifteen furlongs off;","and many of the Jews had come to Martha and Mary, to console them concerning their brother.","Martha therefore, when she heard that Jesus was coming, went and met him: but Mary still sat in the house.","Martha therefore said unto Jesus, Lord, if thou hadst been here, my brother had not died.","And even now I know that, whatsoever thou shalt ask of God, God will give thee.","Jesus saith unto her, Thy brother shall rise again.","Martha saith unto him, I know that he shall rise again in the resurrection at the last day.","Jesus said unto her, I am the resurrection, and the life: he that believeth on me, though he die, yet shall he live;","and whosoever liveth and believeth on me shall never die. Believest thou this?","She saith unto him, Yea, Lord: I have believed that thou art the Christ, the Son of God, even he that cometh into the world.","And when she had said this, she went away, and called Mary her sister secretly, saying, The Teacher is here, and calleth thee.","And she, when she heard it, arose quickly, and went unto him.","(Now Jesus was not yet come into the village, but was still in the place where Martha met him.)","The Jews then who were with her in the house, and were consoling her, when they saw Mary, that she rose up quickly and went out, followed her, supposing that she was going unto the tomb to weep there.","Mary therefore, when she came where Jesus was, and saw him, fell down at his feet, saying unto him, Lord, if thou hadst been here, my brother had not died.","When Jesus therefore saw her weeping, and the Jews also weeping who came with her, he groaned in the spirit, and was troubled,","and said, Where have ye laid him? They say unto him, Lord, come and see.","Jesus wept.","The Jews therefore said, Behold how he loved him!","But some of them said, Could not this man, who opened the eyes of him that was blind, have caused that this man also should not die?","Jesus therefore again groaning in himself cometh to the tomb. Now it was a cave, and a stone lay against it.","Jesus saith, Take ye away the stone. Martha, the sister of him that was dead, saith unto him, Lord, by this time the body decayeth; for he hath been dead four days.","Jesus saith unto her, Said I not unto thee, that, if thou believedst, thou shouldest see the glory of God?","So they took away the stone. And Jesus lifted up his eyes, and said, Father, I thank thee that thou heardest me.","And I knew that thou hearest me always: but because of the multitude that standeth around I said it, that they may believe that thou didst send me.","And when he had thus spoken, he cried with a loud voice, Lazarus, come forth.","He that was dead came forth, bound hand and foot with grave-clothes; and his face was bound about with a napkin. Jesus saith unto them, Loose him, and let him go.","Many therefore of the Jews, who came to Mary and beheld that which he did, believed on him.","But some of them went away to the Pharisees, and told them the things which Jesus had done.","The chief priests therefore and the Pharisees gathered a council, and said, What do we? for this man doeth many signs.","If we let him thus alone, all men will believe on him: and the Romans will come and take away both our place and our nation.","But a certain one of them, Caiaphas, being high priest that year, said unto them, Ye know nothing at all,","nor do ye take account that it is expedient for you that one man should die for the people, and that the whole nation perish not.","Now this he said not of himself: but being high priest that year, he prophesied that Jesus should die for the nation;","and not for the nation only, but that he might also gather together into one the children of God that are scattered abroad.","So from that day forth they took counsel that they might put him to death.","Jesus therefore walked no more openly among the Jews, but departed thence into the country near to the wilderness, into a city called Ephraim; and there he tarried with the disciples.","Now the passover of the Jews was at hand: and many went up to Jerusalem out of the country before the passover, to purify themselves.","They sought therefore for Jesus, and spake one with another, as they stood in the temple, What think ye? That he will not come to the feast?","Now the chief priests and the Pharisees had given commandment, that, if any man knew where he was, he should show it, that they might take him."],"12":["Jesus therefore six days before the passover came to Bethany, where Lazarus was, whom Jesus raised from the dead.","So they made him a supper there: and Martha served; but Lazarus was one of them that sat at meat with him.","Mary therefore took a pound of ointment of pure nard, very precious, and anointed the feet of Jesus, and wiped his feet with her hair: and the house was filled with the odor of the ointment.","But Judas Iscariot, one of his disciples, that should betray him, saith,","Why was not this ointment sold for three hundred shillings, and given to the poor?","Now this he said, not because he cared for the poor; but because he was a thief, and having the bag took away what was put therein.","Jesus therefore said, Suffer her to keep it against the day of my burying.","For the poor ye have always with you; but me ye have not always.","The common people therefore of the Jews learned that he was there: and they came, not for Jesus’ sake only, but that they might see Lazarus also, whom he had raised from the dead.","But the chief priests took counsel that they might put Lazarus also to death;","because that by reason of him many of the Jews went away, and believed on Jesus.","On the morrow a great multitude that had come to the feast, when they heard that Jesus was coming to Jerusalem,","took the branches of the palm trees, and went forth to meet him, and cried out, Hosanna: Blessed is he that cometh in the name of the Lord, even the King of Israel.","And Jesus, having found a young ass, sat thereon; as it is written,","Fear not, daughter of Zion: behold, thy King cometh, sitting on an ass’s colt.","These things understood not his disciples at the first: but when Jesus was glorified, then remembered they that these things were written of him, and that they had done these things unto him.","The multitude therefore that was with him when he called Lazarus out of the tomb, and raised him from the dead, bare witness.","For this cause also the multitude went and met him, for that they heard that he had done this sign.","The Pharisees therefore said among themselves, Behold how ye prevail nothing; lo, the world is gone after him.","Now there were certain Greeks among those that went up to worship at the feast:","these therefore came to Philip, who was of Bethsaida of Galilee, and asked him, saying, Sir, we would see Jesus.","Philip cometh and telleth Andrew: Andrew cometh, and Philip, and they tell Jesus.","And Jesus answereth them, saying, The hour is come, that the Son of man should be glorified.","Verily, verily, I say unto you, Except a grain of wheat fall into the earth and die, it abideth by itself alone; but if it die, it beareth much fruit.","He that loveth his life loseth it; and he that hateth his life in this world shall keep it unto life eternal.","If any man serve me, let him follow me; and where I am, there shall also my servant be: if any man serve me, him will the Father honor.","Now is my soul troubled; and what shall I say? Father, save me from this hour. But for this cause came I unto this hour.","Father, glorify thy name. There came therefore a voice out of heaven, saying, I have both glorified it, and will glorify it again.","The multitude therefore, that stood by, and heard it, said that it had thundered: others said, An angel hath spoken to him.","Jesus answered and said, This voice hath not come for my sake, but for your sakes.","Now is the judgment of this world: now shall the prince of this world be cast out.","And I, if I be lifted up from the earth, will draw all men unto myself.","But this he said, signifying by what manner of death he should die.","The multitude therefore answered him, We have heard out of the law that the Christ abideth for ever: and how sayest thou, The Son of man must be lifted up? who is this Son of man?","Jesus therefore said unto them, Yet a little while is the light among you. Walk while ye have the light, that darkness overtake you not: and he that walketh in the darkness knoweth not whither he goeth.","While ye have the light, believe on the light, that ye may become sons of light. These things spake Jesus, and he departed and hid himself from them.","But though he had done so many signs before them, yet they believed not on him:","that the word of Isaiah the prophet might be fulfilled, which he spake, Lord, who hath believed our report? And to whom hath the arm of the Lord been revealed?","For this cause they could not believe, for that Isaiah said again,","He hath blinded their eyes, and he hardened their heart; Lest they should see with their eyes, and perceive with their heart, And should turn, And I should heal them.","These things said Isaiah, because he saw his glory; and he spake of him.","Nevertheless even of the rulers many believed on him; but because of the Pharisees they did not confess it, lest they should be put out of the synagogue:","for they loved the glory that is of men more than the glory that is of God.","And Jesus cried and said, He that believeth on me, believeth not on me, but on him that sent me.","And he that beholdeth me beholdeth him that sent me.","I am come a light into the world, that whosoever believeth on me may not abide in the darkness.","And if any man hear my sayings, and keep them not, I judge him not: for I came not to judge the world, but to save the world.","He that rejecteth me, and receiveth not my sayings, hath one that judgeth him: the word that I spake, the same shall judge him in the last day.","For I spake not from myself; but the Father that sent me, he hath given me a commandment, what I should say, and what I should speak.","And I know that his commandment is life eternal; the things therefore which I speak, even as the Father hath said unto me, so I speak."],"13":["Now before the feast of the passover, Jesus knowing that his hour was come that he should depart out of this world unto the Father, having loved his own that were in the world, he loved them unto the end.","And during supper, the devil having already put into the heart of Judas Iscariot, Simon’s son, to betray him,","Jesus, knowing that the Father had given all things into his hands, and that he came forth from God, and goeth unto God,","riseth from supper, and layeth aside his garments; and he took a towel, and girded himself.","Then he poureth water into the basin, and began to wash the disciples’ feet, and to wipe them with the towel wherewith he was girded.","So he cometh to Simon Peter. He saith unto him, Lord, dost thou wash my feet?","Jesus answered and said unto him, What I do thou knowest not now; but thou shalt understand hereafter.","Peter saith unto him, Thou shalt never wash my feet. Jesus answered him, If I wash thee not, thou hast no part with me.","Simon Peter saith unto him, Lord, not my feet only, but also my hands and my head.","Jesus saith to him, He that is bathed needeth not save to wash his feet, but is clean every whit: and ye are clean, but not all.","For he knew him that should betray him; therefore said he, Ye are not all clean.","So when he had washed their feet, and taken his garments, and sat down again, he said unto them, Know ye what I have done to you?","Ye call me, Teacher, and, Lord: and ye say well; for so I am.","If I then, the Lord and the Teacher, have washed your feet, ye also ought to wash one another’s feet.","For I have given you an example, that ye also should do as I have done to you.","Verily, verily, I say unto you, A servant is not greater than his lord; neither one that is sent greater than he that sent him.","If ye know these things, blessed are ye if ye do them.","I speak not of you all: I know whom I have chosen: but that the scripture may be fulfilled, He that eateth my bread lifted up his heel against me.","From henceforth I tell you before it come to pass, that, when it is come to pass, ye may believe that I am he.","Verily, verily, I say unto you, He that receiveth whomsoever I send receiveth me; and he that receiveth me receiveth him that sent me.","When Jesus had thus said, he was troubled in the spirit, and testified, and said, Verily, verily, I say unto you, that one of you shall betray me.","The disciples looked one on another, doubting of whom he spake.","There was at the table reclining in Jesus’ bosom one of his disciples, whom Jesus loved.","Simon Peter therefore beckoneth to him, and saith unto him, Tell us who it is of whom he speaketh.","He leaning back, as he was, on Jesus’ breast saith unto him, Lord, who is it?","Jesus therefore answereth, He it is, for whom I shall dip the sop, and give it him. So when he had dipped the sop, he taketh and giveth it to Judas, the son of Simon Iscariot.","And after the sop, then entered Satan into him. Jesus therefore saith unto him, What thou doest, do quickly.","Now no man at the table knew for what intent he spake this unto him.","For some thought, because Judas had the bag, that Jesus said unto him, Buy what things we have need of for the feast; or, that he should give something to the poor.","He then having received the sop went out straightway: and it was night.","When therefore he was gone out, Jesus saith, Now is the Son of man glorified, and God is glorified in him;","and God shall glorify him in himself, and straightway shall he glorify him.","Little children, yet a little while I am with you. Ye shall seek me: and as I said unto the Jews, Whither I go, ye cannot come; so now I say unto you.","A new commandment I give unto you, that ye love one another; even as I have loved you, that ye also love one another.","By this shall all men know that ye are my disciples, if ye have love one to another.","Simon Peter saith unto him, Lord, whither goest thou? Jesus answered, Whither I go, thou canst not follow me now; but thou shalt follow afterwards.","Peter saith unto him, Lord, why cannot I follow thee even now? I will lay down my life for thee.","Jesus answereth, Wilt thou lay down thy life for me? Verily, verily, I say unto thee, The cock shall not crow, till thou hast denied me thrice."],"14":["Let not your heart be troubled: believe in God, believe also in me.","In my Father’s house are many mansions; if it were not so, I would have told you; for I go to prepare a place for you.","And if I go and prepare a place for you, I come again, and will receive you unto myself; that where I am, there ye may be also.","And whither I go, ye know the way.","Thomas saith unto him, Lord, we know not whither thou goest; how know we the way?","Jesus saith unto him, I am the way, and the truth, and the life: no one cometh unto the Father, but by me.","If ye had known me, ye would have known my Father also: from henceforth ye know him, and have seen him.","Philip saith unto him, Lord, show us the Father, and it sufficeth us.","Jesus saith unto him, Have I been so long time with you, and dost thou not know me, Philip? he that hath seen me hath seen the Father; how sayest thou, Show us the Father?","Believest thou not that I am in the Father, and the Father in me? the words that I say unto you I speak not from myself: but the Father abiding in me doeth his works.","Believe me that I am in the Father, and the Father in me: or else believe me for the very works’ sake.","Verily, verily, I say unto you, He that believeth on me, the works that I do shall he do also; and greater works than these shall he do; because I go unto the Father.","And whatsoever ye shall ask in my name, that will I do, that the Father may be glorified in the Son.","If ye shall ask anything in my name, that will I do.","If ye love me, ye will keep my commandments.","And I will pray the Father, and he shall give you another Comforter, that he may be with you for ever,","even the Spirit of truth: whom the world cannot receive; for it beholdeth him not, neither knoweth him: ye know him; for he abideth with you, and shall be in you.","I will not leave you desolate: I come unto you.","Yet a little while, and the world beholdeth me no more; but ye behold me: because I live, ye shall live also.","In that day ye shall know that I am in my Father, and ye in me, and I in you.","He that hath my commandments, and keepeth them, he it is that loveth me: and he that loveth me shall be loved of my Father, and I will love him, and will manifest myself unto him.","Judas (not Iscariot) saith unto him, Lord, what is come to pass that thou wilt manifest thyself unto us, and not unto the world?","Jesus answered and said unto him, If a man love me, he will keep my word: and my Father will love him, and we will come unto him, and make our abode with him.","He that loveth me not keepeth not my words: and the word which ye hear is not mine, but the Father’s who sent me.","These things have I spoken unto you, while yet abiding with you.","But the Comforter, even the Holy Spirit, whom the Father will send in my name, he shall teach you all things, and bring to your remembrance all that I said unto you.","Peace I leave with you; my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be fearful.","Ye heard how I said to you, I go away, and I come unto you. If ye loved me, ye would have rejoiced, because I go unto the Father: for the Father is greater than I.","And now I have told you before it come to pass, that, when it is come to pass, ye may believe.","I will no more speak much with you, for the prince of the world cometh: and he hath nothing in me;","but that the world may know that I love the Father, and as the Father gave me commandment, even so I do. Arise, let us go hence."],"15":["I am the true vine, and my Father is the husbandman.","Every branch in me that beareth not fruit, he taketh it away: and every branch that beareth fruit, he cleanseth it, that it may bear more fruit.","Already ye are clean because of the word which I have spoken unto you.","Abide in me, and I in you. As the branch cannot bear fruit of itself, except it abide in the vine; so neither can ye, except ye abide in me.","I am the vine, ye are the branches: He that abideth in me, and I in him, the same beareth much fruit: for apart from me ye can do nothing.","If a man abide not in me, he is cast forth as a branch, and is withered; and they gather them, and cast them into the fire, and they are burned.","If ye abide in me, and my words abide in you, ask whatsoever ye will, and it shall be done unto you.","Herein is my Father glorified, that ye bear much fruit; and so shall ye be my disciples.","Even as the Father hath loved me, I also have loved you: abide ye in my love.","If ye keep my commandments, ye shall abide in my love; even as I have kept my Father’s commandments, and abide in his love.","These things have I spoken unto you, that my joy may be in you, and that your joy may be made full.","This is my commandment, that ye love one another, even as I have loved you.","Greater love hath no man than this, that a man lay down his life for his friends.","Ye are my friends, if ye do the things which I command you.","No longer do I call you servants; for the servant knoweth not what his lord doeth: but I have called you friends; for all things that I heard from my Father I have made known unto you.","Ye did not choose me, but I chose you, and appointed you, that ye should go and bear fruit, and that your fruit should abide: that whatsoever ye shall ask of the Father in my name, he may give it you.","These things I command you, that ye may love one another.","If the world hateth you, ye know that it hath hated me before it hated you.","If ye were of the world, the world would love its own: but because ye are not of the world, but I chose you out of the world, therefore the world hateth you.","Remember the word that I said unto you, A servant is not greater than his lord. If they persecuted me, they will also persecute you; if they kept my word, they will keep yours also.","But all these things will they do unto you for my name’s sake, because they know not him that sent me.","If I had not come and spoken unto them, they had not had sin: but now they have no excuse for their sin.","He that hateth me hateth my Father also.","If I had not done among them the works which none other did, they had not had sin: but now have they both seen and hated both me and my Father.","But this cometh to pass, that the word may be fulfilled that is written in their law, They hated me without a cause.","But when the Comforter is come, whom I will send unto you from the Father, even the Spirit of truth, which proceedeth from the Father, he shall bear witness of me:","and ye also bear witness, because ye have been with me from the beginning."],"16":["These things have I spoken unto you, that ye should not be caused to stumble.","They shall put you out of the synagogues: yea, the hour cometh, that whosoever killeth you shall think that he offereth service unto God.","And these things will they do, because they have not known the Father, nor me.","But these things have I spoken unto you, that when their hour is come, ye may remember them, how that I told you. And these things I said not unto you from the beginning, because I was with you.","But now I go unto him that sent me; and none of you asketh me, Whither goest thou?","But because I have spoken these things unto you, sorrow hath filled your heart.","Nevertheless I tell you the truth: It is expedient for you that I go away; for if I go not away, the Comforter will not come unto you; but if I go, I will send him unto you.","And he, when he is come, will convict the world in respect of sin, and of righteousness, and of judgment:","of sin, because they believe not on me;","of righteousness, because I go to the Father, and ye behold me no more;","of judgment, because the prince of this world hath been judged.","I have yet many things to say unto you, but ye cannot bear them now.","Howbeit when he, the Spirit of truth, is come, he shall guide you into all the truth: for he shall not speak from himself; but what things soever he shall hear, these shall he speak: and he shall declare unto you the things that are to come.","He shall glorify me: for he shall take of mine, and shall declare it unto you.","All things whatsoever the Father hath are mine: therefore said I, that he taketh of mine, and shall declare it unto you.","A little while, and ye behold me no more; and again a little while, and ye shall see me.","Some of his disciples therefore said one to another, What is this that he saith unto us, A little while, and ye behold me not; and again a little while, and ye shall see me: and, Because I go to the Father?","They said therefore, What is this that he saith, A little while? We know not what he saith.","Jesus perceived that they were desirous to ask him, and he said unto them, Do ye inquire among yourselves concerning this, that I said, A little while, and ye behold me not, and again a little while, and ye shall see me?","Verily, verily, I say unto you, that ye shall weep and lament, but the world shall rejoice: ye shall be sorrowful, but your sorrow shall be turned into joy.","A woman when she is in travail hath sorrow, because her hour is come: but when she is delivered of the child, she remembereth no more the anguish, for the joy that a man is born into the world.","And ye therefore now have sorrow: but I will see you again, and your heart shall rejoice, and your joy no one taketh away from you.","And in that day ye shall ask me no question. Verily, verily, I say unto you, If ye shall ask anything of the Father, he will give it you in my name.","Hitherto have ye asked nothing in my name: ask, and ye shall receive, that your joy may be made full.","These things have I spoken unto you in dark sayings: the hour cometh, when I shall no more speak unto you in dark sayings, but shall tell you plainly of the Father.","In that day ye shall ask in my name: and I say not unto you, that I will pray the Father for you;","for the Father himself loveth you, because ye have loved me, and have believed that I came forth from the Father.","I came out from the Father, and am come into the world: again, I leave the world, and go unto the Father.","His disciples say, Lo, now speakest thou plainly, and speakest no dark saying.","Now know we that thou knowest all things, and needest not that any man should ask thee: by this we believe that thou camest forth from God.","Jesus answered them, Do ye now believe?","Behold, the hour cometh, yea, is come, that ye shall be scattered, every man to his own, and shall leave me alone: and yet I am not alone, because the Father is with me.","These things have I spoken unto you, that in me ye may have peace. In the world ye have tribulation: but be of good cheer; I have overcome the world."],"17":["These things spake Jesus; and lifting up his eyes to heaven, he said, Father, the hour is come; glorify thy Son, that the Son may glorify thee:","even as thou gavest him authority over all flesh, that to all whom thou hast given him, he should give eternal life.","And this is life eternal, that they should know thee the only true God, and him whom thou didst send, even Jesus Christ.","I glorified thee on the earth, having accomplished the work which thou hast given me to do.","And now, Father, glorify thou me with thine own self with the glory which I had with thee before the world was.","I manifested thy name unto the men whom thou gavest me out of the world: thine they were, and thou gavest them to me; and they have kept thy word.","Now they know that all things whatsoever thou hast given me are from thee:","for the words which thou gavest me I have given unto them; and they received them, and knew of a truth that I came forth from thee, and they believed that thou didst send me.","I pray for them: I pray not for the world, but for those whom thou hast given me; for they are thine:","and all things that are mine are thine, and thine are mine: and I am glorified in them.","And I am no more in the world, and these are in the world, and I come to thee. Holy Father, keep them in thy name which thou hast given me, that they may be one, even as we are.","While I was with them, I kept them in thy name which thou hast given me: and I guarded them, and not one of them perished, but the son of perdition; that the scripture might be fulfilled.","But now I come to thee; and these things I speak in the world, that they may have my joy made full in themselves.","I have given them thy word; and the world hated them, because they are not of the world, even as I am not of the world.","I pray not that thou shouldest take them from the world, but that thou shouldest keep them from the evil one.","They are not of the world, even as I am not of the world.","Sanctify them in the truth: thy word is truth.","As thou didst send me into the world, even so sent I them into the world.","And for their sakes I sanctify myself, that they themselves also may be sanctified in truth.","Neither for these only do I pray, but for them also that believe on me through their word;","that they may all be one; even as thou, Father, art in me, and I in thee, that they also may be in us: that the world may believe that thou didst send me.","And the glory which thou hast given me I have given unto them; that they may be one, even as we are one;","I in them, and thou in me, that they may be perfected into one; that the world may know that thou didst send me, and lovedst them, even as thou lovedst me.","Father, I desire that they also whom thou hast given me be with me where I am, that they may behold my glory, which thou hast given me: for thou lovedst me before the foundation of the world.","O righteous Father, the world knew thee not, but I knew thee; and these knew that thou didst send me;","and I made known unto them thy name, and will make it known; that the love wherewith thou lovedst me may be in them, and I in them."],"18":["When Jesus had spoken these words, he went forth with his disciples over the brook Kidron, where was a garden, into which he entered, himself and his disciples.","Now Judas also, who betrayed him, knew the place: for Jesus oft-times resorted thither with his disciples.","Judas then, having received the band of soldiers, and officers from the chief priests and the Pharisees, cometh thither with lanterns and torches and weapons.","Jesus therefore, knowing all the things that were coming upon him, went forth, and saith unto them, Whom seek ye?","They answered him, Jesus of Nazareth. Jesus saith unto them, I am he. And Judas also, who betrayed him, was standing with them.","When therefore he said unto them, I am he, they went backward, and fell to the ground.","Again therefore he asked them, Whom seek ye? And they said, Jesus of Nazareth.","Jesus answered, I told you that I am he; if therefore ye seek me, let these go their way:","that the word might be fulfilled which he spake, Of those whom thou hast given me I lost not one.","Simon Peter therefore having a sword drew it, and struck the high priest’s servant, and cut off his right ear. Now the servant’s name was Malchus.","Jesus therefore said unto Peter, Put up the sword into the sheath: the cup which the Father hath given me, shall I not drink it?","So the band and the chief captain, and the officers of the Jews, seized Jesus and bound him,","and led him to Annas first; for he was father in law to Caiaphas, who was high priest that year.","Now Caiaphas was he that gave counsel to the Jews, that it was expedient that one man should die for the people.","And Simon Peter followed Jesus, and so did another disciple. Now that disciple was known unto the high priest, and entered in with Jesus into the court of the high priest;","but Peter was standing at the door without. So the other disciple, who was known unto the high priest, went out and spake unto her that kept the door, and brought in Peter.","The maid therefore that kept the door saith unto Peter, Art thou also one of this man’s disciples? He saith, I am not.","Now the servants and the officers were standing there, having made a fire of coals; for it was cold; and they were warming themselves: and Peter also was with them, standing and warming himself.","The high priest therefore asked Jesus of his disciples, and of his teaching.","Jesus answered him, I have spoken openly to the world; I ever taught in synagogues, and in the temple, where all the Jews come together; and in secret spake I nothing.","Why askest thou me? ask them that have heard me, what I spake unto them: behold, these know the things which I said.","And when he had said this, one of the officers standing by struck Jesus with his hand, saying, Answerest thou the high priest so?","Jesus answered him, If I have spoken evil, bear witness of the evil: but if well, why smitest thou me?","Annas therefore sent him bound unto Caiaphas the high priest.","Now Simon Peter was standing and warming himself. They said therefore unto him, Art thou also one of his disciples? He denied, and said, I am not.","One of the servants of the high priest, being a kinsman of him whose ear Peter cut off, saith, Did not I see thee in the garden with him?","Peter therefore denied again: and straightway the cock crew.","They lead Jesus therefore from Caiaphas into the Prætorium: and it was early; and they themselves entered not into the Prætorium, that they might not be defiled, but might eat the passover.","Pilate therefore went out unto them, and saith, What accusation bring ye against this man?","They answered and said unto him, If this man were not an evil-doer, we should not have delivered him up unto thee.","Pilate therefore said unto them, Take him yourselves, and judge him according to your law. The Jews said unto him, It is not lawful for us to put any man to death:","that the word of Jesus might be fulfilled, which he spake, signifying by what manner of death he should die.","Pilate therefore entered again into the Prætorium, and called Jesus, and said unto him, Art thou the King of the Jews?","Jesus answered, Sayest thou this of thyself, or did others tell it thee concerning me?","Pilate answered, Am I a Jew? Thine own nation and the chief priests delivered thee unto me: what hast thou done?","Jesus answered, My kingdom is not of this world: if my kingdom were of this world, then would my servants fight, that I should not be delivered to the Jews: but now is my kingdom not from hence.","Pilate therefore said unto him, Art thou a king then? Jesus answered, Thou sayest that I am a king. To this end have I been born, and to this end am I come into the world, that I should bear witness unto the truth. Every one that is of the truth heareth my voice.","Pilate saith unto him, What is truth? And when he had said this, he went out again unto the Jews, and saith unto them, I find no crime in him.","But ye have a custom, that I should release unto you one at the passover: will ye therefore that I release unto you the King of the Jews?","They cried out therefore again, saying, Not this man, but Barabbas. Now Barabbas was a robber."],"19":["Then Pilate therefore took Jesus, and scourged him.","And the soldiers platted a crown of thorns, and put it on his head, and arrayed him in a purple garment;","and they came unto him, and said, Hail, King of the Jews! and they struck him with their hands.","And Pilate went out again, and saith unto them, Behold, I bring him out to you, that ye may know that I find no crime in him.","Jesus therefore came out, wearing the crown of thorns and the purple garment. And Pilate saith unto them, Behold, the man!","When therefore the chief priests and the officers saw him, they cried out, saying, Crucify him, crucify him! Pilate saith unto them, Take him yourselves, and crucify him: for I find no crime in him.","The Jews answered him, We have a law, and by that law he ought to die, because he made himself the Son of God.","When Pilate therefore heard this saying, he was the more afraid;","and he entered into the Prætorium again, and saith unto Jesus, Whence art thou? But Jesus gave him no answer.","Pilate therefore saith unto him, Speakest thou not unto me? knowest thou not that I have power to release thee, and have power to crucify thee?","Jesus answered him, Thou wouldest have no power against me, except it were given thee from above: therefore he that delivered me unto thee hath greater sin.","Upon this Pilate sought to release him: but the Jews cried out, saying, If thou release this man, thou art not Cæsar’s friend: every one that maketh himself a king speaketh against Cæsar.","When Pilate therefore heard these words, he brought Jesus out, and sat down on the judgment-seat at a place called The Pavement, but in Hebrew, Gabbatha.","Now it was the Preparation of the passover: it was about the sixth hour. And he saith unto the Jews, Behold, your King!","They therefore cried out, Away with him, away with him, crucify him! Pilate saith unto them, Shall I crucify your King? The chief priests answered, We have no king but Cæsar.","Then therefore he delivered him unto them to be crucified.","They took Jesus therefore: and he went out, bearing the cross for himself, unto the place called The place of a skull, which is called in Hebrew Golgotha:","where they crucified him, and with him two others, on either side one, and Jesus in the midst.","And Pilate wrote a title also, and put it on the cross. And there was written, JESUS OF NAZARETH, THE KING OF THE JEWS.","This title therefore read many of the Jews, for the place where Jesus was crucified was nigh to the city; and it was written in Hebrew, and in Latin, and in Greek.","The chief priests of the Jews therefore said to Pilate, Write not, The King of the Jews; but, that he said, I am King of the Jews.","Pilate answered, What I have written I have written.","The soldiers therefore, when they had crucified Jesus, took his garments and made four parts, to every soldier a part; and also the coat: now the coat was without seam, woven from the top throughout.","They said therefore one to another, Let us not rend it, but cast lots for it, whose it shall be: that the scripture might be fulfilled, which saith, They parted my garments among them, And upon my vesture did they cast lots.","These things therefore the soldiers did. But there were standing by the cross of Jesus his mother, and his mother’s sister, Mary the wife of Clopas, and Mary Magdalene.","When Jesus therefore saw his mother, and the disciple standing by whom he loved, he saith unto his mother, Woman, behold, thy son!","Then saith he to the disciple, Behold, thy mother! And from that hour the disciple took her unto his own home.","After this Jesus, knowing that all things are now finished, that the scripture might be accomplished, saith, I thirst.","There was set there a vessel full of vinegar: so they put a sponge full of the vinegar upon hyssop, and brought it to his mouth.","When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up his spirit.","The Jews therefore, because it was the Preparation, that the bodies should not remain on the cross upon the sabbath (for the day of that sabbath was a high day), asked of Pilate that their legs might be broken, and that they might be taken away.","The soldiers therefore came, and brake the legs of the first, and of the other that was crucified with him:","but when they came to Jesus, and saw that he was dead already, they brake not his legs:","howbeit one of the soldiers with a spear pierced his side, and straightway there came out blood and water.","And he that hath seen hath borne witness, and his witness is true: and he knoweth that he saith true, that ye also may believe.","For these things came to pass, that the scripture might be fulfilled, A bone of him shall not be broken.","And again another scripture saith, They shall look on him whom they pierced.","And after these things Joseph of Arimathæa, being a disciple of Jesus, but secretly for fear of the Jews, asked of Pilate that he might take away the body of Jesus: and Pilate gave him leave. He came therefore, and took away his body.","And there came also Nicodemus, he who at the first came to him by night, bringing a mixture of myrrh and aloes, about a hundred pounds.","So they took the body of Jesus, and bound it in linen cloths with the spices, as the custom of the Jews is to bury.","Now in the place where he was crucified there was a garden; and in the garden a new tomb wherein was never man yet laid.","There then because of the Jews’ Preparation (for the tomb was nigh at hand) they laid Jesus."],"20":["Now on the first day of the week cometh Mary Magdalene early, while it was yet dark, unto the tomb, and seeth the stone taken away from the tomb.","She runneth therefore, and cometh to Simon Peter, and to the other disciple whom Jesus loved, and saith unto them, They have taken away the Lord out of the tomb, and we know not where they have laid him.","Peter therefore went forth, and the other disciple, and they went toward the tomb.","And they ran both together: and the other disciple outran Peter, and came first to the tomb;","and stooping and looking in, he seeth the linen cloths lying; yet entered he not in.","Simon Peter therefore also cometh, following him, and entered into the tomb; and he beholdeth the linen cloths lying,","and the napkin, that was upon his head, not lying with the linen cloths, but rolled up in a place by itself.","Then entered in therefore the other disciple also, who came first to the tomb, and he saw, and believed.","For as yet they knew not the scripture, that he must rise again from the dead.","So the disciples went away again unto their own home.","But Mary was standing without at the tomb weeping: so, as she wept, she stooped and looked into the tomb;","and she beholdeth two angels in white sitting, one at the head, and one at the feet, where the body of Jesus had lain.","And they say unto her, Woman, why weepest thou? She saith unto them, Because they have taken away my Lord, and I know not where they have laid him.","When she had thus said, she turned herself back, and beholdeth Jesus standing, and knew not that it was Jesus.","Jesus saith unto her, Woman, why weepest thou? whom seekest thou? She, supposing him to be the gardener, saith unto him, Sir, if thou hast borne him hence, tell me where thou hast laid him, and I will take him away.","Jesus saith unto her, Mary. She turneth herself, and saith unto him in Hebrew, Rabboni; which is to say, Teacher.","Jesus saith to her, Touch me not; for I am not yet ascended unto the Father: but go unto my brethren, and say to them, I ascend unto my Father and your Father, and my God and your God.","Mary Magdalene cometh and telleth the disciples, I have seen the Lord; and that he had said these things unto her.","When therefore it was evening, on that day, the first day of the week, and when the doors were shut where the disciples were, for fear of the Jews, Jesus came and stood in the midst, and saith unto them, Peace be unto you.","And when he had said this, he showed unto them his hands and his side. The disciples therefore were glad, when they saw the Lord.","Jesus therefore said to them again, Peace be unto you: as the Fat
