## Summary

Read directly out of 9. The authorities have just cast out a healed sheep; Jesus says *I am the good shepherd.* The chapter names what 9 enacted: the difference between the hired hand and the Shepherd is the direction life moves — the thief draws life toward himself, the shepherd pours himself toward the flock. Center: 10:27–30, *my sheep hear my voice … I and the Father are one.*

## Reading

And John 10 should be read **directly out of John 9**. The chapter division can obscure the argument.

John 9 ends with Jesus confronting religious leaders who claim to see while failing to recognize what God is doing. John 10 immediately begins:

> “Truly, truly, I say to you, he who does not enter the sheepfold by the door but climbs in by another way, that man is a thief and a robber.”

Jesus is still answering the question:

**Who actually has authority to lead God's people?**

John 9 showed us false shepherding. John 10 names it.

### 10:1–6 — Shepherd, sheepfold, door

Jesus gives several images at once:

**sheep** — God's people  
**shepherd** — the one rightly tending them  
**sheepfold** — the gathered flock  
**door** — legitimate access  
**thief/robber** — one who approaches the sheep for another purpose

We shouldn't lock every image into a rigid one-to-one allegory, because Jesus himself shifts roles: shortly he will call himself both **the door** and **the shepherd**.

The functional distinction matters more.

The thief:

> “climbs in by another way.”

The shepherd:

> “enters by the door.”

So the first distinction concerns **right relation to the sheep**.

Then:

> “The sheep hear his voice, and he calls his own sheep by name and leads them out.”

Three movements:

**calls → hears → follows.**

And importantly:

> “he goes before them.”

The shepherd doesn't merely command from behind.

**He takes the path first.**

The sheep follow because:

> “they know his voice.”

This continues John 9 perfectly.

The formerly blind man did not initially know Jesus' identity. But he progressively recognized his voice until Jesus found him and he worshiped him.

The authorities heard the same Jesus and rejected him.

Again:

**same manifestation → different recognition.**

---

### 10:6 — “They did not understand”

John tells us:

> “This figure of speech Jesus used with them, but they did not understand what he was saying to them.”

That itself continues John 9.

They still **cannot see**.

So Jesus explains further.

---

### 10:7–10 — “I am the door”

> “Truly, truly, I say to you, I am the door of the sheep.”

A door has a very precise function:

**passage between domains.**

Jesus says:

> “If anyone enters by me, he will be saved and will go in and out and find pasture.”

“Saved” is **σωθήσεται (*sōthēsetai*)**, from *sōzō*: save, rescue, preserve.

Then comes one of John's great contrasts:

> “The thief comes only to steal and kill and destroy. I came that they may have life and have it abundantly.”

This returns us directly to John 6.

The governing distinction is:

**thief → takes life**

**Christ → gives life**

And *perissos*—“abundant”—means exceeding, beyond the ordinary measure.

Jesus is not merely preserving biological existence.

He gives **zōē**, the word John consistently uses for the life proceeding from God.

---

### 10:11 — “I am the good shepherd”

Now Jesus changes the image:

> “I am the good shepherd. The good shepherd lays down his life for the sheep.”

**καλός (*kalos*)** is “good,” but carries the sense of noble, fitting, beautiful, excellent.

And here Jesus defines good shepherding through **self-gift**.

This creates the fundamental polarity of the chapter:

**thief:** sheep → life taken for shepherd

**good shepherd:** shepherd → life given for sheep

That's the reversal.

Both interact with the sheep.

What distinguishes them is the **direction in which life moves**.

The thief draws toward himself.

The shepherd pours himself toward the flock.

---

### 10:12–13 — The hired hand

Jesus introduces a third figure:

> “He who is a hired hand and not a shepherd, who does not own the sheep…”

When the wolf comes:

> “he leaves the sheep and flees.”

Why?

> “because he is a hired hand and cares nothing for the sheep.”

The hired hand is different from the thief.

The thief actively exploits.

The hired hand may perform the correct actions **until the cost becomes greater than his compensation**.

So we have three relationships:

**thief:** uses the sheep.

**hired hand:** serves the sheep conditionally.

**shepherd:** gives himself for the sheep.

The test appears when the wolf comes.

Pressure reveals the actual relationship.

---

### 10:14–15 — Knowing

> “I am the good shepherd. I know my own and my own know me…”

Then Jesus says something astonishing:

> “just as the Father knows me and I know the Father.”

The sheep's relationship with Christ is patterned after **Christ's relationship with the Father**.

Again, the structure the reading has been tracing:

**Father ↔ Son ↔ disciple**

And “know” here cannot merely mean possession of information.

The Father doesn't merely possess accurate propositions concerning Jesus.

This is **relational knowledge**—recognition grounded in communion.

Then immediately:

> “and I lay down my life for the sheep.”

Knowing and self-giving are joined.

---

### 10:16 — “Other sheep”

> “And I have other sheep that are not of this fold. I must bring them also…”

The prevailing interpretation is that John is pointing toward the inclusion of Gentiles alongside Israel.

Then:

> “So there will be one flock, one shepherd.”

Notice:

not necessarily **one fold**.

**One flock.**

Unity is centered in the shepherd, not merely in an enclosure.

The organizing principle is **shared recognition of one voice**.

---

### 10:17–18 — “I lay it down of my own accord”

This section is essential:

> “For this reason the Father loves me, because I lay down my life that I may take it up again.”

Then:

> “No one takes it from me, but I lay it down of my own accord.”

That radically reframes the crucifixion.

Jesus will be arrested.

Bound.

Beaten.

Crucified.

Killed.

From one perspective, people take his life.

Jesus says at the deeper level:

> **“No one takes it from me.”**

Why?

Because he has already **given what they attempt to take**.

That is an extraordinary expression of freedom.

And notice how this relates to the reading of John 8.

Jesus' freedom is not the ability to prevent others from acting upon him.

His freedom consists in his action remaining fully aligned with the Father **within what they do to him**.

He says:

> “This charge I have received from my Father.”

So simultaneously:

**“I lay it down of my own accord.”**

and:

**“I received this command from my Father.”**

John sees no contradiction.

This is exactly the paradox we identified earlier:

**obedience and freedom coincide in Christ.**

Because his will and the Father's are not divided.

---

### 10:19–21 — Division again

> “There was again a division among the Jews because of these words.”

Again **schisma**.

Some say:

> “He has a demon.”

Others:

> “These are not the words of one who is oppressed by a demon. Can a demon open the eyes of the blind?”

There is John 9 again.

The healed blind man remains the evidence.

The sign demands interpretation.

And people divide according to what they can recognize in it.

---

### 10:22–26 — “Tell us plainly”

Now the setting changes to the Feast of Dedication—Hanukkah.

They surround Jesus:

> “How long will you keep us in suspense? If you are the Christ, tell us plainly.”

Jesus answers:

> “I told you, and you do not believe. The works that I do in my Father's name bear witness about me.”

Again:

**works → witness → recognition**

But then he says:

> “you do not believe because you are not among my sheep.”

That statement is severe.

And notice the causal direction:

He does not say here:

> You are not my sheep **because** you don't believe.

He says:

> You don't believe **because** you are not among my sheep.

John is pushing us toward something deeper than intellectual persuasion.

Recognition of Christ's voice presupposes some relationship between shepherd and sheep.

---

### 10:27–30 — “My sheep hear my voice”

Then perhaps the center of the chapter:

> “My sheep hear my voice, and I know them, and they follow me.”

Three movements again:

**hear → known → follow.**

Then:

> “I give them eternal life, and they will never perish…”

Notice again:

**Jesus gives zōē.**

And:

> “no one will snatch them out of my hand.”

Now compare this with the thief.

The thief attempts to **take** sheep.

Jesus says they cannot ultimately be taken from him.

Then:

> “My Father, who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.”

Jesus' hand.

Father's hand.

And then:

> **“I and the Father are one.”**

Greek:

**ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν**

The important word is **hen**—“one,” neuter—not *heis*, masculine.

So Jesus is not saying:

> “I am the Father.”

Father and Son remain distinguished.

Yet he claims profound unity with the Father, immediately in the context of their shared power to preserve and give life.

The later doctrine of the Trinity does not come from this verse alone, but this is unquestionably part of the textual material from which Nicene Christology developed.

---

### 10:31–39 — “You, being a man, make yourself God”

They pick up stones.

Jesus asks:

> “I have shown you many good works from the Father; for which of them are you going to stone me?”

They answer:

> “because you, being a man, make yourself God.”

And here the irony from John 8 returns.

**“Make yourself.”**

Jesus' entire discourse has denied that his identity is self-manufactured.

His works are:

**from the Father.**

His command:

**from the Father.**

His sheep:

**given by the Father.**

His authority:

**received from the Father.**

His claim isn't:

**I have made myself God.**

His claim is about the relationship in which he eternally stands toward God.

---

### 10:34–36 — “You are gods”

Jesus then cites Psalm 82:

> “I said, you are gods.”

This passage is frequently ripped out of context to claim that Jesus teaches that all humans are literally gods.

That is not what his argument requires.

His argument is essentially **from lesser to greater**.

If Scripture can apply *theoi* (“gods”) to those who received God's word, then merely objecting to the use of divine terminology cannot establish blasphemy concerning:

> “him whom the Father consecrated and sent into the world”

when he says:

> “I am the Son of God.”

Jesus isn't flattening himself into everyone else.

He's doing the opposite.

**If Scripture can speak that way concerning them, how much more must you reckon seriously with the One whom the Father sanctified and sent?**

---

### 10:37–38 — Look at the works

Then Jesus gives them an extraordinarily fair criterion:

> “If I am not doing the works of my Father, then do not believe me.”

That's important.

He does not demand belief detached from manifestation.

But:

> “if I do them, even though you do not believe me, believe the works…”

Why?

> “that you may know and understand that the Father is in me and I am in the Father.”

There is the deepest form of the mutual indwelling the reading has been tracing.

John 6:

**disciple in Christ / Christ in disciple**

John 10:

**Father in Christ / Christ in Father**

The former participation is grounded in the latter.

---

### 10:40–42 — Back across the Jordan

Jesus leaves Jerusalem and returns to where John had baptized.

And people say:

> “John did no sign, but everything that John said about this man was true.”

That's an almost perfect statement of **witness**.

John did not need to perform the works Jesus performed.

His task was to **report accurately what he had seen concerning Jesus**.

And:

> “many believed in him there.”

The chapter therefore ends not with coercion, but recognition.

---

### But now put John 9 and John 10 together

This is where it becomes much sharper.

In John 9, the religious authorities encounter a vulnerable member of the flock:

**a man born blind.**

What do they do?

They interrogate him.

Disbelieve his testimony.

Insult him.

Tell him he was “born in utter sin.”

And finally:

> **“they cast him out.”**

Then:

> **Jesus heard that they had cast him out, and having found him…**

Immediately afterward Jesus says:

> **“I am the good shepherd.”**

That sequence is devastating.

The shepherds of Israel **cast out the sheep**.

The Good Shepherd **goes and finds him**.

So John 10 isn't an abstract pastoral metaphor.

**John 9 has just shown us the difference between the hired hands and the Shepherd.**

And this illuminates something important from the reading above.

The man begins in blindness.

Jesus does not condemn him for blindness.

**Jesus sees him.**

Jesus acts upon him.

Jesus gives him sight.

When the man bears witness to what has been given, the authorities cast him out.

Jesus finds him again.

And then Jesus says:

> “My sheep hear my voice, and I know them…”

The man's security ultimately doesn't depend upon his ability to hold onto Jesus.

It begins with:

> **Jesus saw him.**

and culminates in:

> **Jesus found him.**

Which makes 10:28 suddenly concrete:

> “no one will snatch them out of my hand.”

John has just shown us people trying to determine whether this man belongs inside or outside God's people.

They throw him **out**.

Jesus effectively says:

**You cannot cast out of my hand what the Father has given me.**

That is the confrontation.

And it clarifies the entire shepherd discourse:

**False shepherding asks what the sheep can provide, prove, or conform to.**

**The Good Shepherd knows the sheep, calls them, leads them, finds them, protects them—and finally gives his own life for them.**

John 9 showed that shepherding enacted toward one man.

John 10 tells us **who that Shepherd is.**

## Witness

The Good Shepherd finds the sheep the shepherds cast out. Jesus sees him (9:1); Jesus finds him (9:35); then *I am the good shepherd.* The sequence is the confrontation.

The ground: the man's security does not rest on his grip. It begins with *Jesus saw him* and culminates in *Jesus found him.* 10:28 becomes concrete: you cannot cast out of my hand what the Father has given me. False shepherding asks what the sheep can provide, prove, or conform to. The Shepherd knows, calls, leads, finds, protects, and lays down his life.

The direction: 6 gave disciple-in-Christ / Christ-in-disciple; 10 gives Father-in-Christ / Christ-in-Father. The former participation is grounded in the latter. And the voice that calls by name is about to be heard inside a tomb.
</script>

<script type="text/markdown" data-chapter="11">
## Summary

The culmination of the signs. 9 gave sight to one who never had it; 11 gives life to one who has died. But the center is the correction of Martha: she believes in resurrection as something God will do; Jesus identifies resurrection with who he is. The delay belongs to the love (11:5–6). Christian revelation does not proclaim *God prevents death*; it proclaims *God raises the dead.* And the raising of Lazarus is what sends Jesus toward the tomb.

## Reading

John 11 is the culmination of the signs so far. John 9 gave sight to someone who had never seen; John 11 gives life to someone who has **actually died**.

But the chapter's center is not simply, “Jesus can resurrect Lazarus.”

It is Jesus' correction of Martha:

> “I am the resurrection and the life.” (11:25)

The distinction matters:

**Martha believes in resurrection as something God will do.  
Jesus identifies resurrection with who he is.**

### 11:1–3 — “He whom you love is ill”

Lazarus of Bethany is sick. His sisters send Jesus a remarkably simple message:

> “Lord, he whom you love is ill.”

They don't actually tell Jesus what to do.

They name:

**relationship + condition.**

And John immediately emphasizes Jesus' love for this family.

That becomes essential because what Jesus does next could otherwise be interpreted as indifference.

---

### 11:4 — “This illness does not lead to death”

Jesus says:

> “This illness does not lead to death. It is for the glory of God…”

But Lazarus **does die**.

So Jesus cannot mean:

> Lazarus will not biologically die.

The Greek *pros thanaton* is literally something like **“toward death.”**

Death occurs, but death is **not the terminus** of what is occurring.

That distinction is crucial.

Jesus sees the same event from beyond the point everyone else assumes is its conclusion.

For Mary and Martha:

**illness → death**

Jesus sees:

**illness → death → manifestation of God's glory → life**

So “not unto death” does not deny death as an event.

It denies death **finality**.

And then:

> “so that the Son of God may be glorified through it.”

Once again, as in John 9, an affliction becomes the place in which God's work is manifested.

---

### 11:5–6 — The disturbing “therefore”

This is one of the most important sentences in the chapter:

> “Now Jesus loved Martha and her sister and Lazarus. **So**, when he heard that Lazarus was ill, he stayed two days longer…”

The Greek really does connect these thoughts.

**Jesus loved them → therefore he remained where he was.**

That prevents us from explaining the delay as neglect.

John deliberately tells us:

**the delay belongs somehow to the love.**

That is much harder.

Because Jesus could apparently have prevented Lazarus' death.

Indeed, both sisters will independently tell him:

> “Lord, if you had been here, my brother would not have died.”

And Jesus intentionally waits.

So John forces us to confront something the reading has been discussing:

**divine love does not necessarily mean preventing the painful condition.**

Sometimes the work of love is accomplished **through something love could apparently have prevented**.

But again, we must follow the whole movement.

The purpose isn't:

**Lazarus dies.**

It is:

**Lazarus dies → Christ enters the death → Lazarus is called forth.**

The delay makes possible a revelation that immediate healing would not have manifested.

They already know Jesus as healer.

They are about to know something more.

---

### 11:7–10 — Back into danger

Jesus announces:

> “Let us go to Judea again.”

The disciples object because people there recently attempted to stone him.

Jesus responds with the imagery of day and light.

This continues chapters 8–9:

> “If anyone walks in the day, he does not stumble, because he sees the light of this world.”

Jesus is not being driven reactively by danger.

There remains an appointed path.

He walks it while it is day.

---

### 11:11–15 — “Lazarus has fallen asleep”

Jesus says:

> “Our friend Lazarus has fallen asleep, but I go to awaken him.”

The disciples interpret literally.

Jesus means death.

John then states:

> “Then Jesus told them plainly, ‘Lazarus has died.’”

And then comes another difficult statement:

> “and for your sake I am glad that I was not there, so that you may believe.”

Again, Jesus does **not** rejoice that Lazarus suffers or that his sisters grieve.

The stated object of his gladness is the opportunity for their **faith to deepen through what is about to be revealed**.

If Jesus had immediately healed Lazarus, they would have learned:

**Jesus heals sickness.**

Because Lazarus dies, they can encounter:

**Jesus has authority where healing is no longer possible because the patient is dead.**

And ultimately something stronger:

**Jesus himself is Life.**

---

### 11:16 — Thomas

Thomas says:

> “Let us also go, that we may die with him.”

Thomas is often reduced to “Doubting Thomas,” but John gives him something much richer.

He expects disaster.

Yet he follows.

His understanding may be incomplete, but his loyalty is real:

**If Jesus is walking toward death, we go with him.**

---

### 11:17–22 — Martha meets Jesus

When Jesus arrives, Lazarus has been in the tomb **four days**.

Martha goes out to meet him:

> “Lord, if you had been here, my brother would not have died.”

This isn't necessarily accusation.

It is simultaneously grief and faith.

Then:

> “But even now I know that whatever you ask from God, God will give you.”

Martha knows something extraordinary.

But she still doesn't yet see where Jesus is taking her.

---

### 11:23–24 — “Your brother will rise again”

Jesus says:

> “Your brother will rise again.”

Martha responds:

> “I know that he will rise again in the resurrection on the last day.”

And **she is correct**.

That's important.

Jesus isn't correcting a false doctrine.

She possesses correct theology.

She believes in the future resurrection.

But Jesus moves her from **correct doctrine about an event** into encounter with the person standing before her.

---

### 11:25–26 — “I AM the resurrection”

> “I am the resurrection and the life.”

This is the center.

Jesus does not say merely:

> **I cause resurrection.**

Nor:

> **I know how resurrection works.**

Nor even:

> **God will resurrect you through me.**

He says:

> **I AM the resurrection.**

And:

> **I AM the life.**

This is another *egō eimi* statement.

Then he unfolds the paradox:

> “Whoever believes in me, though he die, yet shall he live…”

**dies → lives**

Then:

> “and everyone who lives and believes in me shall never die.”

**lives → never dies**

Those appear contradictory if biological death is the only meaning of death.

But Lazarus himself demonstrates the distinction.

Lazarus biologically dies.

Yet Jesus says death does not possess final authority over the one whose life is grounded in him.

This connects directly to John 6:

> “Whoever feeds on me… will live because of me.”

Life is no longer understood as something the creature possesses autonomously.

If **Christ is the life**, then biological death cannot finally sever the person from the source of life.

---

### “Do you believe this?”

Jesus ends not with:

> “Do you understand this?”

But:

> **“Do you believe this?”**

Martha responds:

> “Yes, Lord; I believe that you are the Christ, the Son of God, who is coming into the world.”

That's one of John's great confessions.

And importantly, **Lazarus is still dead.**

She confesses Christ before seeing her brother emerge.

Her faith therefore precedes the sign's completion.

---

### 11:28–32 — Mary

Mary comes.

And says exactly what Martha said:

> “Lord, if you had been here, my brother would not have died.”

Same words.

But Jesus' interaction with her is different.

With Martha he enters theological dialogue.

With Mary, he encounters grief.

Mary falls at his feet weeping.

Those around her are weeping.

And Jesus' response changes.

---

### 11:33 — Jesus is deeply moved

ESV:

> “he was deeply moved in his spirit and greatly troubled.”

The Greek is stronger than “deeply moved” may suggest.

**ἐμβριμάομαι (*embrimaomai*)** can carry the sense of indignation, stern agitation, even anger.

So Jesus is not merely experiencing gentle sadness.

Something about the scene of death and grief produces profound disturbance.

Exactly what the anger is directed toward is interpretive: death itself, unbelief, the devastation before him, or some combination.

But the emotional force is real.

Then:

> “Where have you laid him?”

---

### 11:35 — “Jesus wept”

Two words in many English translations.

And this is where John destroys a shallow interpretation of divine providence.

Jesus knows **exactly** what he is about to do.

He knows Lazarus will shortly walk out of that tomb.

And yet:

> **Jesus wept.**

Therefore knowledge of resurrection does not make grief unreal.

Knowing the end does not negate the reality of what is presently being suffered.

This matters enormously.

Jesus does not stand outside human grief saying:

> *You shouldn't be crying because I know how this ends.*

He enters it.

The one who knows death will be defeated **weeps before the tomb anyway**.

So hope and grief are not opposites.

Christ holds both simultaneously.

---

### 11:36–37 — “Could he not have kept this man from dying?”

The crowd asks exactly the question John wants us asking:

> “Could not he who opened the eyes of the blind man also have kept this man from dying?”

Notice the explicit connection to **John 9**.

Yes.

That's the problem.

Jesus apparently **could have prevented this**.

And John already told us Jesus intentionally delayed.

So the chapter will not allow the easy answer:

**Jesus arrived too late.**

He didn't.

He **waited**.

The question therefore isn't:

> Why couldn't Jesus prevent this?

It is:

> **Why did love permit something that love had power to prevent?**

And John's answer isn't an abstract theory.

John points us toward what Jesus does next.

---

### 11:38–40 — The stone

Jesus comes to the tomb:

> “Take away the stone.”

Martha objects:

> “Lord, by this time there will be an odor, for he has been dead four days.”

This is brutally physical.

John does not allow “death” to become spiritual abstraction.

The body is decomposing.

Jesus replies:

> “Did I not tell you that if you believed you would see the glory of God?”

There is the purpose from verse 4 again:

**“for the glory of God.”**

What Jesus announced before Lazarus died is now about to become visible.

---

### 11:41–42 — Jesus addresses the Father

Jesus looks upward:

> “Father, I thank you that you have heard me.”

And then:

> “I knew that you always hear me…”

Again the perfect relation the reading has been tracing:

**Father ↔ Son**

But Jesus says he speaks aloud:

> “on account of the people standing around, that they may believe that you sent me.”

Again:

**sent.**

Even at the greatest sign so far, Jesus does not present himself as autonomous power.

The sign reveals his relation to the Father.

---

### 11:43 — “Lazarus, come out”

> “He cried out with a loud voice, ‘Lazarus, come out.’”

Remember John 10:

> “The sheep hear his voice, and he calls his own sheep by name…”

Now watch what happens.

**The Shepherd calls his sheep by name.**

> **“Lazarus.”**

And the dead man hears.

That connection is extraordinary.

John 5 had already prepared us:

> “an hour is coming when all who are in the tombs will hear his voice and come out.”

John 11 gives us a sign of exactly that.

**voice of Son → enters tomb → dead hears → comes forth**

Death does not place Lazarus beyond the Shepherd's voice.

---

### 11:44 — “The man who had died came out”

John states it almost bluntly:

> “The man who had died came out…”

His hands and feet are still bound.

Jesus says:

> “Unbind him, and let him go.”

Jesus speaks life.

Then the community participates in removing what belongs to the tomb.

There is something almost sacramental in the image:

**Christ calls forth.  
Others unbind.  
The formerly dead walks free.**

---

### 11:45–53 — Life given produces a death sentence

And now comes the terrible reversal.

Many believe.

Others report what happened to the Pharisees.

The council gathers:

> “What are we to do? For this man performs many signs.”

Notice: they don't simply deny the sign.

Their concern becomes political:

> “If we let him go on like this, everyone will believe in him, and the Romans will come…”

Then Caiaphas says:

> “it is better for you that one man should die for the people, not that the whole nation should perish.”

John comments:

> “He did not say this of his own accord…”

Caiaphas means:

**kill Jesus to preserve the nation.**

But his words unknowingly prophesy:

**Jesus will die for the people.**

The same sentence carries two intentions.

Human intention:

**sacrifice Jesus to maintain control.**

Divine purpose:

**Christ gives himself to gather God's children.**

And notice the astonishing exchange created by the chapter:

**Lazarus comes out of the tomb → Jesus is sentenced toward the tomb.**

The giving of Lazarus' life accelerates Jesus' death.

---

### This is the deepest movement of John 11

Jesus does not resurrect Lazarus **from a safe distance**.

To call Lazarus out of death is to move himself closer toward death.

The Good Shepherd said in John 10:

> “I lay down my life for the sheep.”

John 11 immediately shows what that means.

The Shepherd approaches the tomb.

Calls his sheep by name.

The sheep comes out.

And from that moment:

> “So from that day on they made plans to put him to death.”

There is almost an exchange:

**Lazarus → death → life**

**Jesus → life → toward death**

Christ enters the territory of death and brings his sheep outward while moving himself inward toward the place from which the sheep came.

And that makes:

> **“I am the resurrection and the life”**

far more than a claim of miraculous power.

---

### And now return to the delay

This is where the question from John 9 becomes even sharper.

Why does Jesus allow Lazarus to die when he could prevent it?

Because **preventing death and overcoming death are not the same revelation**.

Had Jesus prevented Lazarus from dying, they would have seen:

> **Life protected from death.**

By allowing Lazarus to die and then calling him forth, they see:

> **Life victorious within death.**

That's stronger.

And it anticipates Jesus' own Passion.

The Father will not prevent Jesus from dying either.

Christian revelation does not finally proclaim:

> **God prevents death.**

It proclaims:

> **God raises the dead.**

That distinction is enormous.

John 11 therefore begins training us for the Cross.

When Jesus dies, his disciples will face precisely Martha's problem:

> **If God loved him, why did God permit this?**

John 11 has already established the answer's structure:

**Love can permit passage into death without surrendering the beloved to death.**

Because with Christ:

**death can be real without being final.**

That is why Jesus can both knowingly permit Lazarus' death **and weep at Lazarus' tomb**.

He neither denies death nor grants it ultimate authority.

He enters it, grieves it, confronts it—and calls the beloved **through it** into life.

And John is preparing us to watch the Father do with the Son what the Son has just done with Lazarus.

## Twelve hours in the day (11:9–10)

John 11:9–10 is Jesus explaining **why he can deliberately walk back toward Judea even though people there intend to kill him**.

The disciples say, essentially:

> *They just tried to stone you. Why would you go back?*

Jesus answers:

> “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble, because he sees the light of this world. But if anyone walks in the night, he stumbles, because the light is not in him.”

There are several layers compressed together.

### 1. The literal image: you can walk when there is light

At the simplest level:

**day → light → sight → right movement**

**night → darkness → no sight → stumbling**

*Proskoptō*, “stumble,” means to strike against something—to encounter an obstacle because you cannot adequately see your path.

So Jesus' image concerns **movement governed by sight**.

You can walk safely not because there are no obstacles, but because **light allows you to perceive them accurately**.

That distinction immediately matters in context.

Judea really is dangerous.

Jesus isn't saying:

> *Nothing bad can happen to me.*

He is saying something closer to:

> **Danger does not determine whether the path is right. Light does.**

That is a very different principle.

---

### 2. “Are there not twelve hours in the day?”

In the ancient Jewish/Roman reckoning relevant here, daylight was conventionally divided into twelve hours whose seasonal length varied.

So Jesus invokes a **bounded period of daylight**.

Day does not last indefinitely.

There is:

**a time for walking → and eventually night comes.**

This echoes John 9:4:

> “We must work the works of him who sent me while it is day; night is coming…”

And that means Jesus understands his earthly ministry as possessing an **appointed interval**.

The disciples see:

> **Judea → danger → don't go.**

Jesus sees:

> **The Father has given me work → it is still day → therefore I walk.**

The determining question isn't:

**“Is this safe?”**

It is:

**“Is it still day?”**

That is profound.

---

### 3. Jesus has already told us what the Light is

This cannot be separated from John 8–9.

Jesus said:

> “I am the light of the world.” (8:12)

Then:

> “Whoever follows me will not walk in darkness…”

And in John 9:

> “As long as I am in the world, I am the light of the world.”

Now John 11:

> “If anyone **walks** in the day, he does not stumble…”

John is maintaining the same vocabulary.

So “walking in the day” is not merely being active while the sun is up.

It means **movement made possible by illumination**.

And for Jesus himself, that illumination is his undivided relation to the Father.

Remember everything Jesus has said:

> “The Son can do nothing of his own accord, but only what he sees the Father doing.” (5:19)

That gives John 11 extraordinary depth.

Jesus **sees** what the Father is doing.

Therefore Jesus can **walk** without stumbling.

We get:

**Father → Son sees → Son walks → Father's work is accomplished.**

---

### 4. This changes the meaning of “stumbling”

Not stumbling does **not** mean avoiding suffering.

This is crucial.

Jesus is walking directly toward circumstances that will eventually kill him.

So if we interpret:

> “he does not stumble”

as:

> “nothing painful or harmful happens to him,”

the Gospel itself immediately disproves that interpretation.

The Cross is approaching.

Therefore:

**suffering ≠ stumbling**

and even:

**death ≠ necessarily stumbling.**

Stumbling means **losing the path because one cannot see**.

Jesus can be rejected, beaten, crucified, and killed without having stumbled if those events occur **while faithfully walking the path illuminated by the Father**.

That is an enormous redefinition of success.

---

### 5. And this explains why the disciples' reasoning is insufficient

Their reasoning isn't irrational.

> “Rabbi, the Jews were just now seeking to stone you, and are you going there again?”

They correctly perceive danger.

The error would be to make **danger itself determinative**.

They see the obstacle.

Jesus sees the **path through the obstacle**.

This returns directly to John 9.

Sight is not simply noticing what is present.

It is **perceiving what is present rightly enough to move rightly through it**.

The disciples see:

**stones.**

Jesus sees:

**Lazarus.**

And beyond Lazarus:

**the Father's work.**

Both perceptions are true.

But one is more complete.

---

### 6. There is an even deeper connection to Psalm 119

You will recognize this immediately:

> “Your word is a lamp to my feet  
> and a light to my path.”  
> — Psalm 119:105

The ontology is almost identical.

Light does not necessarily show you an alternate path where there is no danger.

**Light reveals where the next step actually is.**

That distinction matters.

A lamp to the feet does not eliminate:

rocks,  
cliffs,  
enemies,  
darkness beyond the illuminated area.

It enables **right placement of the foot**.

So:

**light → sight → right step → path**

And John adds:

**darkness → inability to see → misplaced step → stumbling.**

---

### 7. “Because the light is not in him”

Verse 10 gets stranger:

> “But if anyone walks in the night, he stumbles, because the light is **not in him**.”

We might expect:

> because there is no light **around him**.

Jesus says:

> **the light is not in him.**

That moves the image inward.

And now it connects with everything the reading has been tracing:

John 6:

> “abides in me, and I in him.”

John 7:

> “Out of his *koilia* will flow rivers of living water.”

John 8:

> “Whoever follows me… will have the light of life.”

So the ultimate condition for right walking isn't merely access to external information.

**The Light must become inwardly operative.**

That is the difference between merely having rules and actually seeing.

---

### And now look at what Jesus actually does

The sequence is beautiful.

Jesus learns Lazarus is sick.

He **does not move yet**.

He waits two days.

Then suddenly:

> “Let us go to Judea again.”

Why wait?

Why move now?

The text has already been emphasizing that Jesus does not act merely according to external pressure.

This goes all the way back to John 7:

His brothers:

> *Go show yourself.*

Jesus:

> **My time has not yet come.**

Then later he goes.

John 11 has the same structure.

Message:

> **Lazarus is sick.**

Jesus:

> **waits.**

Then:

> **Now let us go.**

So Jesus is neither governed by:

**urgency**

nor by:

**danger.**

Urgency says:

> **Go now!**

Danger says:

> **Don't go!**

Jesus obeys neither.

He waits when urgency says move.

Then he moves when danger says wait.

Why?

Because **neither circumstance is Lord.**

He walks by the Light.

That may be the deepest practical meaning of this passage.

---

### And it sharpens something we've discussed before about planning and obedience

There are two opposite ways of being controlled by circumstance:

**compulsion:**  
“This is urgent, therefore I must act.”

**fear:**  
“This is dangerous, therefore I must not act.”

Jesus exhibits neither.

His action comes from **sight**.

Therefore he can remain still when everyone expects movement and move when everyone expects stillness.

This is not passivity.

It is extraordinarily precise action.

And that makes “twelve hours in the day” important:

There **is** an appointed time for action.

Jesus isn't saying:

> *God will handle everything, so timing doesn't matter.*

Almost the opposite.

**Timing matters precisely because obedience is concrete.**

There is a time to remain.

There is a time to walk.

And right action depends upon perceiving which one it is.

---

### Then the Cross becomes the ultimate expression of this

Jesus knows night is coming.

He knows Judas will betray him.

He knows Jerusalem will kill him.

And he keeps walking.

Not because he cannot see the danger.

**Because he can see beyond the danger to the path.**

That distinction is essential.

Fear can say:

> “I see the danger, therefore don't walk.”

Recklessness can say:

> “There is no danger, therefore walk.”

Jesus does neither.

He sees the danger **accurately** and walks anyway because he also sees the Father.

So we could compress John 11:9 into:

> **To walk in the day is to move according to what the Light reveals, rather than allowing either urgency or danger to determine the next step.**

And therefore:

> **not stumbling does not mean avoiding the Cross. It means reaching the Cross by the right path.**

That is a much more severe meaning of “a lamp to my feet and a light to my path.”

The Light does not promise that the illuminated path avoids death.

In Christ, the Light can illuminate a path **straight through death**, because—as the very next revelation of John 11 declares—

> **“I am the resurrection and the life.”**

## Internal night

**Internal night is not necessarily evil, error, or abandonment.** If we follow the biblical image carefully, night can be an appointed condition in which **full sight is withheld**. The question then becomes: *How does one walk faithfully when one cannot presently see?*

And Jesus' answer seems to be: **you do not manufacture daylight. You remain with what has already been given.**

### First: John 11:10 is genuinely inward

Jesus says:

> “If anyone walks in the night, he stumbles, because the light is **not in him**.”

Note that Jesus moves beyond external daylight. The external day/night image becomes a description of an internal condition.

But we should distinguish two different biblical uses of **night**:

**Blindness** — light not presently apprehended; its cause is a separate question.

**Appointed obscurity** — a period in which God has not given sight concerning what comes next.

Those cannot be collapsed.

Genesis 1 actually protects this distinction:

> “God called the light Day, and the darkness he called Night.”

And:

> “God saw everything that he had made, and behold, it was very good.”

Night belongs to the ordered creation.

So **darkness as such cannot simply mean evil**.

Its created function is different from light.

Day permits outward seeing and activity. Night limits sight, interrupts activity, and calls the creature into rest.

That gives us a very different theology of internal night.

### What does Jesus do when he cannot see?

Gethsemane is perhaps the strongest place to look.

Jesus knows the Father, knows his vocation, and knows the trajectory toward the Cross. Yet he enters something experientially much darker:

> “My soul is very sorrowful, even to death.”

And:

> “My Father, if it be possible, let this cup pass from me…”

That is important.

Jesus does **not pretend to possess a clarity he does not possess**.

He does not say:

> *I can see exactly why every moment of this must happen and therefore I experience no uncertainty.*

He brings what he actually perceives before the Father:

**I do not want this cup.**

But then:

> “Nevertheless, not as I will, but as you will.”

This suggests a distinction between **seeing the path** and **trusting the One who sees the path**.

When sight is available:

**see → walk.**

When sight is insufficient:

**trust → remain obedient to what is already known.**

That is different from guessing.

---

### And then the Cross goes even further

> “My God, my God, why have you forsaken me?”

Jesus takes Psalm 22 upon his lips.

Whatever theological account we give of the Father-Son relation at the Cross, the utterance itself expresses an actual experience of abandonment.

And notice what Jesus does **inside that darkness**.

He addresses:

> **“My God.”**

Twice.

He does not understand the darkness by declaring the relationship nonexistent.

He speaks **from within the relationship he can no longer presently experience as consolation**.

And later:

> “Father, into your hands I commit my spirit.”

That may give us the exact posture of internal night:

> **When I cannot see the path, I entrust myself to the One whose hands hold the path.**

---

### This changes what “light to my path” means

Psalm 119:105 does not say:

> Your word is a floodlight showing me the entire road.

It says:

> “Your word is a **lamp to my feet** and a light to my path.”

A lamp gives **local illumination**.

Enough for the foot.

Enough for the next placement.

Not necessarily enough to see where the entire road terminates.

So there are actually several conditions:

**Fuller light:**  
I can see what obedience requires → walk.

**Lamp-light:**  
I cannot see the whole path, but the next faithful step is visible → take that step.

**Night:**  
I cannot presently see even the next movement → do not invent one.

That last condition is important.

Sometimes **remaining is the obedient action**.

---

### Jesus does this repeatedly

John 11 itself gives us the pattern.

Lazarus is dying.

Everyone's circumstances scream:

> **MOVE.**

Jesus remains two days.

Then danger screams:

> **STAY.**

Jesus moves toward Judea.

That tells us something extraordinarily practical:

**stillness is not necessarily darkness, and movement is not necessarily light.**

The criterion is not activity.

It is obedience.

Sometimes light says:

> **Go.**

Sometimes:

> **Stay.**

And if no instruction has actually been given, staying with the last thing you genuinely know may be more faithful than generating an answer from anxiety.

---

### This is where night has a positive function

God does not destroy darkness in Genesis 1.

He **divides** light from darkness:

> “God separated the light from the darkness.”

Then names both:

**Day.  
Night.**

The distinction creates rhythm:

> “there was evening and there was morning…”

Night participates in the movement toward morning.

So if we cautiously carry that created pattern inward, **night can function as the boundary of present perception**.

Day says:

> **Here is what can presently be seen.**

Night says:

> **Beyond here you cannot presently see.**

And respecting that boundary can itself be truthful.

The problem begins when we turn night into counterfeit daylight—when we **claim to see what we do not see**.

And suddenly we're back in John 9.

The blind man says:

> **“I do not know.”**

And continues toward sight.

The Pharisees say:

> **“We know.”**

And remain blind.

So perhaps one of the holiest sentences available during internal night is simply:

> **I do not know.**

Not despair.

Not unbelief.

**Truthful blindness.**

---

### But then what guides us?

On “inner light”:

If by **inner light** we mean *whatever inward feeling seems luminous*, that becomes dangerous very quickly. Jesus does not teach that every internal impulse is divine guidance.

The Light is **Christ**, not simply interiority.

> “I am the light of the world.”

And:

> “Whoever follows **me** will not walk in darkness.”

So the movement is not:

**external authority → replaced by internal intuition.**

It is:

**Christ → received inwardly → illuminates perception.**

That inward illumination remains accountable to what Christ has already revealed: his words, his character, love of God and neighbor, truth, mercy, justice, fidelity.

An internal prompting contradicting those things isn't made light merely because it feels inward.

That distinction matters enormously.

---

### So what do we do in genuine internal night?

Jesus' life gives a remarkably concrete sequence:

**Do not pretend to see.**  
“I do not know.”

**Do not manufacture direction merely to escape uncertainty.**

**Remain faithful to what has already been illuminated.**

**Bring the actual condition to the Father.**  
“If it is possible, let this cup pass…”

**Wait when no movement has been given.**

**Walk when sufficient light for the next step appears.**

**Entrust what remains unseen to God.**  
“Into your hands…”

And this means faith becomes most itself precisely where sight reaches its boundary.

Not because faith means believing arbitrary things without evidence.

Rather:

> **Faith carries relationship beyond the present limit of sight.**

Day permits:

**I see, therefore I walk.**

Night requires something deeper:

**I cannot see, but I still know whose I am.**

And that may explain why God does not abolish night.

If there were only perpetual daylight, we could live entirely by sight.

Night creates the condition in which **trust, rest, surrender, patience, and receptivity** become possible.

Morning then does something we could never accomplish by straining harder into darkness:

> **light arrives.**

We don't make the sun rise.

And that is the boundary worth preserving in the inner life as well:

> **When God gives light, walk in it. When God permits night, do not manufacture light. Remain faithful within the last light you were actually given, and wait for morning.**

That is very different from being lost.

It is **knowing that you presently cannot see—and not calling it sight.**

## Blindness, not refusal

“Refusing” is too strong. It moves from describing a condition—blindness—to assigning culpable intention to the person who is blind.

The more complete picture is:

> **Darkness is lack of light; blindness is lack of sight. Neither, by itself, tells us why the light or sight is lacking.**

Only after that can we ask about responsibility.

### John itself requires this distinction

John 9 is decisive:

> “If you were blind, you would have no guilt…”

Jesus explicitly separates **blindness** from **guilt**.

That means we cannot reason:

**does not see → therefore refuses to see.**

The man born blind is the obvious counterexample. His blindness is not rebellion. He simply **cannot see until sight is given to him**.

And the theological implication is exactly what identified above:

**sight is grace before it is achievement.**

The man doesn't generate sight by adopting the correct attitude. Jesus finds him and opens his eyes.

So the fundamental movement is:

**darkness → light given → sight becomes possible**

rather than:

**darkness → person decides to see → light.**

### Then what about the Pharisees?

Even here we should be careful.

Jesus says:

> “but now that you say, ‘We see,’ your guilt remains.”

Their problem is not simply that they are blind. Nor should we jump immediately to:

> **They know the truth and deliberately refuse it.**

That claims access to their interior state beyond what the statement establishes.

What Jesus actually identifies is a **misjudgment of their own condition**:

They are blind **and believe themselves to see**.

That is more tragic—and more comprehensive—than simple refusal.

Because if I genuinely believe darkness is light, then from **inside my perspective**, rejecting actual light may appear to me as defending the truth.

That is precisely why blindness is blindness.

A blind person doesn't necessarily know what he isn't seeing.

---

### This changes John 3 as well

John says:

> “the light has come into the world, and people loved the darkness rather than the light because their works were evil.”

There **is** moral agency here. John does speak about loving darkness and avoiding exposure.

But even that should not be flattened into:

> “They fully perceive the Light as Light and consciously choose falsehood instead.”

John's larger Gospel shows people profoundly misunderstanding what they encounter.

So there can be several layers simultaneously:

**ignorance** — I do not see.

**blindness** — I presently lack the capacity to perceive something.

**self-deception** — I mistake my limited perception for sufficient sight.

**resistance** — what begins to challenge my present structure is resisted.

**deliberate rejection** — I perceive something sufficiently to oppose it knowingly.

Those are not interchangeable.

And only God would perfectly know where one ends and another begins within a particular person.

---

### And your point about grace goes deeper

Jesus says in John 6:

> “No one can come to me unless the Father who sent me draws him.”

And later:

> “No one can come to me unless it is granted him by the Father.”

Taken seriously, **recognition of Christ itself depends upon something being given**.

That makes it dangerous for the seeing person to stand over the blind person and say:

> *I saw because I was receptive; you don't see because you're refusing.*

That can quietly turn **grace into merit**.

A more truthful confession would be:

> **I see what has been given to me to see.**

Paul later expresses essentially this principle:

> “What do you have that you did not receive?” (1 Corinthians 4:7)

---

### Then we can redefine the two kinds of night more accurately

I wouldn't now call the first **“moral darkness”** without qualification. Better:

**Blindness:** light is not presently apprehended. Its cause may include ignorance, immaturity, limitation, deception, resistance, or some combination we cannot fully judge.

**Appointed night:** God has not presently illuminated what comes next; the lack of sight itself may belong to the present order of guidance.

And importantly, those may **overlap**.

We may not always know whether:

> *I cannot see because something in me obstructs sight*

or

> *I cannot see because sight has not yet been given.*

That uncertainty itself calls for humility rather than self-condemnation or condemnation of another.

This returns us beautifully to the blind man:

> **“I do not know.”**

That statement doesn't diagnose *why* he doesn't know.

It simply bears truthful witness to the boundary of his present sight.

And perhaps that is the cleanest posture toward both ourselves and others:

> **Do not call darkness light—but neither presume to know why another person cannot yet see.**

Jesus can judge blindness because **he is the Light and knows the person completely**.

We cannot.

Our task is much closer to the healed man's:

> **“One thing I do know…”**

Bear witness to the light actually received, without converting that grace into a judgment against those to whom the same sight has not yet been given.

## Day and night

The first thing is to **rescue night from being treated as defective day**.

Biblically, the primary ontology is not:

**day = good**  
**night = evil**

Genesis gives something more fundamental:

> “God called the light Day, and the darkness he called Night.” (Genesis 1:5)

God **divides** them, names them, and places both within the created order. So their first meaning is functional:

> **Day is the condition appointed for manifestation. Night is the condition appointed for concealment.**

From there, their spiritual meanings can develop without making concealment itself morally negative.

### Day: what has been brought into visibility

Light makes distinction perceptible. In day, what is present can be seen sufficiently to orient movement.

That makes Jesus' language in John 11 exact:

> “If anyone walks in the day, he does not stumble, because he sees the light of this world.”

Spiritually, **day is whatever has presently been illuminated sufficiently for faithful action**.

You see the step; therefore you can place the foot.

This connects directly with:

> “Your word is a lamp to my feet and a light to my path.”  
> — Psalm 119:105

Day therefore has an outward-moving quality:

**light → perception → distinction → orientation → action**

This is why Scripture frequently associates day with **work**.

Jesus says in John 9:

> “We must work the works of him who sent me while it is day.”

When something has actually been given to sight, there is a corresponding capacity to act upon it.

---

### Night: what has not been brought into visibility

Night is different.

Darkness does not necessarily mean that **nothing is there**.

It means what is there **cannot presently be seen**.

That distinction is enormous.

A path continues through the night even when I cannot see it.

The mountain remains where it was.

My destination has not disappeared.

What changes is **my access to it through sight**.

So spiritually:

> **Night is the condition in which reality exceeds present perception.**

It is the truthful boundary of what has presently been illuminated.

And therefore night changes the appropriate action.

If day permits **walking by sight**, night may require **waiting, resting, listening, remembering, or trusting**.

Not because inactivity is intrinsically holy, but because movement beyond available sight can become movement without orientation.

---

### Genesis makes night surprisingly fertile

There is something important here.

Night is not merely an interruption between productive periods.

Throughout Scripture, extraordinarily generative things happen in darkness.

Creation itself begins:

> “darkness was over the face of the deep.”

God's first recorded speech introduces light **into** darkness.

Later, Abram receives the covenantal vision as the sun goes down.

Jacob wrestles through the night and receives a new name near daybreak.

Israel passes through the sea during the night.

Samuel hears God's voice while lying down at night.

Jesus repeatedly withdraws through the night to pray.

The resurrection itself occurs beyond human observation: the tomb enters night containing a dead body, and the women arrive around dawn to discover that something has already happened.

So spiritually, night can contain **activity that is real without yet being visible to the observer**.

That's important.

> **I cannot see God working**  
> does not entail  
> **God is not working.**

The first is a statement about my perception.

The second is a claim about God.

They are categorically different.

---

### Evening and morning

Genesis doesn't merely alternate two static states.

It gives a rhythm:

> “And there was evening and there was morning…”

That means day and night belong to a **cycle of revelation and concealment**.

Something appears.

Something disappears from sight.

Something happens while sight is limited.

Light returns.

And what appears in the next light may not be identical to what entered the darkness.

That gives night a potentially **gestational** quality.

Not because darkness mechanically causes transformation, but because concealment permits processes whose operation does not depend upon our observation.

A seed underground is the obvious biblical image.

Jesus says:

> “The seed sprouts and grows; **he knows not how**.” (Mark 4:27)

That is almost a perfect description of spiritual night:

**something is happening;  
I cannot see the process;  
I do not know how.**

The lack of knowledge does not invalidate the process.

---

### This makes sleep spiritually significant

Psalm 127 says:

> “It is in vain that you rise up early and go late to rest… for he gives to his beloved sleep.”

Sleep is an extraordinary creaturely confession.

Every night you cease consciously managing the world.

You relinquish:

**seeing, choosing, working, monitoring, correcting.**

And yet life continues.

Your heart beats.

Your lungs breathe.

Your body repairs.

Morning arrives without your producing it.

So night teaches something day cannot teach in the same manner:

> **Reality does not depend upon my conscious participation in order to remain held by God.**

Day reveals our genuine agency.

Night reveals the **boundary of our agency**.

Both are necessary truths.

---

### This also clarifies faith

We should be careful not to define faith as blindness.

Faith is not:

> *I cannot see, therefore I will pretend that I can.*

That would violate the very truthfulness the reading has been discussing.

Faith in night is closer to:

> **What I cannot presently see does not negate what has already been revealed.**

This is why memory becomes important at night.

Israel repeatedly receives the command:

> **Remember.**

When present perception cannot disclose the whole path, what has already been revealed remains available as witness.

So there is a difference between:

**present light** — what I can see now,

and

**remembered light** — what has already been shown and remains true even though I cannot presently see beyond it.

That gives us a much cleaner account of what to do in night.

---

### And then there is dawn

Dawn is neither something we manufacture nor simply passive waiting.

Scripture repeatedly uses the watchman:

> “My soul waits for the Lord  
> more than watchmen for the morning.”  
> — Psalm 130:6

The watchman cannot cause sunrise.

But neither is he unconscious.

He **watches**.

That is a beautiful middle position:

**not forcing revelation,  
not pretending to possess revelation,  
not abandoning expectation of revelation.**

Simply:

**watching for light.**

And when light comes, the responsibility changes.

What could not previously be seen can now be seen.

Then walking becomes possible.

---

### This gives us a more exact reading of Jesus

Jesus seems extraordinarily free in relation to these two conditions.

When there is light to act:

> **he acts.**

When the hour has not come:

> **he waits.**

When he knows what the Father is doing:

> **he follows what he sees.**

When he enters Gethsemane:

> **he prays.**

And even within the extremity of the Cross:

> “Into your hands I commit my spirit.”

There is no need to turn every moment into daylight.

That may be crucial.

Jesus does not seem compelled to possess conscious visibility of everything at every moment.

There is **seeing**, and there is **entrusting**.

Both belong to relationship with the Father.

---

### The rhythm

**Day — manifestation.**  
Something is given to sight. The corresponding posture is **faithful action**.

**Evening — withdrawal.**  
What was visible begins passing beyond present sight. The corresponding posture is **release**.

**Night — concealment.**  
Reality continues beyond the boundary of perception. The corresponding posture is **rest, trust, remembrance, and watchfulness**.

**Dawn — revelation.**  
What could not previously be seen begins becoming perceptible. The corresponding posture is **receptivity**.

**Day again — embodiment.**  
What has been revealed can now be walked.

So the spiritual life would not ideally be an attempt to achieve **perpetual internal daylight**.

That would actually resist the created rhythm.

It is learning to be truthful within whichever condition has been given:

> **When there is light, see.  
> When the path is visible, walk.  
> When night comes, do not call it day.  
> When you cannot see, do not invent sight.  
> Remember what has already been revealed, entrust what remains concealed, and watch for morning.**

And perhaps the deepest point is this:

**God is not identical with our experience of daylight.**

The light may disappear **from our sight** without God disappearing.

The God who called the light Day is also **Lord of the night**.

That makes night not necessarily the absence of God, but the condition in which **God's presence can no longer be equated with our ability to perceive what he is doing.** 

## Witness

Jesus is the resurrection and the life. Martha's belief was correct and he did not correct it; he stood in front of it.

The ground: love permits passage into death without surrendering the beloved to death. Death can be real without being final. That is why Jesus can knowingly permit Lazarus' death and weep at his tomb — he neither denies death nor grants it authority.

The direction: John is preparing us to watch the Father do with the Son what the Son has just done with Lazarus. And the disciples will face Martha's problem — *if God loved him, why did he permit this* — with the answer's structure already given.
