art made heavy — slow, unresponsive. The same root gives glory: weight can honor or deaden."],"qashah":["קשה","To be hard, stiff, severe.","The stiffened heart: hardness as inflexibility toward what comes."]};
  const strip = w => w.toLowerCase().replace(/[\u0101\u0113\u012b\u014d\u016b]/g, c => ({'\u0101':'a','\u0113':'e','\u012b':'i','\u014d':'o','\u016b':'u'})[c]).replace(/[\u2019']/g, ' ').replace(/\s+/g,' ').trim();
  const ETYRE = /(^|[^A-Za-z\u0100-\u017F])(eg\u014d eimi|zo\u0113|z\u014d\u0113|psych\u0113|men\u014d|mon\u0113|mise\u014d|phile\u014d|agapa\u014d|sarx|kosmos|al\u0113theia|hodos|hod\u0113ge\u014d|parakl\u0113tos|t\u0113re\u014d|hagiaz\u014d|katharos|kathair\u014d|air\u014d|ap\u014dleia|ap\u014dleias|ph\u014ds|s\u0113meion|pneuma|an\u014dthen|krisis|krima|tr\u014dg\u014d|koilia|hallomenou|schisma|kairos|h\u014dra|martyre\u014d|ex\u0113g\u0113sato|tith\u0113mi|esk\u0113n\u014dsen|katalamban\u014d|paradid\u014dmi|arti|perissos|s\u014dz\u014d|pisteu\u014d|tarass\u014d|embrimaomai|lou\u014d|nipt\u014d|doxa|hen|chazaq|kaved|qashah)(?![A-Za-z\u0100-\u017F])/g;
  const etyfy = s => s.replace(ETYRE, (m, pre, w) => {
    let k = strip(w);
    if (k === 'apoleias') k = 'apoleia';
    return GLOSS[k] ? `${pre}<button class="ety" data-w="${k}">${w}</button>` : m;
  });
  const inline = s => etyfy(linkify(esc(s)
    .replace(/\{(doc|hyp|inf)\}/g, (_, t) => `<span class="tag ${t}">${t}</span>`)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^\s*](?:[^*]*?[^\s*])?)\*(?!\*)/g, '$1<em>$2</em>')));
  const md = src => {
    const out = []; let para = [], list = null, quote = null;
    const flushP = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
    const flushL = () => { if (list) { out.push('<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'); list = null; } };
    const flushQ = () => { if (quote) { out.push('<blockquote>' + md(quote.join('\n')) + '</blockquote>'); quote = null; } };
    const flush = () => { flushP(); flushL(); flushQ(); };
    for (const raw of src.split('\n')) {
      const line = raw.replace(/\s+$/, '');
      let m;
      if (!line.trim()) { flush(); continue; }
      if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flush(); const h = m[1].length === 1 ? 2 : m[1].length; out.push(`<h${h}>${inline(m[2])}</h${h}>`); continue; }
      if (/^---+$/.test(line)) { flush(); out.push('<hr>'); continue; }
      if ((m = line.match(/^>\s?(.*)$/))) { flushP(); flushL(); (quote = quote || []).push(m[1]); continue; }
      if ((m = line.match(/^[-*]\s+(.*)$/))) { flushP(); flushQ(); (list = list || []).push(m[1]); continue; }
      if (list) { list[list.length - 1] += ' ' + line.trim(); continue; }
      if (quote) { quote.push(line); continue; }
      para.push(line.trim());
    }
    flush();
    return out.join('\n');
  };

  // ---- ui ---------------------------------------------------------------
  const nav = document.getElementById('nav');
  const main = document.getElementById('main');
  const status = document.getElementById('status');
  let current = 6, editing = false;

  const label = ch => ch === 0 ? 'Method' : (TITLES[ch] || '');
  const renderNav = () => {
    nav.innerHTML = '';
    const items = [0, 'sep', ...Array.from({ length: 21 }, (_, i) => i + 1), 'sep', 22];
    for (const ch of items) {
      if (ch === 'sep') { const d = document.createElement('div'); d.className = 'sep'; nav.appendChild(d); continue; }
      const a = document.createElement('a');
      a.href = '#' + ch;
      a.className = (has(ch) ? '' : 'empty ') + (ch === current ? 'on' : '');
      a.innerHTML = `<span class="n">${ch === 0 ? '§' : ch === 22 ? '∴' : ch}</span><span class="txt">${label(ch) || (ch === 0 ? '' : '—')}</span>` + (store[ch] !== undefined ? '<span class="dot" title="edited here, not yet exported">●</span>' : '');
      nav.appendChild(a);
    }
    const n = Object.keys(store).length;
    status.textContent = n ? `${n} chapter${n > 1 ? 's' : ''} edited locally` : 'No local edits';
  };

  const renderMain = () => {
    const ch = current, t = text(ch);
    main.innerHTML = '';
    const head = document.createElement('div'); head.className = 'head';
    head.innerHTML = `<div><div class="eyebrow">${ch === 0 ? 'Front matter' : ch === 22 ? 'Across the reading' : 'Gospel of John'}</div><h1>${ch === 0 || ch === 22 ? '' : `<span class="num">${ch}</span>`}${label(ch) || 'Not yet unpacked'}</h1></div>
      <div class="tools"><button id="edit" class="${editing ? 'hot' : ''}">${editing ? 'Done' : 'Edit'}</button>${store[ch] !== undefined && !editing ? '<button id="revert">Revert to file</button>' : ''}</div>`;
    main.appendChild(head);
    if (editing) {
      const ta = document.createElement('textarea'); ta.className = 'editor'; ta.value = t; ta.spellcheck = false;
      ta.addEventListener('input', () => { store[ch] = ta.value; save(); renderNav(); });
      main.appendChild(ta);
      const n = document.createElement('div'); n.className = 'note';
      n.innerHTML = 'Markdown. <b>##</b> section · <b>**bold**</b> · <b>*italic*</b> · <b>&gt;</b> quote · <b>{doc}</b> <b>{hyp}</b> <b>{inf}</b> epistemic marks. Saved to this browser as you type; use <b>Export file</b> to bake edits into a copy of this file.';
      main.appendChild(n);
    } else {
      const card = document.createElement('article');
      card.className = 'card' + (has(ch) ? '' : ' empty');
      card.innerHTML = has(ch) ? md(t) : '<p>Not yet unpacked. Open Edit to begin, or return when the reading reaches this chapter.</p>';
      main.appendChild(card);
    }
    document.getElementById('edit').onclick = () => { editing = !editing; renderMain(); };
    const rv = document.getElementById('revert');
    if (rv) rv.onclick = () => { if (confirm('Discard local edits to this chapter and return to the file version?')) { delete store[ch]; save(); renderMain(); renderNav(); } };
    document.title = `John ${ch === 0 ? '— Method' : ch === 22 ? '— Themes' : ch} — Witness`;
    window.scrollTo({ top: 0 });
  };

  const route = () => {
    const h = parseInt(location.hash.slice(1), 10);
    current = Number.isInteger(h) && h >= 0 && h <= 22 ? h : 6;
    editing = false;
    closeVerse();
    renderNav(); renderMain();
  };
  window.addEventListener('hashchange', route);

  // ---- export: bake local edits into a downloadable copy of this file ----
  document.getElementById('import').onclick = () => {
    const wrap = document.createElement('div'); wrap.className = 'imp';
    wrap.innerHTML = `<div class="box"><h3>Import translation</h3>
      <p>Paste the text of the Gospel of John from a copy you own (e.g. your ESV file). It is parsed into verses and kept in this browser's local storage only \u2014 it is never written into this file, and Export produces a copy without it. Verse popups will show it first, with the Greek beneath.</p>
      <textarea placeholder="John 1\n1 In the beginning was the Word\u2026" spellcheck="false"></textarea>
      <div class="row"><button class="go">Import</button><button class="clear">Remove imported text</button><button class="cancel">Cancel</button><span class="stat">${LOCAL ? Object.keys(LOCAL).length + ' chapters currently imported' : 'nothing imported yet'}</span></div></div>`;
    document.body.appendChild(wrap);
    const stat = wrap.querySelector('.stat');
    wrap.querySelector('.cancel').onclick = () => wrap.remove();
    wrap.addEventListener('click', e => { if (e.target === wrap) wrap.remove(); });
    wrap.querySelector('.clear').onclick = () => {
      LOCAL = null; try { localStorage.removeItem(LKEY); } catch (e) {}
      stat.textContent = 'imported text removed';
    };
    wrap.querySelector('.go').onclick = () => {
      const parsed = parseTranslation(wrap.querySelector('textarea').value);
      const chs = Object.keys(parsed).length;
      const vs = Object.values(parsed).reduce((a, c) => a + c.filter(Boolean).length, 0);
      if (!chs || !vs) { stat.textContent = 'could not find John chapters in that text'; return; }
      LOCAL = parsed;
      try { localStorage.setItem(LKEY, JSON.stringify(parsed)); } catch (e) { stat.textContent = 'storage full \u2014 could not save'; return; }
      stat.textContent = `imported ${chs} chapters, ${vs} verses`;
    };
  };

  document.getElementById('export').onclick = () => {
    let out = SOURCE;
    for (const ch of Object.keys(store)) {
      const re = new RegExp(`(<script type="text/markdown" data-chapter="${ch}"[^>]*>)[\\s\\S]*?(<\\/script>)`);
      const body = '\n' + store[ch].replace(/<\/script/gi, '<\\/script') + '\n';
      out = re.test(out) ? out.replace(re, `$1${body}$2`) : out.replace('<!--CONTENT' + '-->', `<!--CONTENT-->\n<script type="text/markdown" data-chapter="${ch}">${body}<\/script>`);
    }
    const blob = new Blob([out], { type: 'text/html' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'john-witness.html';
    document.body.appendChild(a); a.click(); a.remove();
  };

  route();
})();
</script>
</body>
</html>
