<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f3f0,#0e0e0e);--card:light-dark(#fff,#181818);--ink:light-dark(#141414,#efeeeb);--mute:light-dark(#77736d,#9a968f);--rule:light-dark(#e2dfd9,#2c2c2c)}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;padding:16px}

label{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--mute)}
label input{width:auto}
#err{color:#d9480f;font-size:13px;min-height:18px;margin-top:8px}
</style></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
 const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.i,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.v)},k,u(D.c));
 const html=new TextDecoder().decode(pt);
 document.activeElement&&document.activeElement.blur();
 document.open();document.write(html);document.close();
}
let saved=null;try{saved=localStorage.getItem("tg-pass")}catch(e){}
if(saved)open(saved).catch(()=>{try{localStorage.removeItem("tg-pass")}catch(e){}});
document.getElementById("f").addEventListener("submit",async e=>{
 e.preventDefault();const pw=document.getElementById("pw").value;
 try{ if(document.getElementById("rm").checked){try{localStorage.setItem("tg-pass",pw)}catch(e){}} await open(pw);}
 catch(x){try{localStorage.removeItem("tg-pass")}catch(e){} document.getElementById("err").textContent="That passphrase didn't work.";}
});
}
