<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Paths of the Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Cormorant+Infant:wght@500;600&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF9F2;
    --card: #FFFEFA;
    --ink: #1F1F1D;
    --ink-soft: #46453F;
    --grey: #7D7669;
    --rule: #E9E4D7;
    --gold: #B4A67F;
    --gold-deep: #AC9D71;
    --gold-line: #BFB18F;
    --ref: #72ABBF;
    --miss: #B5685C;          /* new token: wrong answer; ESV/IHSVH have no error hue */
    --serif: "Crimson Pro", Georgia, serif;
    --display: "Cormorant Infant", "Crimson Pro", serif;
    --sans: "Assistant", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1F1F1D;
      --card: #262624;
      --ink: #E8E2D0;
      --ink-soft: #D6CFBC;
      --grey: #9A9283;
      --rule: #3A3935;
      --gold: #BC9836;
      --gold-deep: #A9892F;
      --gold-line: #8C7A45;
    }
  }
  :root[data-theme="dark"] {
      --paper: #1F1F1D;
      --card: #262624;
      --ink: #E8E2D0;
      --ink-soft: #D6CFBC;
      --grey: #9A9283;
      --rule: #3A3935;
      --gold: #BC9836;
      --gold-deep: #A9892F;
      --gold-line: #8C7A45;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); height: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }

  /* one screen: bar(modes) / prompt row / tree (fills) */
  .app { --row-h: calc(clamp(80px, 14dvh, 132px) + 10px); display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 640px; margin: 0 auto; overflow: hidden; }
  .bar { flex: none; display: flex; background: var(--gold); padding: calc(env(safe-area-inset-top) + 4px) 8px 0; }
  .bar button { flex: 1; color: rgba(255,255,255,.72); font-family: var(--sans); font-weight: 500; font-size: .98rem; padding: 7px 2px 8px; border-bottom: 2px solid transparent; letter-spacing: .01em; }
  .bar button[aria-pressed="true"] { color: #fff; font-weight: 600; border-bottom-color: #fff; }
  .bar .theme { flex: none; width: 40px; display: flex; align-items: center; justify-content: center; }
  .bar .theme svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 1.5; }
  .bar .theme svg path { fill: #fff; stroke: none; }

  /* prompt row — same box before and after the answer */
  .prompt { --card-h: clamp(80px, 14dvh, 132px); position: relative; z-index: 2; pointer-events: none; flex: none; display: flex; align-items: flex-start; gap: 14px; height: calc(var(--card-h) + 10px); padding: 6px 19px 0 8px; }
  .prompt img { flex: none; width: calc(var(--card-h) * .615); height: var(--card-h); object-fit: cover; border: 1px solid var(--rule); border-radius: 3px; background: var(--card); }
  .prompt .letter { flex: none; width: calc(var(--card-h) * .615); text-align: center; font-family: var(--sans); font-size: calc(var(--card-h) * .72); line-height: 1; color: var(--gold-deep); direction: rtl; }
  .prompt .txt { min-width: 0; flex: 1; align-self: center; }
  .prompt .kicker { display: flex; justify-content: space-between; font-family: var(--sans); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); margin: 0 0 2px; }
  .prompt .kicker .prog { letter-spacing: .04em; text-transform: none; }
  .prompt .kicker.yes { color: var(--gold-deep); }
  .prompt .kicker.no { color: var(--miss); }
  .prompt .kicker.yes .prog, .prompt .kicker.no .prog { color: var(--grey); }
  .prompt .title { font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, calc(var(--card-h) * .26), 2rem); letter-spacing: .02em; color: var(--ink-soft); margin: 0; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prompt .sub { font-style: italic; font-size: 1.05rem; line-height: 1.3; color: var(--grey); margin: 3px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prompt .sub .heb { font-family: var(--sans); font-style: normal; color: var(--gold-deep); direction: rtl; unicode-bidi: isolate; }

  /* path mode: the four choices sit in the empty bottom corners beside Malkuth */
  .choices { position: absolute; left: 0; right: 3px; bottom: 0; display: grid; grid-template-columns: 1fr 112px 1fr; grid-auto-rows: 40px; gap: 6px; }
  .choices button { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 6px; text-align: left; line-height: 1.05; min-width: 0; }
  .choices button:nth-child(1) { grid-area: 1 / 1; } .choices button:nth-child(2) { grid-area: 1 / 3; }
  .choices button:nth-child(3) { grid-area: 2 / 1; } .choices button:nth-child(4) { grid-area: 2 / 3; }
  .choices .k { font-family: var(--sans); font-size: .62rem; letter-spacing: .1em; color: var(--grey); margin-right: 5px; }
  .choices .t { font-family: var(--display); font-weight: 600; font-size: .95rem; color: var(--ink-soft); }

  /* tree fills whatever height is left; absolute inside a flexed box so Safari sizes it */
  .treebox { flex: 1 1 0; min-height: 0; position: relative; margin: calc(-1 * var(--row-h)) 8px calc(env(safe-area-inset-bottom) + 4px); }
  /* the top guide circle rises behind the card row and fades out under the bar */
  svg.tree { -webkit-mask: linear-gradient(to bottom, transparent 0, #000 var(--row-h)); mask: linear-gradient(to bottom, transparent 0, #000 var(--row-h)); }
  .next { position: absolute; right: 11px; bottom: 2px; background: var(--gold-deep); color: #fff; font-family: var(--sans); font-weight: 600; font-size: 1rem; padding: 10px 18px; border-radius: 4px; }
  svg.tree { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .guide { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 5; }
  .path { stroke: var(--gold-line); stroke-width: 1.6; stroke-linecap: round; pointer-events: none; transition: stroke .15s, stroke-width .15s; }
  .hit { stroke: transparent; stroke-width: 24; cursor: pointer; pointer-events: stroke; touch-action: manipulation; }
  .treebox:not(.locked) .hit:hover + .path, .treebox:not(.locked) .hit:focus-visible + .path { stroke: var(--gold); stroke-width: 3; }
  .hit:focus, .hit:focus-visible { outline: none; }
  .locked .hit { pointer-events: none; }
  .path.ask { stroke: var(--gold-deep); stroke-width: 5; }
  .path.answer { stroke: var(--ref); stroke-width: 5; }   /* you had it */
  .path.miss { stroke: var(--miss); stroke-width: 5; }    /* the path you were looking for */
  .path.ask { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { stroke-width: 3; } }
  .seph circle { fill: var(--card); stroke: var(--gold-line); stroke-width: 1.2; }
  .seph text { font-family: var(--sans); font-size: 12.5px; fill: var(--gold-deep); text-anchor: middle; dominant-baseline: central; direction: rtl; pointer-events: none; }
  .seph .n { font-family: var(--serif); font-weight: 300; font-size: 10px; fill: var(--grey); direction: ltr; }
  .seph.lit circle { stroke: var(--gold-deep); stroke-width: 2; }

  .btn { display: block; width: 100%; background: var(--gold-deep); color: #fff; font-family: var(--sans); font-weight: 600; font-size: 1.05rem; text-align: center; padding: 12px; border-radius: 4px; }
  .btn.quiet { background: none; color: var(--grey); font-weight: 500; border: 1px solid var(--rule); margin-top: 10px; }

  /* summary (scrolls) */
  .summary { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 24px 16px calc(env(safe-area-inset-bottom) + 24px); }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 22px 20px 20px; }
  .card h3 { font-family: var(--display); font-weight: 600; font-size: 2rem; margin: 0 0 2px; color: var(--ink-soft); }
  .card p { font-family: var(--sans); font-size: 1rem; line-height: 1.6; color: var(--ink-soft); margin: 0 0 14px; }
  .lh { font-family: var(--sans); font-weight: 600; font-size: .95rem; margin: 18px 0 4px; color: var(--ink-soft); }
  .list { border-top: 1px solid var(--rule); margin-bottom: 14px; }
  .row { display: flex; align-items: baseline; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--rule); font-size: 1.05rem; color: var(--ink-soft); }
  .row .num { font-family: var(--sans); font-size: .76rem; color: var(--grey); width: 50px; flex: none; }
  .row i { color: var(--grey); }
  .row .heb { font-family: var(--sans); color: var(--gold-deep); margin-left: auto; }
  .foot { margin-top: 20px; font-family: var(--sans); font-size: .78rem; color: var(--grey); text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div class="bar" role="group" aria-label="Drill mode">
    <button data-mode="key" aria-pressed="true">Key → Path</button>
    <button data-mode="letter" aria-pressed="false">Letter → Path</button>
    <button data-mode="path" aria-pressed="false">Path → Key</button>
    <button class="theme" id="theme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z"/></svg></button>
  </div>

  <div class="prompt" id="prompt"></div>

  <div class="treebox" id="treebox">
    <svg class="tree" id="tree" viewBox="-132 -242 264 630" aria-label="Tree of Life"></svg>
    <button class="next" id="next" hidden>Next ›</button>
  </div>

  <div class="summary" id="summary" hidden></div>
</div>

  const MODES = { key:"Key → Path", letter:"Letter → Path", path:"Path → Key" };
  let mode = "key", deck = [], i = 0, hits = 0, missed = [], locked = false;

  const $ = id => document.getElementById(id);
  const tree = $("tree"), prompt = $("prompt"), treebox = $("treebox"), next = $("next");
  const NS = "http://www.w3.org/2000/svg";
  const el = (t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };

  // fit: Kether's centre sits on the bottom edge of the card row; everything above rises behind it
  function fit(){
    const box = treebox.getBoundingClientRect(), row = prompt.getBoundingClientRect();
    const H = box.height, top = row.bottom - box.top;            // px from box top to Kether centre
    if (H <= 0) return;
    const yMax = 3*R + 28, yMin = -R;                            // Malkuth rim, Kether centre (units)
    // (yMin - T)*sc = top and (yMax - T)*sc = H-6  →  sc = (H-6-top)/(yMax-yMin)
    const sc = (H - 6 - top) / (yMax - yMin);
    const T = yMin - top / sc, vh = (H - 6) / sc, vw = box.width / sc;
    tree.setAttribute("viewBox", `${-vw/2} ${T} ${vw} ${vh}`);
  }
  addEventListener("resize", fit);
  // ---- draw tree once
  [-R,0,R,2*R].forEach(cy => tree.appendChild(el("circle",{class:"guide",cx:0,cy,r:R})));
  const lines = {};
  KEYS.forEach(k => {
    const a = pos[k.from], b = pos[k.to];
    const hit = el("line",{class:"hit",x1:a.x,y1:a.y,x2:b.x,y2:b.y,tabindex:0,role:"button","aria-label":`${k.from} to ${k.to}`});
    const line = el("line",{class:"path",x1:a.x,y1:a.y,x2:b.x,y2:b.y});
    hit.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(k.id);} });
    tree.appendChild(hit); tree.appendChild(line);
    lines[k.id] = line;
  });
  // a tap picks the nearest path, not whichever hit-line happens to be drawn on top where two cross
  tree.addEventListener("click", e => {
    if (locked) return;
    const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(tree.getScreenCTM().inverse());
    let best = null, bd = 16;
    KEYS.forEach(k => {
      const a = pos[k.from], b = pos[k.to];
      const dx = b.x - a.x, dy = b.y - a.y, L = dx*dx + dy*dy;
      let t = ((pt.x - a.x) * dx + (pt.y - a.y) * dy) / L; t = Math.max(0.1, Math.min(0.9, t));
      const d = Math.hypot(pt.x - (a.x + t*dx), pt.y - (a.y + t*dy));
      if (d < bd) { bd = d; best = k; }
    });
    if (best) pick(best.id);
  });
  const sephEls = {};
  SEPH.forEach(s => {
    const g = el("g",{class:"seph"});
    g.appendChild(el("title",{})).textContent = `${s.n} · ${s.name}`;
    g.appendChild(el("circle",{cx:s.x,cy:s.y,r:26}));
    const t = el("text",{x:s.x,y:s.y+5}); t.textContent = s.heb; g.appendChild(t);
    const n = el("text",{class:"n",x:s.x,y:s.y-10}); n.textContent = s.n; g.appendChild(n);
    tree.appendChild(g); sephEls[s.name] = g;
  });

  // ---- round control
  function shuffle(a){ for(let j=a.length-1;j>0;j--){ const r=Math.floor(Math.random()*(j+1)); [a[j],a[r]]=[a[r],a[j]]; } return a; }
  const img = k => IMG[k.key] ? `<img alt="" src="${IMG[k.key]}">` : "";
  function start(list){
    deck = shuffle(list ? list.slice() : KEYS.slice()); i = 0; hits = 0; missed = [];
    $("summary").hidden = true;
    prompt.hidden = false; treebox.hidden = false;
    show();
  }
  function clearTree(){
    Object.values(lines).forEach(l=>l.classList.remove("answer","miss","ask"));
    Object.values(sephEls).forEach(g=>g.classList.remove("lit"));
    treebox.classList.remove("locked"); next.hidden = true;
  }
  const prog = () => `<span class="prog">${i+1}/${deck.length} · ${hits} ✓</span>`;
  function show(){
    locked = false; clearTree();
    const old = $("choices"); if (old) old.remove();
    const k = deck[i];
    if (mode === "key") {
      prompt.innerHTML = `${img(k)}<div class="txt"><p class="kicker"><span>Key ${k.key}</span>${prog()}</p><p class="title">${k.title}</p><p class="sub">Tap its path</p></div>`;
    } else if (mode === "letter") {
      prompt.innerHTML = `<div class="letter">${k.heb}</div><div class="txt"><p class="kicker"><span>Letter</span>${prog()}</p><p class="title">${k.letter}</p><p class="sub">Tap its path</p></div>`;
    } else {
      lines[k.id].classList.add("ask");
      sephEls[k.from].classList.add("lit"); sephEls[k.to].classList.add("lit");
      treebox.classList.add("locked");
      const opts = shuffle([k, ...shuffle(KEYS.filter(o=>o!==k)).slice(0,3)]);
      prompt.innerHTML = `<div class="txt"><p class="kicker"><span>Which Key</span>${prog()}</p><p class="title">walks this path?</p><p class="sub">${k.from} to ${k.to}</p></div>`;
      const c = document.createElement("div"); c.className = "choices"; c.id = "choices";
      opts.forEach(o => {
        const b = document.createElement("button");
        b.dataset.key = o.key;
        b.innerHTML = `<span class="k">${o.key}</span><span class="t">${o.title}</span>`;
        b.addEventListener("click", ()=>pick(o.id));
        c.appendChild(b);
      });
      treebox.appendChild(c);
    }
  }
  function pick(id){
    if (locked) return; locked = true;
    const k = deck[i], ok = id === k.id;
    if (ok) hits++; else missed.push(k);
    treebox.classList.add("locked");
    lines[k.id].classList.remove("ask");
    lines[k.id].classList.add(ok ? "answer" : "miss");
    if (mode === "path") $("choices").remove();
    sephEls[k.from].classList.add("lit"); sephEls[k.to].classList.add("lit");
    // the prompt box becomes the answer box: same height, no reflow
    setTimeout(() => {
      next.textContent = i + 1 < deck.length ? "Next ›" : "Finish ›"; next.hidden = false;
      prompt.innerHTML = `${img(k)}<div class="txt"><p class="kicker ${ok?"yes":"no"}"><span>${ok?"Yes":"No"} · Key ${k.key} · Path ${k.path}</span>${prog()}</p><p class="title">${k.title}</p><p class="sub"><span class="heb">${k.heb}</span> ${k.letter} · ${k.from} to ${k.to}</p></div>`;
    }, mode === "path" ? 500 : 0);
  }
  function advance(){
    if (!locked) return;
    if (++i < deck.length) show(); else finish();
  }
  function finish(){
    const total = deck.length, bestKey = "ihsvh.paths.best." + mode;
    let best = 0; try { best = +localStorage.getItem(bestKey) || 0; if (hits/total > best) { best = hits/total; localStorage.setItem(bestKey, best); } } catch(e){}
    prompt.hidden = true; treebox.hidden = true;
    const s = $("summary"); s.hidden = false; s.scrollTop = 0;
    s.innerHTML = `<div class="card"><h3>${hits} of ${total}</h3>
      <p>${MODES[mode]}${best ? ` · best ${Math.round(best*100)}%` : ""}</p>
      ${missed.length ? `<p class="lh">Missed</p><div class="list">${missed.map(k=>`<div class="row"><span class="num">Path ${k.path}</span><span>Key ${k.key}, ${k.title} <i>· ${k.from} to ${k.to}</i></span><span class="heb">${k.heb}</span></div>`).join("")}</div>
      <button class="btn" id="again-missed">Drill the missed ${missed.length}</button>` : `<p>All twenty-two.</p>`}
      <button class="btn ${missed.length?"quiet":""}" id="again">All twenty-two again</button></div>
      <p class="foot">Case / B.O.T.A. attributions · paths 11–32</p>`;
    $("again").addEventListener("click", ()=>start());
    const m = $("again-missed"); if (m) m.addEventListener("click", ()=>start(missed));
  }

  const root = document.documentElement;
  try { const t = localStorage.getItem("ihsvh.theme"); if (t) root.dataset.theme = t; } catch(e){}
  $("theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("ihsvh.theme", root.dataset.theme); } catch(e){}
  });
  next.addEventListener("click", advance);
  document.addEventListener("keydown", e => { if ((e.key==="Enter"||e.key===" ") && locked && !treebox.hidden && document.activeElement.tagName!=="BUTTON") { e.preventDefault(); advance(); } });
  document.querySelectorAll(".bar button").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll(".bar button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    start();
  }));
  start(); fit(); setTimeout(fit, 300);
})();
</script>
</body>
</html>
