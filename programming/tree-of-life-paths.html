<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paths of the Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Cormorant+Infant:wght@500;600&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F1E4;
    --card: #FBF9F2;
    --ink: #1F1F1D;
    --ink-soft: #46453F;
    --grey: #7D7669;
    --rule: #E1DBC9;
    --gold: #B4A67F;
    --gold-deep: #AC9D71;
    --gold-line: #BFB18F;
    --ref: #72ABBF;
    --miss: #B5685C;          /* new token: wrong answer; ESV/IHSVH have no error hue */
    --serif: "Crimson Pro", Georgia, serif;
    --display: "Cormorant Infant", "Crimson Pro", serif;
    --sans: "Assistant", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1F1F1D;
      --card: #262624;
      --ink: #E8E2D0;
      --ink-soft: #D6CFBC;
      --grey: #9A9283;
      --rule: #3A3935;
      --gold: #BC9836;
      --gold-deep: #A9892F;
      --gold-line: #8C7A45;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .bar { position: sticky; top: 0; z-index: 5; background: var(--gold); color: #fff; font-family: var(--sans); font-weight: 500; font-size: 1.05rem; text-align: center; padding: calc(env(safe-area-inset-top) + 14px) 16px 14px; letter-spacing: .01em; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 8px 18px 64px; }

  h1.book { font-family: var(--display); font-weight: 600; font-size: 1.85rem; text-align: center; letter-spacing: .06em; margin: 30px 0 4px; color: var(--ink-soft); }
  p.lede { text-align: center; font-style: italic; font-size: 1.15rem; margin: 0 0 22px; color: var(--grey); }

  /* mode segmented control */
  .modes { display: flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; margin: 0 auto 6px; max-width: 460px; font-family: var(--sans); font-size: .95rem; }
  .modes button { flex: 1; padding: 9px 4px; color: var(--grey); border-right: 1px solid var(--rule); }
  .modes button:last-child { border-right: 0; }
  .modes button[aria-pressed="true"] { background: var(--card); color: var(--ink-soft); font-weight: 600; }

  .meta { display: flex; justify-content: space-between; max-width: 460px; margin: 0 auto 18px; font-family: var(--sans); font-size: .85rem; color: var(--grey); padding: 0 2px; }

  /* prompt */
  .prompt { text-align: center; min-height: 118px; }
  .prompt .kicker { font-family: var(--sans); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--grey); margin: 0 0 4px; }
  .prompt .title { font-family: var(--display); font-weight: 600; font-size: 2.1rem; letter-spacing: .03em; color: var(--ink-soft); margin: 0; line-height: 1.1; }
  .prompt .letter { font-family: var(--sans); font-weight: 400; font-size: 4.4rem; line-height: 1; color: var(--gold-deep); margin: 2px 0 0; direction: rtl; }
  .prompt .sub { font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--grey); margin: 4px 0 0; }
  .prompt img { display: block; margin: 0 auto 10px; width: 96px; height: auto; border: 1px solid var(--rule); border-radius: 3px; background: var(--card); }
  .prompt img[hidden] { display: none; }

  /* tree */
  .treebox { position: relative; margin: 6px auto 0; max-width: 400px; }
  svg.tree { display: block; width: 100%; height: auto; overflow: visible; }
  .guide { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 5; }
  .path { stroke: var(--gold-line); stroke-width: 1.6; stroke-linecap: round; pointer-events: none; transition: stroke .15s, stroke-width .15s; }
  .hit { stroke: transparent; stroke-width: 22; cursor: pointer; }
  .hit:hover + .path, .hit:focus-visible + .path { stroke: var(--gold); stroke-width: 3; }
  .hit:focus-visible { outline: none; }
  .locked .hit { pointer-events: none; }
  .path.answer, .locked .path.answer, .path.ask { stroke: var(--gold-deep); stroke-width: 5; }
  .path.miss, .locked .path.miss { stroke: var(--miss); stroke-width: 5; stroke-dasharray: 6 5; }
  .path.ask { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { stroke-width: 3; } }
  .seph circle { fill: var(--card); stroke: var(--gold-line); stroke-width: 1.2; }
  .seph text { font-family: var(--sans); font-size: 12.5px; fill: var(--gold-deep); text-anchor: middle; dominant-baseline: central; direction: rtl; pointer-events: none; }
  .seph .n { font-family: var(--serif); font-weight: 300; font-size: 10px; fill: var(--grey); direction: ltr; }
  .seph.lit circle { stroke: var(--gold-deep); stroke-width: 2; }

  /* result + actions */
  .result { text-align: center; min-height: 64px; margin: 10px 0 0; }
  .result .line { font-size: 1.25rem; line-height: 1.5; color: var(--ink-soft); margin: 0; }
  .result .line i { color: var(--grey); }
  .result .heb { font-family: var(--sans); color: var(--gold-deep); direction: rtl; unicode-bidi: isolate; }
  .result .verdict { font-family: var(--sans); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 2px; color: var(--gold-deep); }
  .result .verdict.miss { color: var(--miss); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 460px; margin: 14px auto 0; }
  .choices button { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 10px; text-align: left; line-height: 1.3; }
  .choices button:hover { border-color: var(--gold); }
  .choices .k { display: block; font-family: var(--sans); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--grey); }
  .choices .t { display: block; font-family: var(--display); font-weight: 600; font-size: 1.3rem; color: var(--ink-soft); }
  .choices button.answer { border-color: var(--gold-deep); box-shadow: inset 0 0 0 1px var(--gold-deep); }
  .choices button.miss { border-color: var(--miss); box-shadow: inset 0 0 0 1px var(--miss); }
  .choices button:disabled { cursor: default; }

  .btn { display: block; width: 100%; max-width: 460px; margin: 18px auto 0; background: var(--gold-deep); color: #fff; font-family: var(--sans); font-weight: 600; font-size: 1.1rem; text-align: center; padding: 14px; border-radius: 4px; }
  .btn.quiet { background: none; color: var(--grey); font-weight: 500; border: 1px solid var(--rule); margin-top: 10px; }
  .btn[hidden] { display: none; }

  /* summary */
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 22px 20px 20px; margin: 30px auto 0; max-width: 460px; }
  .card h3 { font-family: var(--sans); font-weight: 600; font-size: 1.25rem; margin: 0 0 6px; color: var(--ink-soft); }
  .card p { font-family: var(--sans); font-size: 1.05rem; line-height: 1.6; color: var(--ink-soft); margin: 0 0 14px; }
  .lh { font-family: var(--sans); font-weight: 600; font-size: 1rem; margin: 22px 0 4px; color: var(--ink-soft); }
  .list { border-top: 1px solid var(--rule); }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--rule); font-size: 1.1rem; color: var(--ink-soft); }
  .row .num { font-family: var(--sans); font-size: .8rem; color: var(--grey); width: 44px; flex: none; }
  .row .heb { font-family: var(--sans); color: var(--gold-deep); margin-left: auto; }
  .card .btn { margin-top: 14px; }

  .foot { margin-top: 44px; border-top: 1px solid var(--rule); padding-top: 12px; font-family: var(--sans); font-size: .8rem; color: var(--grey); line-height: 1.6; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="bar" id="bar">Paths of the Tree</div>

<div class="wrap">
  <h1 class="book">THE TREE OF LIFE</h1>
  <p class="lede">The twenty-two paths and their Keys</p>

  <div class="modes" role="group" aria-label="Drill mode">
    <button data-mode="key" aria-pressed="true">Key → Path</button>
    <button data-mode="letter" aria-pressed="false">Letter → Path</button>
    <button data-mode="path" aria-pressed="false">Path → Key</button>
  </div>
  <div class="meta"><span id="progress"></span><span id="score"></span></div>

  <div id="quiz">
    <div class="prompt" id="prompt"></div>

    <div class="treebox" id="treebox">
      <svg class="tree" id="tree" viewBox="-150 -160 300 560" aria-label="Tree of Life"></svg>
    </div>

    <div class="result" id="result"></div>
    <div class="choices" id="choices" hidden></div>
    <button class="btn" id="next" hidden>Next</button>
  </div>

  <div id="summary" hidden></div>

  <p class="foot">Case / B.O.T.A. attributions · paths 11–32</p>
</div>

<script>
(function () {
  const R = 120, X = R * Math.sin(Math.PI / 3);
  const SEPH = [
    ["Kether","כתר",0,-R],["Chokmah","חכמה",X,-R/2],["Binah","בינה",-X,-R/2],
    ["Chesed","חסד",X,R/2],["Geburah","גבורה",-X,R/2],["Tiphareth","תפארת",0,R],
    ["Netzach","נצח",X,1.5*R],["Hod","הוד",-X,1.5*R],["Yesod","יסוד",0,2*R],["Malkuth","מלכות",0,3*R]
  ].map(([name,heb,x,y],i)=>({name,heb,x,y,n:i+1}));
  const pos = Object.fromEntries(SEPH.map(s=>[s.name,s]));

  // key, title, path number, letter, letter name, from, to
  const KEYS = [
    [0,"The Fool",11,"א","Aleph","Kether","Chokmah"],
    [1,"The Magician",12,"ב","Beth","Kether","Binah"],
    [2,"The High Priestess",13,"ג","Gimel","Kether","Tiphareth"],
    [3,"The Empress",14,"ד","Daleth","Chokmah","Binah"],
    [4,"The Emperor",15,"ה","Heh","Chokmah","Tiphareth"],
    [5,"The Hierophant",16,"ו","Vav","Chokmah","Chesed"],
    [6,"The Lovers",17,"ז","Zain","Binah","Tiphareth"],
    [7,"The Chariot",18,"ח","Cheth","Binah","Geburah"],
    [8,"Strength",19,"ט","Teth","Chesed","Geburah"],
    [9,"The Hermit",20,"י","Yod","Chesed","Tiphareth"],
    [10,"Wheel of Fortune",21,"כ","Kaph","Chesed","Netzach"],
    [11,"Justice",22,"ל","Lamed","Geburah","Tiphareth"],
    [12,"The Hanged Man",23,"מ","Mem","Geburah","Hod"],
    [13,"Death",24,"נ","Nun","Tiphareth","Netzach"],
    [14,"Temperance",25,"ס","Samekh","Tiphareth","Yesod"],
    [15,"The Devil",26,"ע","Ayin","Tiphareth","Hod"],
    [16,"The Tower",27,"פ","Peh","Netzach","Hod"],
    [17,"The Star",28,"צ","Tzaddi","Netzach","Yesod"],
    [18,"The Moon",29,"ק","Qoph","Netzach","Malkuth"],
    [19,"The Sun",30,"ר","Resh","Hod","Yesod"],
    [20,"Judgement",31,"ש","Shin","Hod","Malkuth"],
    [21,"The World",32,"ת","Tav","Yesod","Malkuth"]
  ].map(([key,title,path,heb,letter,from,to])=>({key,title,path,heb,letter,from,to,id:from+"|"+to}));
  const byId = Object.fromEntries(KEYS.map(k=>[k.id,k]));
  const IMG = {}; // key number → image URL/data URI (filled when images are supplied)

  const MODES = { key:"Key → Path", letter:"Letter → Path", path:"Path → Key" };
  let mode = "key", deck = [], i = 0, hits = 0, missed = [], locked = false;

  const $ = id => document.getElementById(id);
  const tree = $("tree"), prompt = $("prompt"), result = $("result"), choices = $("choices"), next = $("next");
  const NS = "http://www.w3.org/2000/svg";
  const el = (t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };

  // ---- draw tree once
  [-R,0,R,2*R].forEach(cy => tree.appendChild(el("circle",{class:"guide",cx:0,cy,r:R})));
  const lines = {};
  KEYS.forEach(k => {
    const a = pos[k.from], b = pos[k.to];
    const hit = el("line",{class:"hit",x1:a.x,y1:a.y,x2:b.x,y2:b.y,tabindex:0,role:"button","aria-label":`${k.from} to ${k.to}`});
    const line = el("line",{class:"path",x1:a.x,y1:a.y,x2:b.x,y2:b.y});
    hit.addEventListener("click", ()=>pick(k.id));
    hit.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(k.id);} });
    tree.appendChild(hit); tree.appendChild(line);
    lines[k.id] = line;
  });
  const sephEls = {};
  SEPH.forEach(s => {
    const g = el("g",{class:"seph"});
    g.appendChild(el("title",{})).textContent = `${s.n} · ${s.name}`;
    g.appendChild(el("circle",{cx:s.x,cy:s.y,r:26}));
    const t = el("text",{x:s.x,y:s.y+5}); t.textContent = s.heb; g.appendChild(t);
    const n = el("text",{class:"n",x:s.x,y:s.y-10}); n.textContent = s.n; g.appendChild(n);
    tree.appendChild(g); sephEls[s.name] = g;
  });

  // ---- round control
  function shuffle(a){ for(let j=a.length-1;j>0;j--){ const r=Math.floor(Math.random()*(j+1)); [a[j],a[r]]=[a[r],a[j]]; } return a; }
  function start(list){
    deck = shuffle(list ? list.slice() : KEYS.slice()); i = 0; hits = 0; missed = [];
    $("summary").hidden = true; $("quiz").hidden = false;
    show();
  }
  function clearTree(){
    Object.values(lines).forEach(l=>l.classList.remove("answer","miss","ask"));
    Object.values(sephEls).forEach(g=>g.classList.remove("lit"));
    $("treebox").classList.remove("locked");
  }
  function show(){
    locked = false; clearTree();
    result.innerHTML = ""; next.hidden = true; choices.hidden = true; choices.innerHTML = "";
    const k = deck[i];
    $("progress").textContent = `${i+1} of ${deck.length}`;
    $("score").textContent = `${hits} correct`;
    $("bar").textContent = `Paths of the Tree · ${MODES[mode]}`;
    if (mode === "key") {
      prompt.innerHTML = `<img alt="" ${IMG[k.key]?`src="${IMG[k.key]}"`:"hidden"}><p class="kicker">Key ${k.key}</p><p class="title">${k.title}</p><p class="sub">Tap its path</p>`;
    } else if (mode === "letter") {
      prompt.innerHTML = `<p class="letter">${k.heb}</p><p class="sub">${k.letter} · tap its path</p>`;
    } else {
      prompt.innerHTML = `<p class="kicker">Which Key</p><p class="title">walks this path?</p><p class="sub">${k.from} to ${k.to}</p>`;
      lines[k.id].classList.add("ask");
      sephEls[k.from].classList.add("lit"); sephEls[k.to].classList.add("lit");
      $("treebox").classList.add("locked");
      const opts = shuffle([k, ...shuffle(KEYS.filter(o=>o!==k)).slice(0,3)]);
      choices.hidden = false;
      opts.forEach(o => {
        const b = document.createElement("button");
        b.innerHTML = `<span class="k">Key ${o.key}</span><span class="t">${o.title}</span>`;
        b.addEventListener("click", ()=>pick(o.id));
        choices.appendChild(b);
      });
    }
  }
  function pick(id){
    if (locked) return; locked = true;
    const k = deck[i], ok = id === k.id;
    if (ok) hits++; else missed.push(k);
    $("score").textContent = `${hits} correct`;
    $("treebox").classList.add("locked");
    lines[k.id].classList.remove("ask"); lines[k.id].classList.add("answer");
    if (!ok && lines[id]) lines[id].classList.add("miss");
    sephEls[k.from].classList.add("lit"); sephEls[k.to].classList.add("lit");
    if (mode === "path") {
      [...choices.children].forEach(b => { b.disabled = true;
        const t = b.querySelector(".k").textContent.replace("Key ","")|0;
        if (t === k.key) b.classList.add("answer"); else if (KEYS[t].id === id && !ok) b.classList.add("miss"); });
    }
    result.innerHTML = `<p class="verdict ${ok?"":"miss"}">${ok?"Yes":"No"}</p>
      <p class="line">Path ${k.path} · <span class="heb">${k.heb}</span> ${k.letter} · Key ${k.key}, ${k.title}<br><i>${k.from} to ${k.to}</i></p>`;
    next.hidden = false; next.textContent = i + 1 < deck.length ? "Next" : "Finish";
    next.focus({preventScroll:true});
  }
  function advance(){
    if (!locked) return;
    if (++i < deck.length) show(); else finish();
  }
  function finish(){
    const total = deck.length, bestKey = "ihsvh.paths.best." + mode;
    let best = 0; try { best = +localStorage.getItem(bestKey) || 0; if (hits/total > best) { best = hits/total; localStorage.setItem(bestKey, best); } } catch(e){}
    $("quiz").hidden = true;
    const s = $("summary"); s.hidden = false;
    s.innerHTML = `<div class="card"><h3>${hits} of ${total}</h3>
      <p>${MODES[mode]}${best ? ` · best ${Math.round(best*100)}%` : ""}</p>
      ${missed.length ? `<p class="lh">Missed</p><div class="list">${missed.map(k=>`<div class="row"><span class="num">Path ${k.path}</span><span>Key ${k.key}, ${k.title} <i>· ${k.from} to ${k.to}</i></span><span class="heb">${k.heb}</span></div>`).join("")}</div>
      <button class="btn" id="again-missed">Drill the missed ${missed.length}</button>` : `<p>All twenty-two.</p>`}
      <button class="btn ${missed.length?"quiet":""}" id="again">All twenty-two again</button></div>`;
    $("again").addEventListener("click", ()=>start());
    const m = $("again-missed"); if (m) m.addEventListener("click", ()=>start(missed));
    window.scrollTo({top:0, behavior:"smooth"});
  }

  next.addEventListener("click", advance);
  document.addEventListener("keydown", e => { if ((e.key==="Enter"||e.key===" ") && locked && !$("quiz").hidden && document.activeElement.tagName!=="BUTTON") { e.preventDefault(); advance(); } });
  document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll(".modes button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    start();
  }));
  start();
})();
</script>
</body>
</html>
