    height: 100vh; height: 100dvh;
    box-sizing: border-box;
    padding-top: var(--safe-top); padding-bottom: var(--safe-bot);
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
    display: flex; flex-direction: column;
  }
  #app {
    flex: 1;
    min-height: 0;
    display: flex; flex-direction: column;
    background-color: var(--bg);
  }
  #app > * { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .run-root { overflow: hidden; }
  .home-root { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  button { font-family: inherit; background: none; border: none; color: inherit; cursor: pointer; padding: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  input { font-family: inherit; background: none; border: none; color: inherit; outline: none; }

  /* Keep portrait layout upright when the phone is rotated (iOS ignores orientation lock) */
  /* Lock to portrait: in landscape, hide the app and show a rotate prompt */
  #rotate-lock {
    display: none;
    position: fixed; inset: 0;
    z-index: 2000;
    background: var(--bg);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
    text-align: center;
    padding: 2rem;
  }
  #rotate-lock svg { width: 2.6rem; height: 2.6rem; color: var(--accent); }
  #rotate-lock .rotate-title {
    font-size: 1.15rem; font-weight: 600; letter-spacing: -0.01em; color: var(--ink);
  }
  #rotate-lock .rotate-sub {
    font-family: 'Geist Mono', monospace;
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gray-1);
    max-width: 18rem; line-height: 1.6;
  }
  @media screen and (orientation: landscape) and (max-height: 600px) {
    #app { visibility: hidden; }
    #rotate-lock { display: flex; }
  }

  /* BAR */
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.25rem 0.5rem; min-height: 3rem;
    position: relative;
  }
  .bar-btn {
    font-family: 'Geist Mono', monospace; font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--gray-1); padding: 0.5rem 0;
    transition: color 0.18s;
    position: relative; z-index: 1;
  }
  .bar-btn:active { color: var(--ink); }
  .bar-btn.accent { color: var(--ink); font-weight: 600; }
  .bar-right {
    display: flex; align-items: center; gap: 0.4rem;
    position: relative; z-index: 1;
  }
  .bar-icon {
    width: 1.85rem; height: 1.85rem;
    display: flex; align-items: center; justify-content: center;
    color: var(--gray-1);
    border-radius: 50%;
    transition: color 0.18s, background 0.18s;
  }
  .bar-icon:active { color: var(--ink); background: var(--line-soft); }
  .bar-icon svg { width: 1rem; height: 1rem; }
  .bar-title {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; color: var(--ink);
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
  }

  /* HOME */
  .section-header { padding: 1.5rem 1.25rem 1.5rem; }
  .eyebrow {
    font-family: 'Geist Mono', monospace; font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gray-2); margin-bottom: 0.35rem;
  }
  .home-title {
    font-size: clamp(1.75rem, 6vw, 2.25rem); font-weight: 600;
    letter-spacing: -0.02em; line-height: 1.1; color: var(--ink);
  }
  .home-list { display: flex; flex-direction: column; gap: 0.75rem; padding: 0 1.25rem; }
  .section-eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gray-1);
    padding: 0.25rem 0.25rem 0.4rem;
  }
  .section-eyebrow-spaced { margin-top: 1.5rem; }
  .section-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.25rem 0.25rem 0.1rem;
  }
  .section-header-row .section-eyebrow { padding: 0; }
  .section-header-row-spaced { margin-top: 1.25rem; }
  .section-header-actions {
    display: flex; align-items: center; gap: 0.5rem;
  }
  .plunge-chip {
    display: flex; align-items: center; gap: 0.35rem;
    padding: 0.3rem 0.7rem 0.3rem 0.55rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--gray-2);
    font-family: 'Geist Mono', monospace;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    transition: color 0.18s, border-color 0.18s, background 0.18s;
  }
  .plunge-chip svg { width: 0.85rem; height: 0.85rem; }
  .plunge-chip.on {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .plunge-chip:not(.on) { opacity: 0.7; }
  .plunge-chip:active { transform: scale(0.96); }
  .section-action {
    width: 1.75rem; height: 1.75rem;
    display: flex; align-items: center; justify-content: center;
    color: var(--gray-1);
    border-radius: 50%;
    transition: color 0.15s, background 0.15s;
  }
  .section-action:active { color: var(--ink); background: var(--line-soft); }
  .section-action svg { width: 0.95rem; height: 0.95rem; }
  .routine-card {
    display: block; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 1.1rem 1.4rem 1.15rem;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s, box-shadow 0.2s;
  }
  .routine-card:active { transform: scale(0.99); box-shadow: var(--shadow-md); }
  .routine-card-name {
    font-size: 1.3rem; font-weight: 600; letter-spacing: -0.015em;
    color: var(--ink); margin-bottom: 0.35rem;
  }
  .routine-card-meta {
    display: flex; align-items: center; gap: 0.5rem;
    font-family: 'Geist Mono', monospace; font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-1);
  }
  .routine-card-meta .dot { width: 3px; height: 3px; background: var(--gray-3); border-radius: 50%; }
  .add-card {
    width: 100%; border: 1px dashed var(--gray-3); background: transparent;
    border-radius: var(--radius-lg); padding: 1.1rem;
    font-family: 'Geist Mono', monospace; font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gray-1); margin-top: 0.25rem;
    transition: color 0.18s, border-color 0.18s;
  }
  .add-card:active { color: var(--ink); border-color: var(--gray-1); }
  .hint {
    text-align: center; padding: 1.5rem 1.25rem 2rem;
    font-family: 'Geist Mono', monospace; font-size: 0.62rem;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--gray-3);
  }

  /* RUN */
  .run-meta {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.5rem 1.25rem 0;
    font-family: 'Geist Mono', monospace; font-size: 0.78rem; font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray-2);
  }
  .run-progress {
    margin: 0.85rem 1.25rem 0; height: 2px;
    background: var(--line); border-radius: 2px; overflow: hidden;
  }
  .run-progress-fill {
    height: 100%; background: var(--ink); border-radius: 2px;
    transition: width 0.3s ease;
  }
  .run-body {
    flex: 1; display: flex; flex-direction: column;
    align-items: center;
    padding: 1.25rem 1.5rem 1rem; text-align: center;
  }
  .step-name {
    font-size: clamp(1.85rem, 7vw, 2.4rem); font-weight: 500;
    line-height: 1.15; letter-spacing: -0.025em; color: var(--ink);
    max-width: 22rem;
    width: 100%;
    min-height: 5.5rem;
    display: flex; align-items: center; justify-content: center;
    padding: 0.5rem 0;
  }
  .run-body-spacer { flex: 1; }
  .timer-wrap {
    position: relative; width: min(60vw, 230px);
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
  }
  .timer-ring {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform: rotate(-90deg); overflow: visible;
  }
  .timer-ring-track { fill: none; stroke: var(--line); stroke-width: 4; }
  .timer-ring-fill {
    fill: none; stroke: var(--accent); stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, opacity 0.3s, stroke 0.3s;
  }
  .timer-ring-fill.done { opacity: 0.35; }
  .timer-ring-fill.paused { stroke: var(--gray-2); }
  .timer-text {
    position: relative; z-index: 1;
    font-family: 'Geist Mono', monospace;
    font-size: clamp(3.2rem, 13vw, 4.4rem);
    font-weight: 600; line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--ink); transition: color 0.3s;
  }
  .timer-stack {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center;
  }
  .timer-pause {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 0.6rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
    font-family: 'Geist Mono', monospace;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    line-height: 1;
  }
  .timer-pause .pause-icon { width: 0.9rem; height: 0.9rem; }
  .timer-pause[hidden] { display: none; }
  .timer-text.done { color: var(--accent); }
  .timer-text.flash { animation: flashPulse 0.6s ease-out; }
  .timer-ring-fill.flash { animation: flashStroke 0.6s ease-out; }
  @keyframes flashPulse {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes flashStroke {
    0%   { stroke-width: 4; }
    30%  { stroke-width: 6.5; }
    100% { stroke-width: 4; }
  }
  .timer-sign {
    font-size: 0.55em;
    font-weight: 600;
    vertical-align: 0.25em;
    margin-right: 0.04em;
  }
  .timer-sign[hidden] { display: none; }
  .timer-over-label {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 0.5rem;
    font-family: 'Geist Mono', monospace;
    font-size: 0.85rem; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent);
  }
  .timer-over-label[hidden] { display: none; }
  .run-eta {
    text-align: center;
    padding: 0 1.25rem 1rem;
    font-family: 'Geist Mono', monospace;
    display: flex; align-items: baseline; justify-content: center; gap: 0.45rem;
  }
  .run-eta-label {
    font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gray-2);
  }
  .run-eta-time {
    font-size: 0.95rem; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  /* CONTROLS */
  .run-controls { padding: 0 1.25rem 0.5rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .next-btn {
    width: 100%; background: var(--gray-3);
    color: var(--ink-2);
    height: 3.6rem; padding: 0 1rem;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius);
    font-size: 0.85rem; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    transition: transform 0.1s, background 0.25s, color 0.25s;
  }
  .next-btn:active { transform: scale(0.985); }
  .next-btn.done { background: var(--accent); color: var(--btn-text); }
  .sec-controls { display: flex; gap: 0.4rem; }
  .sec-btn {
    flex: 1; height: 3.6rem; padding: 0 0.5rem;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Geist Mono', monospace;
    font-size: 0.78rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--gray-1); background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius);
    transition: color 0.18s, border-color 0.18s, background 0.18s;
  }
  .sec-btn:active { color: var(--ink); background: var(--line-soft); }
  .sec-btn.paused { color: var(--accent); border-color: var(--accent); }

  /* COMPLETE */
  .complete {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 3rem 1.5rem; text-align: center;
  }
  .complete-glyph {
    width: 3.5rem; height: 3.5rem;
    background: var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 2rem;
    box-shadow: 0 8px 24px -8px rgba(227, 179, 65, 0.5);
  }
  .complete-glyph::after {
    content: ''; width: 1rem; height: 0.5rem;
    border-left: 2px solid var(--btn-text); border-bottom: 2px solid var(--btn-text);
    transform: rotate(-45deg) translate(2px, -2px);
  }
  .complete-title {
    font-size: 1.65rem; font-weight: 600; letter-spacing: -0.02em;
    color: var(--ink); margin-bottom: 0.4rem;
  }
  .complete-time {
    font-family: 'Geist Mono', monospace; font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gray-1); margin-bottom: 3rem;
  }
  .complete-btn {
    background: var(--ink); color: var(--btn-text);
    padding: 0.95rem 2.5rem; border-radius: var(--radius-pill);
    font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    transition: transform 0.1s;
  }
  .complete-btn:active { transform: scale(0.97); }

  /* SUMMARY */
  .summary {
    flex: 1;
    padding: 1.5rem 1.25rem 2rem;
    overflow-y: auto;
  }
  .summary-hero {
    text-align: center;
    padding: 0.5rem 0 1.5rem;
  }
  .summary-glyph {
    width: 3rem; height: 3rem;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
    box-shadow: 0 8px 24px -8px rgba(227, 179, 65, 0.5);
    position: relative;
  }
  .summary-glyph::after {
    content: '';
    width: 0.9rem; height: 0.45rem;
    border-left: 2px solid var(--btn-text);
    border-bottom: 2px solid var(--btn-text);
    transform: rotate(-45deg) translate(2px, -2px);
  }
  .summary-headline {
    font-family: 'Geist Mono', monospace;
    font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gray-1);
    margin-bottom: 0.4rem;
  }
  .summary-total {
    font-family: 'Geist Mono', monospace;
    font-size: clamp(2.4rem, 9vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    margin-bottom: 0.75rem;
  }
  .summary-vs {
    display: flex; justify-content: center; align-items: center;
    gap: 0.5rem;
    font-family: 'Geist Mono', monospace;
    font-size: 0.75rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--gray-1);
  }
  .summary-vs .dot {
    width: 3px; height: 3px; background: var(--gray-3); border-radius: 50%;
  }
  .summary-vs .over { color: var(--accent); }
  .summary-vs .under { color: var(--ink); }
  .summary-streak {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.5rem;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .summary-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .summary-stat {
    padding: 1rem 0.5rem;
    text-align: center;
    border-right: 1px solid var(--line);
  }
  .summary-stat:last-child { border-right: none; }
  .summary-stat-num {
    font-family: 'Geist Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .summary-stat-label {
    font-family: 'Geist Mono', monospace;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray-1);
    margin-top: 0.35rem;
  }
  .summary-row.skipped .summary-row-name {
    color: var(--gray-2);
    text-decoration: line-through;
    text-decoration-color: var(--gray-3);
  }
  .summary-row.skipped .summary-row-actual {
    color: var(--gray-2);
    font-weight: 500;
  }
  .skipped-tag {
    color: var(--gray-2) !important;
    font-size: 0.65rem !important;
    letter-spacing: 0.15em !important;
    text-transform: uppercase;
  }
  .summary-streak-num {
    font-size: 1.8rem; font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .summary-streak-label {
    font-family: 'Geist Mono', monospace;
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--gray-1);
  }
  .summary-section-label {
    font-family: 'Geist Mono', monospace;
    font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gray-2);
    padding: 0 0.25rem 0.75rem;
  }
  .summary-list {
    display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .summary-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.85rem 1rem;
    gap: 0.75rem;
    border-bottom: 1px solid var(--line);
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row-name {
    font-size: 0.95rem;
    color: var(--ink);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .summary-row-times {
    display: flex; align-items: baseline; gap: 0.5rem;
    font-family: 'Geist Mono', monospace;
    font-variant-numeric: tabular-nums;
  }
  .summary-row-actual {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
  }
  .summary-row-delta {
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    min-width: 3rem;
    text-align: right;
  }
  .summary-row-delta.over { color: var(--accent); }
  .summary-row-delta.under { color: var(--gray-2); }

  /* EDIT */
  .edit { flex: 1; display: flex; flex-direction: column; padding: 0 1.25rem 2rem; }
  .edit-name {
    width: 100%; font-size: 1.65rem; font-weight: 600;
    letter-spacing: -0.02em; color: var(--ink);
    padding: 0.4rem 0 1rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 1.25rem;
  }
  .edit-name:focus { border-color: var(--ink); }
  .edit-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .edit-row {
    display: flex; align-items: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.65rem 0.75rem 0.65rem 0.4rem; gap: 0.5rem;
  }
  .edit-row.dragging { opacity: 0.4; }
  .edit-row.drag-over { border-top: 2px solid var(--accent); }
  .edit-row-handle {
    color: var(--gray-2); font-size: 1.05rem;
    width: 1.5rem; text-align: center;
    touch-action: none; line-height: 1;
    padding: 0.5rem 0.1rem;
    cursor: grab;
  }
  .edit-row-handle:active { cursor: grabbing; color: var(--ink); }
  .edit-row.dragging {
    opacity: 0.5;
    transform: scale(1.01);
    box-shadow: var(--shadow-md);
  }
  .edit-row.drop-target { box-shadow: inset 0 2px 0 var(--accent); }
  .edit-row-name { flex: 1; font-size: 0.95rem; color: var(--ink); padding: 0.5rem 0; min-width: 0; }
  .edit-row-name:disabled { color: var(--gray-1); opacity: 1; }
  .edit-row-name-static {
    flex: 1; font-size: 0.95rem; color: var(--ink); padding: 0.5rem 0;
    min-width: 0; line-height: 1.3;
  }
  .edit-row.overridden { border-color: var(--accent); }
  .edit-row.overridden .edit-row-time { color: var(--accent); }
  .edit-row-tag {
    color: var(--accent); font-size: 1.2rem; line-height: 1;
    padding: 0 0.25rem 0 0.1rem;
  }
  .edit-blurb {
    font-family: 'Geist Mono', monospace;
    font-size: 0.65rem; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--gray-1);
    padding: 0 0.25rem 1rem;
    line-height: 1.6;
  }

<body>
<main id="app"></main>
<div id="rotate-lock" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
  <div class="rotate-title">Rotate to portrait</div>
  <div class="rotate-sub">This app is designed for upright use</div>
</div>

<script>
'use strict';

const STORAGE_KEY = 'ihsvh.routines.v8';
const HISTORY_KEY = 'ihsvh.routines.history';
const DETAIL_KEY = 'ihsvh.routines.detail';
const SNAPSHOT_KEY = 'ihsvh.routines.snapshot';
const LEGACY_KEY_V7 = 'ihsvh.routines.v7';
const LEGACY_KEY_V6 = 'ihsvh.routines.v6';
const LEGACY_KEY_V5 = 'ihsvh.routines.v5';
const LEGACY_KEY_V4 = 'ihsvh.routines.v4';
const LEGACY_KEY_V3 = 'ihsvh.routines.v3';
const LEGACY_KEY_V2 = 'ihsvh.routines.v2';

const MEDS_BY_DAY = {
  Sunday:    'Tam.75, Clo1.5',
  Monday:    'Trz40u, Tam.75, Clo1.5',
  Tuesday:   'Tam.75, Clo1.5',
  Wednesday: 'Trz40u, Tam.75, Clo1.5',
  Thursday:  'Tam.75, Clo1.5',
  Friday:    'Trz40u, Tam.75, Clo1.5',
  Saturday:  'Tam.75, Clo1.5'
};
const SHAVE_BY_DAY = {
  Sunday:    'Shave Head',
  Monday:    'Shave Head and Arms',
  Tuesday:   'Shave Head',
  Wednesday: 'Shave Head and Arms',
  Thursday:  'Shave Head',
  Friday:    'Shave Head',
  Saturday:  'Shave Head and Arms'
};
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const DEFAULT_CUSTOM = [
  {
    id: 'stretching',
    name: 'Stretching',
    autoAdvance: true,
    soundReminder: true,
    steps: [
      { name: 'Initial Stretch',     seconds: 120 },
      { name: 'Hamstring 1 Prep',    seconds: 45  },
      { name: 'Hamstring 1A',        seconds: 30  },
      { name: 'Hamstring 1B',        seconds: 30  },
      { name: 'Hamstring 1C',        seconds: 30  },
      { name: 'Hamstring 2 Prep',    seconds: 20  },
      { name: 'Hamstring 2A',        seconds: 30  },
      { name: 'Hamstring 2B',        seconds: 30  },
      { name: 'Hamstring 2C',        seconds: 30  },
      { name: 'Head to Knee 1 Prep', seconds: 30  },
      { name: 'Head to Knee 1',      seconds: 60  },
      { name: 'Head to Knee 2 Prep', seconds: 15  },
      { name: 'Head to Knee 2',      seconds: 60  },
      { name: 'Butterfly',           seconds: 30  },
      { name: 'Plow',                seconds: 60  },
      { name: 'Twists',              seconds: 30  },
      { name: 'Receive the Love',    seconds: 60  }
    ]
  }
];

// Shared library — order defines step sequence; 'meds' is a special slot resolved per-day
const DEFAULT_LIBRARY = [
  { id: 'prayer',    name: 'Poop and Prayer',           seconds: 600 },
  { id: 'weight',    name: 'Weight',                    seconds: 30  },
  { id: 'water',     name: 'Kettle, Water, Vitamins',   seconds: 270 },
  { id: 'tea_prep',  name: 'Prepare Tea',               seconds: 390 },
  { id: 'shave',     name: 'Shave',                     seconds: 240 },
  { id: 'plunge',    name: 'Cold Plunge',               seconds: 420 },
  { id: 'shower',    name: 'Shower',                    seconds: 480 },
  { id: 'skincare',  name: 'Skincare',                  seconds: 180 },
  { id: 'teeth',     name: 'Brush Teeth',               seconds: 120 }
];

// Resolved routine for runtime — pulled from data on demand
function plungeEnabled() {
  return data.plungeEnabled !== false; // default on
}
function setPlungeEnabled(on) {
  data.plungeEnabled = !!on;
  saveData();
}
function resolveRoutine(day) {
  return {
    id: day.toLowerCase(),
    name: day,
    steps: data.library
      .filter(libStep => libStep.id !== 'plunge' || plungeEnabled())
      .map(libStep => {
        const override = data.overrides[day.toLowerCase()] && data.overrides[day.toLowerCase()][libStep.id];
        const seconds = override !== undefined ? override : libStep.seconds;
        const name = stepNameForDay(libStep, day);
        return { id: libStep.id, name, seconds };
      })
  };
}
function stepNameForDay(libStep, day) {
  if (libStep.id === 'meds') return MEDS_BY_DAY[day];
  if (libStep.id === 'shave') return SHAVE_BY_DAY[day];
  return libStep.name;
}

function buildDefaultData() {
  return {
    library: JSON.parse(JSON.stringify(DEFAULT_LIBRARY)),
    overrides: {},
    custom: JSON.parse(JSON.stringify(DEFAULT_CUSTOM))
  };
}

function currentTheme() {
  const explicit = document.documentElement.getAttribute('data-theme');
  if (explicit) return explicit;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  updateMetaTheme();
  render();
}
function updateMetaTheme() {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (!meta) return;
  meta.setAttribute('content', currentTheme() === 'dark' ? '#0d0d0c' : '#f4f4f2');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!document.documentElement.getAttribute('data-theme')) updateMetaTheme();
});
updateMetaTheme();

let data = loadData();
let state = { screen: 'home', routineId: null };
let runner = null;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.library) {
        // One-time order fix: shower before tea
        const teaIdx = parsed.library.findIndex(s => s.id === 'tea');
        const showerIdx = parsed.library.findIndex(s => s.id === 'shower');
        if (teaIdx !== -1 && showerIdx !== -1 && teaIdx < showerIdx) {
          const [shower] = parsed.library.splice(showerIdx, 1);
          parsed.library.splice(teaIdx, 0, shower);
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); } catch (e) {}
        }
        // One-time meds bump: 210 → 330 if user is still on the old default
        if (!parsed.migrations) parsed.migrations = {};

  const esc = (v) => {
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const rows = [['date', 'routine', 'step_index', 'step', 'planned_sec', 'actual_sec', 'delta_sec', 'skipped', 'likely_test']];
  sessions.forEach(sess => {
    const date = sess.date.slice(0, 10);
    const test = sess.likelyTest ? 1 : 0;
    sess.steps.forEach((s, i) => {
      rows.push([
        date,
        esc(sess.routineName),
        i + 1,
        esc(s.name),
        s.planned,
        s.actual,
        s.actual - s.planned,
        s.skipped ? 1 : 0,
        test
      ]);
    });
  });
  return rows.map(r => r.join(',')).join('\n');
}

function exportData() {
  const payload = {
    version: 'v8',
    exportedAt: new Date().toISOString(),
    data: data,
    history: loadHistory(),
    detail: loadDetail()
  };
  return JSON.stringify(payload, null, 2);
}

async function copyExport() {
  const json = exportData();
  try {
    await navigator.clipboard.writeText(json);
    return true;
  } catch (e) {
    // Fallback for iOS Safari without secure-context clipboard
    try {
      const ta = document.createElement('textarea');
      ta.value = json;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch (e2) { return false; }
  }
}

function importData(jsonStr) {
  try {
    const parsed = JSON.parse(jsonStr);
    const payload = parsed.data ? parsed : { data: parsed }; // accept either shape
    if (payload.data && payload.data.library && Array.isArray(payload.data.library)) {
      data = payload.data;
      saveData();
      if (payload.history && typeof payload.history === 'object') {
        saveHistory(payload.history);
      }
      if (Array.isArray(payload.detail)) {
        try { localStorage.setItem(DETAIL_KEY, JSON.stringify(payload.detail)); } catch (e) {}
      }
      return true;
    }
    return false;
  } catch (e) { return false; }
}

}

function maybeShowPrayerCard() {
  if (!runner || !state.routineId) return;
  const isDay = DAYS.some(d => d.toLowerCase() === state.routineId);

  const routine = getRoutine(state.routineId);

  const step = routine.steps[runner.index];
  if (step && step.id === 'prayer' && !runner.prayerShown) {
    runner.prayerShown = true;
    if (runner.prayerTimer) clearTimeout(runner.prayerTimer);

      if (state.screen === 'run' && runner) {

        const s = r && r.steps[runner.index];
        if (s && s.id === 'prayer') showPrayerCard();

    }, 600);
  }
}

function startRoutine(id) {
  const r = getRoutine(id);
  if (!r || r.steps.length === 0) return;

  if (r.soundReminder) {
    ensureAudio();
    showModal({
      title: 'Sound check',
      body: 'Make sure your phone isn\'t silenced and media volume is up.',
      test: true,
      primary: 'Start',
      secondary: 'Cancel',
      onPrimary: () => actuallyStartRoutine(id),
      onSecondary: () => {}
    });
    return;
  }

  actuallyStartRoutine(id);
}

function actuallyStartRoutine(id) {
  const r = getRoutine(id);
  if (!r) return;
  state = { screen: 'run', routineId: id };
  runner = {
    index: 0,
    remaining: r.steps[0].seconds,
    paused: false,
    pausedAt: null,
    elapsedTotal: 0,
    chimed: false,
    tickHandle: null,
    stepLog: [],
    stepElapsedAtStart: 0,
    addedSeconds: 0
  };
  ensureAudio();
  requestWakeLock();
  startTick();
  saveRunSnapshot();
  render();
  maybeShowPrayerCard();
}
function startTick() {
  if (runner.tickHandle) clearInterval(runner.tickHandle);
  let saveCounter = 0;
  runner.tickHandle = setInterval(() => {
    if (state.screen !== 'run' || !runner) return;
    if (!runner.paused) {
      runner.remaining -= 1;
      runner.elapsedTotal += 1;
      if (runner.remaining <= 0 && !runner.chimed) {
        runner.chimed = true;
        chime();
        maybeAutoAdvance();
      }
      saveCounter++;
      if (saveCounter >= 5) { saveRunSnapshot(); saveCounter = 0; }
    }
    updateRunUI();
  }, 1000);
}
function maybeAutoAdvance() {
  const r = getRoutine(state.routineId);
  if (!r || !r.autoAdvance) return;
  const step = r.steps[runner.index];
  if (step && step.hold) return;
  // Brief delay so the 0:00 and chime register before advancing
  setTimeout(() => {
    if (state.screen === 'run' && runner && !runner.paused && runner.remaining <= 0) {
      advance();
    }
  }, 700);
}
function stopTick() { if (runner && runner.tickHandle) clearInterval(runner.tickHandle); }
function logCurrentStep(skipped) {
  const r = getRoutine(state.routineId);
  const step = r.steps[runner.index];
  const actual = runner.elapsedTotal - runner.stepElapsedAtStart;
  runner.stepLog.push({
    name: step.name,
    planned: step.seconds,
    actual: actual,
    skipped: !!skipped
  });
  runner.stepElapsedAtStart = runner.elapsedTotal;
}
let lastAdvanceAt = 0;
function advance(opts) {
  if (!runner) return;
  // Debounce: ignore a second trigger within 600ms (accidental double-tap)
  const now = Date.now();
  if (now - lastAdvanceAt < 600) return;
  lastAdvanceAt = now;
  cancelPendingPrayerCard();
  const skipped = opts && opts.skipped;
  const r = getRoutine(state.routineId);
  logCurrentStep(skipped);
  haptic(skipped ? 'skip' : 'next');
  if (runner.paused) {
    runner.paused = false;
    runner.pausedAt = null;
    requestWakeLock();
  }
  if (runner.index >= r.steps.length - 1) { finishRoutine(); return; }
  runner.index += 1;
  runner.remaining = r.steps[runner.index].seconds;
  runner.chimed = false;
  saveRunSnapshot();
  render();
  maybeShowPrayerCard();
}
function finishRoutine() {
  cancelPendingPrayerCard();
  stopTick();
  releaseWakeLock();
  markToday();
  logSession(state.routineId, runner ? runner.stepLog : [], runner ? runner.elapsedTotal : 0);
  clearRunSnapshot();
  haptic('finish');
  state.screen = 'complete';
  render();
}

      <button class="bar-icon" id="sound" aria-label="Toggle sound">${soundIconSVG()}</button>
      <button class="bar-btn" id="skip">Skip ›</button>

  fill.style.width = (runner.index / routine.steps.length * 100) + '%';

  meta.className = 'run-meta';
  meta.innerHTML = `
    <span>${String(runner.index + 1).padStart(2, '0')} / ${String(routine.steps.length).padStart(2, '0')}</span>
    <span id="run-remaining">${formatRemaining()}</span>
  `;
  root.appendChild(meta);

  const body = document.createElement('div');
  body.className = 'run-body';

  const name = document.createElement('div');
  name.className = 'step-name';
  name.textContent = step.name;
  body.appendChild(name);

  const spacerTop = document.createElement('div');
  spacerTop.className = 'run-body-spacer';
  body.appendChild(spacerTop);

  const timerWrap = document.createElement('div');
  timerWrap.className = 'timer-wrap';
  const totalSec = step.seconds;
  const CIRC = 2 * Math.PI * 49;
  const frac = totalSec > 0 ? runner.remaining / totalSec : 0;
  const clamped = Math.max(0, Math.min(1, frac));
  const dashOffset = CIRC * (1 - clamped);
  const isDone = runner.remaining <= 0;
  const fillClasses = ['timer-ring-fill', isDone ? 'done' : '', runner.paused ? 'paused' : ''].filter(Boolean).join(' ');

  timerWrap.innerHTML = `
    <svg class="timer-ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="timer-ring-track" cx="50" cy="50" r="49"/>
      <circle id="ring-fill" class="${fillClasses}" cx="50" cy="50" r="49"
              stroke-dasharray="${CIRC}" stroke-dashoffset="${dashOffset}"/>
    </svg>
    <div class="timer-stack">
      <div id="timer" class="timer-text${isDone ? ' done' : ''}"><span id="timer-sign" class="timer-sign"${isDone ? '' : ' hidden'}>+</span>${fmtTime(Math.abs(runner.remaining))}</div>
      <div id="timer-over-label" class="timer-over-label"${isDone && !(runner.paused && runner.pausedAt) ? '' : ' hidden'}>over</div>
      <div id="timer-pause" class="timer-pause"${runner.paused && runner.pausedAt ? '' : ' hidden'}>
        <span id="timer-pause-time">${runner.paused && runner.pausedAt ? fmtTime(Math.floor((Date.now() - runner.pausedAt) / 1000)) : ''}</span>
        <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </div>
    </div>
  `;
  body.appendChild(timerWrap);

  // Long-press timer → edit current step's remaining
  let timerPressTimer;
  timerWrap.addEventListener('touchstart', () => {
    timerPressTimer = setTimeout(() => {
      haptic('longpress');
      const cur = fmtTime(Math.max(0, runner.remaining));
      const input = prompt('Set remaining time (M:SS):', cur);
      if (input == null) return;
      const parsed = parseTime(input);
      if (!isNaN(parsed) && parsed >= 0) {
        const diff = parsed - runner.remaining;
        if (diff > 0) runner.addedSeconds = (runner.addedSeconds || 0) + diff;
        runner.remaining = parsed;
        runner.chimed = parsed <= 0;
        saveRunSnapshot();
        updateRunUI();
      }
    }, 600);
  }, { passive: true });
  timerWrap.addEventListener('touchend', () => clearTimeout(timerPressTimer));
  timerWrap.addEventListener('touchmove', () => clearTimeout(timerPressTimer));

  const spacerBot = document.createElement('div');
  spacerBot.className = 'run-body-spacer';
  body.appendChild(spacerBot);

  root.appendChild(body);

  const eta = document.createElement('div');
  eta.className = 'run-eta';
  eta.id = 'run-eta';
  eta.innerHTML = formatETA();
  root.appendChild(eta);

  const controls = document.createElement('div');
  controls.className = 'run-controls';
  const isLast = runner.index === routine.steps.length - 1;
  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn' + (isDone ? ' done' : '');
  nextBtn.id = 'next';
  nextBtn.textContent = isLast ? 'Finish' : 'Complete';
  nextBtn.onclick = () => { ensureAudio(); advance(); };
  controls.appendChild(nextBtn);

  const sec = document.createElement('div');
  sec.className = 'sec-controls';
  sec.innerHTML = `
    <button class="sec-btn" id="back2">← Prev</button>
    <button class="sec-btn ${runner.paused ? 'paused' : ''}" id="pause">${runner.paused ? 'Resume' : 'Pause'}</button>
    <button class="sec-btn" id="add60">+0:30</button>
  `;

  root.appendChild(controls);

  bar.querySelector('#skip').onclick = () => advance({ skipped: true });

  bar.querySelector('#sound').onclick = () => {
    setSoundEnabled(!soundEnabled());
    bar.querySelector('#sound').innerHTML = soundIconSVG();
    haptic('pause');
  };
  sec.querySelector('#back2').onclick = () => {
    const now = Date.now();
    if (now - lastAdvanceAt < 600) return;
    lastAdvanceAt = now;
    if (runner.index > 0) {
      // Roll back the last log entry; restore stepElapsedAtStart
      if (runner.stepLog.length > 0) {
        const popped = runner.stepLog.pop();
        runner.stepElapsedAtStart -= popped.actual;
      }
      runner.index -= 1;
      runner.remaining = routine.steps[runner.index].seconds;
      runner.chimed = false;
      render();
    }
  };
  sec.querySelector('#pause').onclick = () => {
    runner.paused = !runner.paused;
    if (runner.paused) {
      runner.pausedAt = Date.now();
    } else {
      runner.pausedAt = null;
    }
    requestWakeLock();
    haptic('pause');
    saveRunSnapshot();
    render();
  };
  sec.querySelector('#add60').onclick = () => {
    runner.remaining += 30;
    runner.addedSeconds = (runner.addedSeconds || 0) + 30;
    if (runner.remaining > 0) runner.chimed = false;
    haptic('add');
    saveRunSnapshot();
    updateRunUI();
  };

  return root;
}

function updateRunUI() {
  const t = document.getElementById('timer');
  const sign = document.getElementById('timer-sign');
  const overLabel = document.getElementById('timer-over-label');
  const pauseEl = document.getElementById('timer-pause');
  const el = document.getElementById('run-remaining');
  const nb = document.getElementById('next');
  const ring = document.getElementById('ring-fill');
  if (!t || !runner) return;
  const isOver = runner.remaining <= 0;
  // Rebuild timer text preserving the sign span
  t.innerHTML = `<span id="timer-sign" class="timer-sign"${isOver ? '' : ' hidden'}>+</span>${fmtTime(Math.abs(runner.remaining))}`;
  if (ring) {
    const r = getRoutine(state.routineId);
    const totalSec = r.steps[runner.index].seconds;
    const CIRC = 2 * Math.PI * 49;
    const frac = totalSec > 0 ? runner.remaining / totalSec : 0;
    const clamped = Math.max(0, Math.min(1, frac));
    ring.setAttribute('stroke-dashoffset', CIRC * (1 - clamped));
  }
  // Pause clock inside ring
  if (pauseEl) {
    if (runner.paused && runner.pausedAt) {
      const timeSpan = document.getElementById('timer-pause-time');
      if (timeSpan) timeSpan.textContent = fmtTime(Math.floor((Date.now() - runner.pausedAt) / 1000));
      pauseEl.hidden = false;
    } else {
      pauseEl.hidden = true;
    }
  }
  // Over state: gold timer + "over" label under it inside the ring
  if (isOver) {
    t.classList.add('done');
    if (ring) ring.classList.add('done');
    if (overLabel) overLabel.hidden = runner.paused && runner.pausedAt ? true : false;
    if (nb) nb.classList.add('done');
  } else {
    t.classList.remove('done');
    if (ring) ring.classList.remove('done');
    if (overLabel) overLabel.hidden = true;
    if (nb) nb.classList.remove('done');
  }
  if (el) el.textContent = formatRemaining();
  const etaEl = document.getElementById('run-eta');
  if (etaEl) etaEl.innerHTML = formatETA();
}

    row.classList.add('dragging');

    e.dataTransfer.setData('text/plain', idx);
  };
  row.ondragend = () => {
    row.classList.remove('dragging');
    document.querySelectorAll('.edit-row').forEach(r => r.classList.remove('drag-over'));
  };
  row.ondragover = (e) => { e.preventDefault(); row.classList.add('drag-over'); };
  row.ondragleave = () => row.classList.remove('drag-over');
  row.ondrop = (e) => {
    e.preventDefault();
    const from = parseInt(e.dataTransfer.getData('text/plain'));
    moveLib(from, idx);
  };

  // Touch drag from the handle
  bindTouchReorder(handle, row, idx);

  return row;
}

function bindTouchReorder(handle, row, idx) {
  let startY = 0;
  let dragging = false;
  let pressTimer = null;
  let lastTargetIdx = idx;

  const onTouchStart = (e) => {
    if (e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    pressTimer = setTimeout(() => {
      dragging = true;
      row.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(20);
    }, 200);
  };

  const onTouchMove = (e) => {
    if (!dragging) {
      // Cancel long-press if finger moves too far before drag activated
      if (Math.abs(e.touches[0].clientY - startY) > 8) {
        clearTimeout(pressTimer);
      }
      return;
    }
    e.preventDefault();
    const y = e.touches[0].clientY;
    const rows = Array.from(document.querySelectorAll('.edit-row'));
    let targetIdx = idx;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i].getBoundingClientRect();
      if (y >= r.top && y <= r.bottom) { targetIdx = i; break; }
    }
    if (targetIdx !== lastTargetIdx) {
      rows.forEach(r => r.classList.remove('drop-target'));
      if (rows[targetIdx]) rows[targetIdx].classList.add('drop-target');
      lastTargetIdx = targetIdx;
    }
  };

  const onTouchEnd = () => {
    clearTimeout(pressTimer);
    if (dragging) {
      dragging = false;
      row.classList.remove('dragging');
      document.querySelectorAll('.edit-row').forEach(r => r.classList.remove('drop-target'));
      if (lastTargetIdx !== idx) moveLib(idx, lastTargetIdx);
    }
  };

  handle.addEventListener('touchstart', onTouchStart, { passive: true });
  handle.addEventListener('touchmove', onTouchMove, { passive: false });
  handle.addEventListener('touchend', onTouchEnd);
  handle.addEventListener('touchcancel', onTouchEnd);
}

function moveLib(from, to) {
  if (from === to || from < 0 || to < 0 || from >= data.library.length || to >= data.library.length) return;
  const moved = data.library.splice(from, 1)[0];
  data.library.splice(to, 0, moved);
  saveData();
  render();
}

    const hold = document.createElement('button');
    hold.className = 'edit-row-hold' + (step.hold ? ' active' : '');
    hold.setAttribute('aria-label', 'Hold for tap');
    hold.title = 'Hold: wait for tap even on auto-advance';
    hold.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;
    hold.onclick = (e) => {
      e.stopPropagation();
      step.hold = !step.hold;
      saveData();
      hold.classList.toggle('active', step.hold);
    };
    row.appendChild(hold);
  }

  const del = document.createElement('button');
  del.className = 'edit-row-delete';
  del.textContent = '×';
  del.onclick = () => {
    if (routine.steps.length <= 1) return;
    routine.steps.splice(idx, 1);
    saveData();
    render();
  };
  row.appendChild(del);

  // Desktop drag
  row.ondragstart = (e) => {
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', idx);
  };
  row.ondragend = () => {
    row.classList.remove('dragging');
    document.querySelectorAll('.edit-row').forEach(r => r.classList.remove('drag-over'));
  };
  row.ondragover = (e) => { e.preventDefault(); row.classList.add('drag-over'); };
  row.ondragleave = () => row.classList.remove('drag-over');
  row.ondrop = (e) => {
    e.preventDefault();
    const from = parseInt(e.dataTransfer.getData('text/plain'));
    if (from === idx) return;
    const moved = routine.steps.splice(from, 1)[0];
    routine.steps.splice(idx, 0, moved);
    saveData();
    render();
  };

  // Touch drag
  bindTouchReorderCustom(handle, row, idx, routine);

  return row;
}

function bindTouchReorderCustom(handle, row, idx, routine) {
  let startY = 0, dragging = false, pressTimer = null, lastTargetIdx = idx;

  const onStart = (e) => {
    if (e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    pressTimer = setTimeout(() => {
      dragging = true;
      row.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(20);
    }, 200);
  };
  const onMove = (e) => {
    if (!dragging) {
      if (Math.abs(e.touches[0].clientY - startY) > 8) clearTimeout(pressTimer);
      return;
    }
    e.preventDefault();
    const y = e.touches[0].clientY;
    const rows = Array.from(document.querySelectorAll('.edit-row'));
    let targetIdx = idx;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i].getBoundingClientRect();
      if (y >= r.top && y <= r.bottom) { targetIdx = i; break; }
    }
    if (targetIdx !== lastTargetIdx) {
      rows.forEach(r => r.classList.remove('drop-target'));
      if (rows[targetIdx]) rows[targetIdx].classList.add('drop-target');
      lastTargetIdx = targetIdx;
    }
  };
  const onEnd = () => {
    clearTimeout(pressTimer);
    if (dragging) {
      dragging = false;
      row.classList.remove('dragging');
      document.querySelectorAll('.edit-row').forEach(r => r.classList.remove('drop-target'));
      if (lastTargetIdx !== idx && lastTargetIdx >= 0 && lastTargetIdx < routine.steps.length) {
        const moved = routine.steps.splice(idx, 1)[0];
        routine.steps.splice(lastTargetIdx, 0, moved);
        saveData();
        render();
      }
    }
  };

  handle.addEventListener('touchstart', onStart, { passive: true });
  handle.addEventListener('touchmove', onMove, { passive: false });
  handle.addEventListener('touchend', onEnd);
  handle.addEventListener('touchcancel', onEnd);
}

function renderSettings() {
  const root = document.createElement('div');
  root.style.cssText = 'flex:1;display:flex;flex-direction:column;';

  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = `
    <button class="bar-btn" id="back">‹ Back</button>
    <div class="bar-title">Settings</div>
    <span style="width:3rem"></span>
  `;
  root.appendChild(bar);

  const wrap = document.createElement('div');
  wrap.className = 'edit';

  // Audio test
  const audioSection = document.createElement('div');
  audioSection.className = 'settings-section';
  audioSection.innerHTML = `
    <div class="settings-label">Test Sound</div>
    <div class="settings-help">If you can't hear this, check the physical Ring/Silent switch on the left side of your iPhone (orange = silent). Then raise media volume while audio is playing.</div>
  `;
  const testBtn = document.createElement('button');
  testBtn.className = 'settings-btn-primary';
  testBtn.textContent = 'Play Chime';
  testBtn.onclick = () => {
    ensureAudio();
    // Small delay so AudioContext is fully resumed before chime
    setTimeout(() => chime(), 50);
    testBtn.textContent = '♪ Playing…';
    setTimeout(() => { testBtn.textContent = 'Play Chime'; }, 1500);
  };
  audioSection.appendChild(testBtn);
  wrap.appendChild(audioSection);

  // Export Times (CSV)
  const timesSection = document.createElement('div');
  timesSection.className = 'settings-section';
  const sessionCount = loadDetail().length;
  timesSection.innerHTML = `
    <div class="settings-label">Export Times</div>
    <div class="settings-help">${sessionCount} completed session${sessionCount === 1 ? '' : 's'} logged. Copy your real step times as CSV. Share with Claude to retune the defaults.</div>
  `;
  const timesBtn = document.createElement('button');
  timesBtn.className = 'settings-btn-primary';
  timesBtn.textContent = sessionCount > 0 ? 'Copy Times CSV' : 'No sessions yet';
  timesBtn.disabled = sessionCount === 0;
  if (sessionCount > 0) {
    timesBtn.onclick = async () => {
      const csv = exportTimesCSV();
      let ok = false;
      try { await navigator.clipboard.writeText(csv); ok = true; } catch (e) {}
      timesBtn.textContent = ok ? '✓ Copied' : 'Select below';
      if (!ok) {
        const fb = document.createElement('textarea');
        fb.className = 'settings-fallback';
        fb.value = csv;
        fb.readOnly = true;
        fb.onclick = () => fb.select();
        timesSection.appendChild(fb);
      }
      setTimeout(() => { timesBtn.textContent = 'Copy Times CSV'; }, 2500);
    };
  }
  timesSection.appendChild(timesBtn);
  wrap.appendChild(timesSection);

  // Export
  const exportSection = document.createElement('div');
  exportSection.className = 'settings-section';
  exportSection.innerHTML = `
    <div class="settings-label">Export</div>
    <div class="settings-help">Copy all routines, overrides, and history as JSON. Share with Claude to evolve the app.</div>
  `;
  const exportBtn = document.createElement('button');
  exportBtn.className = 'settings-btn-primary';
  exportBtn.textContent = 'Copy to Clipboard';
  exportBtn.onclick = async () => {
    const ok = await copyExport();
    exportBtn.textContent = ok ? '✓ Copied' : 'Copy failed — select below';
    if (!ok) {
      const fb = document.createElement('textarea');
      fb.className = 'settings-fallback';
      fb.value = exportData();
      fb.readOnly = true;
      fb.onclick = () => fb.select();
      exportSection.appendChild(fb);
    }
    setTimeout(() => { exportBtn.textContent = 'Copy to Clipboard'; }, 2500);
  };
  exportSection.appendChild(exportBtn);
  wrap.appendChild(exportSection);

  // Import
  const importSection = document.createElement('div');
  importSection.className = 'settings-section';
  importSection.innerHTML = `
    <div class="settings-label">Import</div>
    <div class="settings-help">Paste exported JSON to replace current data.</div>
  `;
  const ta = document.createElement('textarea');
  ta.className = 'settings-textarea';
  ta.placeholder = 'Paste exported JSON here…';
  ta.spellcheck = false;
  importSection.appendChild(ta);

  const importBtn = document.createElement('button');
  importBtn.className = 'settings-btn-primary';
  importBtn.textContent = 'Import';
  importBtn.onclick = () => {
    if (!ta.value.trim()) {
      importBtn.textContent = 'Paste first';
      setTimeout(() => importBtn.textContent = 'Import', 1500);
      return;
    }
    if (!confirm('Replace all current data with imported JSON?')) return;
    const ok = importData(ta.value);
    if (ok) {
      importBtn.textContent = '✓ Imported';
      setTimeout(() => { state = { screen: 'home' }; render(); }, 800);
    } else {
      importBtn.textContent = 'Invalid JSON';
      setTimeout(() => importBtn.textContent = 'Import', 2000);
    }
  };
  importSection.appendChild(importBtn);
  wrap.appendChild(importSection);

  // Reset
  const danger = document.createElement('div');
  danger.className = 'settings-section';
  danger.innerHTML = `<div class="settings-label">Reset</div>
    <div class="settings-help">Wipe all data and restore defaults.</div>`;
  const resetBtn = document.createElement('button');
  resetBtn.className = 'edit-delete-routine';
  resetBtn.textContent = 'Reset All Data';
  resetBtn.style.marginTop = '0.5rem';
  resetBtn.onclick = () => {
    if (!confirm('Erase all routines, overrides, and history?')) return;
    if (!confirm('Really sure? Cannot be undone.')) return;
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(HISTORY_KEY);
      localStorage.removeItem(DETAIL_KEY);
    } catch (e) {}
    data = buildDefaultData();
    state = { screen: 'home' };
    render();
  };
  danger.appendChild(resetBtn);
  wrap.appendChild(danger);

  root.appendChild(wrap);
  bar.querySelector('#back').onclick = () => { state = { screen: 'home' }; render(); };
  return root;
}

function parseTime(str) {
  if (!str) return 0;
  str = str.trim();
  if (str.includes(':')) {
    const [m, s] = str.split(':');
    return (parseInt(m) || 0) * 60 + (parseInt(s) || 0);
  }
  const n = parseInt(str);
  return isNaN(n) ? 0 : n;
}

// Digit-rolling MM:SS input. Keystrokes shift digits left.
// Type "1234" → "12:34". Backspace shifts right back.
function bindTimeInput(input, getSeconds, onChange) {
  let digits = secondsToDigits(getSeconds());
  input.value = formatDigits(digits);
  input.inputMode = 'numeric';
  input.setAttribute('autocomplete', 'off');

  input.addEventListener('focus', () => {
    digits = '';
    input.value = formatDigits(digits);
    placeCaretEnd(input);
  });
  input.addEventListener('beforeinput', (e) => {
    e.preventDefault();
    if (e.inputType === 'insertText' && /^\d$/.test(e.data || '')) {
      if (digits.length < 4) {
        digits += e.data;
        input.value = formatDigits(digits);
        placeCaretEnd(input);
      }
    } else if (e.inputType === 'deleteContentBackward') {
      digits = digits.slice(0, -1);
      input.value = formatDigits(digits);
      placeCaretEnd(input);
    }
  });
  input.addEventListener('blur', () => {
    const secs = digitsToSeconds(digits);
    onChange(secs);
    input.value = fmtTime(secs);
  });
}
function secondsToDigits(sec) {
  // Render seconds as right-aligned MMSS digits
  if (!sec || sec < 0) return '';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return (m > 0 ? String(m) : '') + String(s).padStart(2, '0');
}
function digitsToSeconds(digits) {
  if (!digits) return 0;
  const padded = digits.padStart(3, '0'); // ensure at least 1 minute digit + 2 second digits
  const m = parseInt(padded.slice(0, -2)) || 0;
  const s = parseInt(padded.slice(-2)) || 0;
  return m * 60 + s;
}
function formatDigits(digits) {
  if (!digits) return '0:00';
  const padded = digits.padStart(3, '0');
  const m = padded.slice(0, -2).replace(/^0+/, '') || '0';
  const s = padded.slice(-2);
  return `${m}:${s}`;
}
function placeCaretEnd(input) {
  setTimeout(() => {
    try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
  }, 0);
}

// Boot: if a fresh in-flight snapshot exists (e.g. iOS reloaded the PWA),
// jump straight back into the run instead of showing home + banner.
const AUTO_RESUME_MS = 30 * 60 * 1000;
(function boot() {
  // Best-effort native lock (Android/installed PWA honor this; iOS silently ignores)
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(() => {});
    }
  } catch (e) {}
  const snap = loadRunSnapshot();
  // Audio can't initialize without a user gesture; unlock on the first touch.
  const unlock = () => { ensureAudio(); document.removeEventListener('touchstart', unlock); };
  document.addEventListener('touchstart', unlock, { passive: true });
  if (snap && Date.now() - snap.savedAt < AUTO_RESUME_MS) {
    resumeFromSnapshot(snap);
    return;
  }
  render();
})();
</script>
